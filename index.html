  const r=repCapRow();
  const base=String((r&&r.codigoProducto)||c.id||'foto').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40);
  const files=c.files.map((it,i)=>{ const ext=((it.file.name||'').match(/\.([a-zA-Z0-9]{2,5})$/)||[])[1]||'jpg'; return new File([it.file],'Veri_'+base+'_'+(i+1)+'.'+ext,{type:it.file.type||'image/jpeg'}); });
  try{ if(navigator.canShare && navigator.canShare({files})){ await navigator.share({files}); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; }
  for(const f of files){
    try{ const url=URL.createObjectURL(f), a=document.createElement('a'); a.href=url; a.download=f.name; a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); },4000); }catch(e){ console.warn(e); }
    await new Promise(res=>setTimeout(res,700));
  }
}
async function repCapSubmit(){
  const c=state.repCapture, r=repCapRow(); if(!c||!r||c.busy||!c.files.length) return;
  c.busy=true; repCapLiveStop(); repCapRenderThumbs();
  try{
    let first=null;
    for(const it of c.files){            // cada archivo se sube una sola vez, aunque haya que reintentar el envío
      if(!it.path){ it.path=await uploadVeriPhoto(it.file, r.id, {noSave:true}); }
      if(!it.saved){ await insertRepPhoto(r.id, it.path, it.file.name); it.saved=true; }
      if(!first) first=it.path;
    }
    const now=new Date().toISOString();
    await repPatchSafe(r.id,
      {estado:'sent', archivado:false, foto_path:first, foto_subida_en:now, revision_estado:'pendiente', revision_motivo:'', en_proceso_por:null, en_proceso_desde:null},
      {estado:'sent', archivado:false, foto_path:first, foto_subida_en:now, revision_estado:'pendiente', revision_motivo:''});
    Object.assign(r,{estado:'sent',archivado:false,fotoPath:first,fotoSubidaEn:now,revisionEstado:'pendiente',revisionMotivo:'',enProcesoPor:'',enProcesoDesde:null});
    const n=c.files.length;
    try{ await refreshRepPhotos(); }catch(e2){ console.warn(e2); }
    await closeRepCapture(false);
    repShowSent(n);
    render();
  }catch(e){
    console.error(e); c.busy=false; repCapRenderThumbs();
    toast('No se pudo enviar. Tus fotos siguen aquí: toca Enviar para reintentar.');
  }
}
async function closeRepCapture(release){
  const c=state.repCapture; repCapLiveStop();
  const m=document.getElementById('repCaptureModal'); if(m) m.remove();
  if(c){ c.files.forEach(f=>{ try{URL.revokeObjectURL(f.url);}catch(e){} }); state.repCapture=null; if(release) await repRelease(c.id,true); }
}

/* ---- Cámara continua dentro de la app (sin zoom propio: el celular ya cambia de lente) ---- */
function repCapLiveStop(){
  const c=state.repCapture; if(c&&c.stream){ try{ c.stream.getTracks().forEach(t=>t.stop()); }catch(e){} c.stream=null; }
  const b=document.getElementById('repCapLive'); if(b) b.remove();
  if(c) repCapRenderThumbs();
}

/* ---- Actualización en vivo (cada 10 s, igual que el carrito) ---- */
let __repPolling=false;
function repSig(list){ return (list||[]).map(r=>[r.id,r.estado,r.archivado?1:0,r.enProcesoPor||'',r.revisionEstado||'',r.fotoPath||''].join('~')).join('|'); }
async function pollRepeticiones(force){
  if(__repPolling) return; __repPolling=true;
  try{
    const raw=await sb('repeticiones?select=*&order=fecha.desc',{silent:true});
    const mapped=(raw||[]).map(mapRepRow);
    if(force || repSig(mapped)!==repSig(state.repeticiones)){
      state.repeticiones=mapped;
      await refreshRepPhotos();
      if(state.tab==='rep' && state.repView==='list') render();
      refreshVeriPhotoUrls();
    }
  }catch(e){ /* sin red: se reintenta en el siguiente ciclo */ }
  finally{ __repPolling=false; }
}
setInterval(()=>{ if(document.hidden || !state.session) return; if(state.tab==='rep' && state.repView==='list') pollRepeticiones(); }, 10000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && state.session && state.tab==='rep' && state.repView==='list') pollRepeticiones(); });

/* Visor de revisión de fotografías: zoom, giro, ajuste y arrastre */
function openVeriPhotoPreview(url, title){
  let modal=document.getElementById('veriPhotoModal');
  if(!modal){
    modal=document.createElement('div'); modal.id='veriPhotoModal'; modal.className='veri-photo-modal'; modal.hidden=true;
    modal.innerHTML=`<div class="veri-photo-modal-head"><div class="veri-photo-modal-title" id="veriPhotoModalTitle">Revisión de fotografía</div><button type="button" id="veriPhotoClose" aria-label="Cerrar vista previa">✕ Cerrar</button></div><div class="veri-photo-modal-controls"><button type="button" id="veriPhotoZoomOut" aria-label="Alejar">−</button><span class="veri-photo-zoom-label" id="veriPhotoZoomLabel">100%</span><button type="button" id="veriPhotoZoomIn" aria-label="Acercar">＋</button><button type="button" id="veriPhotoActual">100%</button><button type="button" id="veriPhotoFit">Ajustar</button><button type="button" id="veriPhotoRotate">↻ Girar</button><a id="veriPhotoDownload" href="#" target="_blank" rel="noopener">Abrir/descargar original ↗</a></div><div class="veri-photo-stage" id="veriPhotoStage"><img id="veriPhotoLarge" alt="Vista ampliada para evaluar la calidad de la fotografía" draggable="false"></div><div class="veri-photo-modal-note">Usa +/− o la rueda para revisar el enfoque. Cuando esté ampliada, arrastra la imagen para inspeccionar detalles.</div>`;
    document.body.appendChild(modal);
    const img=modal.querySelector('#veriPhotoLarge'), stage=modal.querySelector('#veriPhotoStage');
    let scale=1, rotation=0, x=0, y=0, dragging=false, startX=0, startY=0, originX=0, originY=0;
    let ax=0,ay=0;const update=()=>{const c=veriClampPan(img,stage,scale,rotation,x,y,ax,ay);x=c[0];y=c[1];ax=x;ay=y;img.style.transform=`translate(${x}px, ${y}px) scale(${scale}) rotate(${rotation}deg)`;modal.querySelector('#veriPhotoZoomLabel').textContent=`${Math.round(scale*100)}%`;};
    const reset=(fit=true)=>{scale=fit?1:1;rotation=0;x=0;y=0;update();};
    const zoom=(delta)=>{scale=Math.max(0.5,Math.min(6,scale+delta));update();};
    modal.querySelector('#veriPhotoZoomIn').onclick=()=>zoom(.25);
    modal.querySelector('#veriPhotoZoomOut').onclick=()=>zoom(-.25);
    modal.querySelector('#veriPhotoActual').onclick=()=>{scale=1;x=0;y=0;update();};
    modal.querySelector('#veriPhotoFit').onclick=()=>{scale=1;x=0;y=0;rotation=0;update();};
    modal.querySelector('#veriPhotoRotate').onclick=()=>{rotation=(rotation+90)%360;update();};
    modal.querySelector('#veriPhotoClose').onclick=()=>{modal.hidden=true;document.body.style.overflow='';};
    modal.addEventListener('click',e=>{if(e.target===modal){modal.hidden=true;document.body.style.overflow='';}});
    stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.15:-.15);},{passive:false});
    stage.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startY=e.clientY;originX=x;originY=y;stage.setPointerCapture?.(e.pointerId);});
    stage.addEventListener('pointermove',e=>{if(!dragging)return;x=originX+(e.clientX-startX);y=originY+(e.clientY-startY);update();});
    const endDrag=()=>{dragging=false;};stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
    modal._setImage=(src,caption)=>{img.src=src;modal.querySelector('#veriPhotoModalTitle').textContent=caption||'Revisión de fotografía';modal.querySelector('#veriPhotoDownload').href=src;reset(true);};
  }
  modal._setImage(url,title);modal.hidden=false;document.body.style.overflow='hidden';
  const close=()=>{modal.hidden=true;document.body.style.overflow='';};
  const esc=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}};document.addEventListener('keydown',esc);
}

/* ===================== Init ===================== */
boot();
</script>

<style id="veri-cart-filter">
.cart-person-chips{display:flex;flex-wrap:wrap;gap:8px}
.cart-person-chip{cursor:pointer;border:1px solid var(--glass-border);background:var(--input-bg);color:var(--text-2);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px}
.cart-person-chip b{margin-left:4px;color:var(--text-1)}
.cart-person-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cart-person-chip.active b{color:#fff}
.scan-cart-owner{margin:10px 0 0;padding:8px 10px;border-radius:12px;background:rgba(245,158,11,.14);font-size:13px;line-height:1.35;color:#b45309;font-weight:600;white-space:normal}
[data-theme="dark"] .scan-cart-owner{color:#fbbf24}
</style>
<style id="veri-cart-key">
.cart-key-chip{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 6px;padding:10px 12px;border-radius:14px;background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.22);font-size:13px;font-weight:650}
.cart-key-chip b{font-size:20px;letter-spacing:.18em;font-variant-numeric:tabular-nums;color:var(--accent)}
</style>

<style id="veri-final-nav-topbar-fab">
/* ---- Barra flotante inferior (móvil / iPhone): más redondeada y dentro de los bordes redondeados del equipo ---- */
@media(max-width:700px){
  #root .bottomnav,.bottomnav{
    left:50%!important;right:auto!important;transform:translateX(-50%)!important;
    width:calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))!important;max-width:520px!important;
    bottom:max(14px,calc(env(safe-area-inset-bottom,0px) + 6px))!important;
    border-radius:34px!important;padding:7px 8px!important;
    overflow:hidden;
  }
  .bottomnav .nav-btn{border-radius:26px!important}
  .bottomnav .nav-btn.active{border-radius:26px!important}
  .app{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))!important}
  /* Avatar legible: el fondo transparente dejaba las iniciales blancas invisibles en modo claro */
  .topbar .topbar-avatar{background:var(--accent)!important;color:#fff!important;width:34px!important;height:34px!important;border-radius:50%!important;overflow:hidden}
}
/* ---- Escritorio: notificaciones y perfil arriba a la derecha ---- */
@media(min-width:701px){
  .topbar .topbar-actions{display:flex!important;align-items:center;gap:10px!important;margin-left:14px!important;flex:none}
  .topbar .topbar-icon-btn{display:inline-flex!important;width:38px!important;height:38px!important;border-radius:50%!important;background:rgba(var(--accent-rgb),.09)!important;border:1px solid rgba(var(--accent-rgb),.2)!important;color:var(--accent)!important;position:relative}
  .topbar .topbar-icon-btn svg{width:18px;height:18px}
  .topbar .topbar-avatar{display:inline-flex!important;width:38px!important;height:38px!important;border-radius:50%!important;background:var(--accent)!important;color:#fff!important;border:0!important;overflow:hidden;align-items:center;justify-content:center;cursor:pointer}
  /* ---- Botón Veri AI de escritorio con el mismo diseño que en el celular ---- */
  .veri-fab{
    width:56px!important;height:56px!important;border-radius:50%!important;
    background:rgba(var(--accent-rgb),.10)!important;border:1.5px solid rgba(var(--accent-rgb),.30)!important;
    color:var(--accent)!important;box-shadow:0 10px 28px rgba(var(--accent-rgb),.18),0 2px 6px rgba(0,0,0,.08)!important;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .veri-fab::after{display:none!important}
  .veri-fab svg{width:26px!important;height:26px!important;color:var(--accent)!important;stroke:var(--accent)!important}
  .veri-fab .veri-fab-badge{display:none!important}
  .veri-fab:hover{box-shadow:0 14px 32px rgba(var(--accent-rgb),.28),0 2px 6px rgba(0,0,0,.1)!important}
}
</style>

<style id="veri-rep-subtabs-fit">
.pill-toggle:has([data-repview]){display:flex!important;overflow:hidden!important;width:100%;gap:2px}
.pill-toggle:has([data-repview]) button{flex:1 1 auto!important;min-width:0!important;padding-left:8px!important;padding-right:8px!important;font-size:14px!important;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.pill-toggle:has([data-repview]) .review-count{min-width:17px;height:17px;font-size:10px;padding:0 4px;flex:none}
</style>
