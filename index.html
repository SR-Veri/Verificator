      toast(t('errorImport'));
    }
  }
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast(t('copied'))).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); toast(t('copied')); }catch(e){}
  document.body.removeChild(ta);
}
document.addEventListener('click', (e)=>{
  const copyBtn = e.target.closest('[data-copy]');
  if(copyBtn){ copyText(decodeURIComponent(copyBtn.dataset.copy)); return; }
  const useBtn = e.target.closest('[data-usename]');
  if(useBtn){ const nm = document.getElementById('namingNombre'); if(nm){ nm.value = decodeURIComponent(useBtn.dataset.usename); nm.dispatchEvent(new Event('input', {bubbles:true})); } return; }
  const pickBtn = e.target.closest('[data-pick-suffix]');
  if(pickBtn){
    const codigo = decodeURIComponent(pickBtn.dataset.pickSuffix);
    const idx = state.index[state.scanBase];
    const producto = idx && idx.map.get(codigo);
    if(producto){
      state.scanResult = { status:'exact', producto, bySuffix:true, codigoEscaneado:codigo };
      updateScanResultDOM();
      const input = document.getElementById('scanInput'); if(input) input.value = codigo;
      vibrateFor('exact'); beepFor('exact');
      // También está en la base 2026 (por eso apareció en la lista de coincidencias):
      // el sheet unificado ya ofrece el botón "Agregar a lista" si corresponde.
    }
    return;
  }
});

/* ===================== Notificaciones (administración → usuarios) =====================
   - Tabla Supabase "notificaciones" (ver veri_notificaciones.sql). Se muestran en la campana.
   - El administrador siempre puede enviar; los coadministradores solo si el administrador lo permite
     (config.coadmin_can_notify). Lo leído se guarda por persona en este dispositivo (localStorage). */
const NOTIF_TYPES = {
  novedad:{label:'Novedad', icon:'✨'},
  nota:{label:'Nota', icon:'📝'},
  aviso:{label:'Aviso importante', icon:'⚠️'}
};
state.notif = { list:[], loaded:false, error:'', coAdminCanSend:false, draft:{tipo:'novedad',titulo:'',mensaje:''}, sending:false };
let notifPollTimer = null;
let notifPanelSeenAt = 0;
const NOTIF_MISSING_RE = /42P01|PGRST205|does not exist|Could not find the table/i;

function notifMe(){ return normalize(state.session||''); }
function canSendNotif(){ return isAdmin() || (isCoAdmin() && !!state.notif.coAdminCanSend); }
function notifSeenKey(){ return 'veri_notif_seen_'+notifMe(); }
function notifTs(n){ const v=Date.parse(n && n.creado_en); return Number.isFinite(v) ? v : 0; }
function notifLastSeen(){
  let v=null; try{ v=localStorage.getItem(notifSeenKey()); }catch(e){}
  const n = v ? Number(v) : NaN;
  return Number.isFinite(n) ? n : Date.now() - 14*24*3600*1000;
}
function notifMarkSeen(){
  const newest = Math.max(0, ...state.notif.list.map(notifTs));
  if(newest){ try{ localStorage.setItem(notifSeenKey(), String(Math.max(newest, notifLastSeen()))); }catch(e){} }
  updateBellBadge();
}
function notifUnread(){
  const seen=notifLastSeen(), me=notifMe();
  return state.notif.list.filter(n=>notifTs(n)>seen && normalize(n.autor_codigo||'')!==me);
}
function updateBellBadge(){
  const b=document.getElementById('bellBadge'); if(!b) return;
  const c=notifUnread().length;
  b.textContent = c ? (c>9 ? '9+' : String(c)) : '';
  const btn=document.getElementById('topbarBellBtn');
  if(btn) btn.setAttribute('aria-label', c ? `Notificaciones (${c} sin leer)` : 'Notificaciones');
}
function notifWhen(ts){
  const d=new Date(ts); if(isNaN(d)) return '';
  const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1) return 'Ahora';
  if(m<60) return `Hace ${m} min`;
  const h=Math.round(m/60);
  if(h<24) return `Hace ${h} h`;
  return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
}

/* ---------- Datos ---------- */
async function fetchNotifications(){ return await sb('notificaciones?select=*&order=creado_en.desc&limit=50',{silent:true}); }
async function loadNotifSettings(){
  try{
    const rows = await sb('config?select=coadmin_can_notify&id=eq.1',{silent:true});
    state.notif.coAdminCanSend = !!(rows && rows[0] && rows[0].coadmin_can_notify);
  }catch(e){ state.notif.coAdminCanSend = false; }
}
function notifSystemPopup(n){
  try{
    if('Notification' in window && window.isSecureContext && Notification.permission==='granted'){
      new Notification(n.titulo||'Veri',{body:String(n.mensaje||'').slice(0,140),icon:'icon.svg',tag:'veri-notif-'+n.id});
    }
  }catch(e){}
}
async function refreshNotifications(){
  if(!state.session) return;
  let list;
  try{ list = await fetchNotifications(); state.notif.error=''; }
  catch(e){ state.notif.error=String(e && e.message || e); state.notif.loaded=true; renderNotifHistoryInPlace(); return; }
  list = Array.isArray(list) ? list : [];
  const prevIds = new Set(state.notif.list.map(n=>String(n.id)));
  const wasLoaded = state.notif.loaded;
  state.notif.list = list; state.notif.loaded = true;
  if(wasLoaded){
    const me=notifMe(), seen=notifLastSeen();
    list.filter(n=>!prevIds.has(String(n.id)) && normalize(n.autor_codigo||'')!==me && notifTs(n)>seen).slice(0,3).forEach(notifSystemPopup);
  }
  if(document.getElementById('veriNotifOverlay')) notifMarkSeen();
  updateBellBadge(); renderNotifPanelList(); renderNotifHistoryInPlace();
}
function startNotifPolling(){
  if(notifPollTimer) return;
  const tick=()=>{ if(document.hidden || !state.session) return; loadNotifSettings(); refreshNotifications(); };
  notifPollTimer = setInterval(tick, 60000);
  document.addEventListener('visibilitychange', tick);
}
function initNotifications(){
  if(!state.session) return;
  loadNotifSettings(); refreshNotifications(); startNotifPolling();
}

/* ---------- Panel de la campana (todos los usuarios) ---------- */
function notifItemHtml(n, unread){
  const ty = NOTIF_TYPES[n.tipo] || NOTIF_TYPES.novedad;
  return `<div class="notif-item notif-${escapeHtml(n.tipo||'novedad')} ${unread?'unread':''}">
    <div class="notif-item-icon" aria-hidden="true">${ty.icon}</div>
    <div class="notif-item-body">
      <div class="notif-item-top"><strong>${escapeHtml(n.titulo)}</strong>${unread?'<span class="notif-new">Nuevo</span>':''}</div>
      <p>${escapeHtml(n.mensaje).replace(/\n/g,'<br>')}</p>
      <div class="notif-item-meta">${ty.label} · ${escapeHtml(n.autor_nombre||'Administración')} · ${notifWhen(n.creado_en)}</div>
    </div>
  </div>`;
}
function renderNotifPanelList(){
  const el=document.getElementById('notifPanelList'); if(!el) return;
  const list=state.notif.list;
  if(state.notif.error && !list.length){ el.innerHTML=`<div class="empty">No se pudieron cargar las notificaciones.</div>`; return; }
  if(!list.length){ el.innerHTML=`<div class="empty">Aún no hay notificaciones.</div>`; return; }
  const me=notifMe();
  el.innerHTML = list.map(n=>notifItemHtml(n, notifTs(n)>notifPanelSeenAt && normalize(n.autor_codigo||'')!==me)).join('');
}
function closeNotifPanel(){ const el=document.getElementById('veriNotifOverlay'); if(el) el.remove(); }
function openNotifPanel(){
  closeNotifPanel();
  notifPanelSeenAt = notifLastSeen();
  const ov=document.createElement('div');
  ov.id='veriNotifOverlay'; ov.className='modal-overlay';
  ov.innerHTML = `<div class="modal-sheet glass notif-sheet" role="dialog" aria-label="Notificaciones">
    <div class="modal-header"><h3 class="notif-title">${ICONS.bell} Notificaciones</h3><button type="button" class="modal-close" id="notifCloseBtn" aria-label="Cerrar">${ICONS.x}</button></div>
    <div id="notifPanelList" class="notif-list"></div>
    <div class="notif-foot">
      ${canSendNotif() ? `<button type="button" class="btn sm" id="notifComposeBtn">Redactar notificación</button>` : ''}
      <button type="button" class="btn ghost sm" id="notifDeviceBtn">Activar avisos en este dispositivo</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeNotifPanel(); });
  document.getElementById('notifCloseBtn').onclick = closeNotifPanel;
  document.getElementById('notifDeviceBtn').onclick = enableDeviceNotifications;
  const cb=document.getElementById('notifComposeBtn');
  if(cb) cb.onclick=()=>{
    closeNotifPanel(); stopCamera();
    state.tab='settings'; state.adminSectionsOpen={...state.adminSectionsOpen, notifications:true};
    render();
    setTimeout(()=>{ const s=document.querySelector('[data-togglesection="notifications"]'); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); },60);
  };
  renderNotifPanelList();
  notifMarkSeen();
  refreshNotifications();
}
async function enableDeviceNotifications(){
  if(!('Notification' in window)){ toast('Este navegador no admite notificaciones.'); return; }
  if(!window.isSecureContext){ toast('Para activar notificaciones, abre Veri desde HTTPS (no desde un archivo local).'); return; }
  try{
    let permission=Notification.permission;
    if(permission==='default') permission=await Notification.requestPermission();
    if(permission==='granted'){
      new Notification('Veri', {body:'¡Las notificaciones están activadas en este dispositivo!', icon:'icon.svg', tag:'veri-notification-test'});
      toast('Avisos activados en este dispositivo.');
    }else if(permission==='denied'){ toast('Las notificaciones están bloqueadas en los permisos del navegador.'); }
    else{ toast('No se concedió permiso para notificaciones.'); }
  }catch(err){ console.error('Error al mostrar notificación',err); toast('No se pudo mostrar la notificación. Revisa los permisos del navegador.'); }
}

/* ---------- Sección del panel de administrador / coadministrador ---------- */
function renderNotifHistory(){
  const list=state.notif.list;
  if(state.notif.error && !list.length){
    const missing = NOTIF_MISSING_RE.test(state.notif.error);
    return `<div class="empty">${missing ? 'Falta la tabla <b>notificaciones</b> en Supabase. Ejecuta el script SQL de notificaciones y vuelve a abrir la app.' : 'No se pudieron cargar las notificaciones.'}</div>`;
  }
  if(!list.length) return `<div class="empty">Todavía no se ha enviado ninguna notificación.</div>`;
  const me=notifMe();
  return list.map(n=>{
    const ty=NOTIF_TYPES[n.tipo]||NOTIF_TYPES.novedad;
    const own=normalize(n.autor_codigo||'')===me;
    return `<div class="notif-hist-item">
      <div class="notif-hist-top"><span class="chip">${ty.icon} ${ty.label}</span>${(isAdmin()||own)?`<button type="button" class="btn ghost sm" data-notif-del="${escapeHtml(n.id)}" aria-label="Eliminar notificación">${ICONS.trash}</button>`:''}</div>
      <strong>${escapeHtml(n.titulo)}</strong>
      <p>${escapeHtml(n.mensaje).replace(/\n/g,'<br>')}</p>
      <div class="notif-item-meta">${escapeHtml(n.autor_nombre||n.autor_codigo||'—')} · ${formatUpdated(n.creado_en)}</div>
    </div>`;
  }).join('');
}
function renderNotifHistoryInPlace(){ const el=document.getElementById('notifHistoryList'); if(el) el.innerHTML=renderNotifHistory(); }
function renderAdminNotifCard(){
  const n=state.notif, d=n.draft;
  const typeOpts=Object.entries(NOTIF_TYPES).map(([k,v])=>`<option value="${k}" ${d.tipo===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  const coToggle = isAdmin() ? `<div class="settings-row"><div class="settings-row-main"><div class="settings-row-title">Permitir a coadministradores enviar notificaciones</div><div class="settings-row-sub">Si lo activas, los coadministradores verán esta sección para redactar y enviar avisos a todos los usuarios.</div></div><div class="settings-row-control"><label class="switch"><input type="checkbox" id="notifCoAdminSwitch" ${n.coAdminCanSend?'checked':''}><span class="slider"></span></label></div></div>` : '';
  const composer = canSendNotif() ? `<div class="notif-compose">
    <label class="notif-label" for="notifTipo">Tipo</label>
    <select id="notifTipo" class="notif-field">${typeOpts}</select>
    <label class="notif-label" for="notifTitulo">Título</label>
    <input id="notifTitulo" class="notif-field" type="text" maxlength="80" placeholder="Ej: Nueva versión de Veri" value="${escapeHtml(d.titulo)}" autocomplete="off">
    <label class="notif-label" for="notifMensaje">Mensaje</label>
    <textarea id="notifMensaje" class="notif-field" rows="4" maxlength="600" placeholder="Escribe la novedad, nota o aviso para los usuarios…">${escapeHtml(d.mensaje)}</textarea>
    <button type="button" class="btn block" id="notifSendBtn" ${n.sending?'disabled':''}>Enviar a todos los usuarios</button>
    <p class="small-note" style="margin:8px 0 0;">Lo verán todas las personas que usan Veri en la campana, marcado como nuevo.</p>
  </div>` : '';
  return `${coToggle}${composer}<div class="notif-hist-title">Enviadas</div><div id="notifHistoryList" class="notif-hist">${renderNotifHistory()}</div>`;
}
async function sendNotification(){
  if(!canSendNotif()){ toast('No tienes permiso para enviar notificaciones.'); return; }
  const d=state.notif.draft, titulo=(d.titulo||'').trim(), mensaje=(d.mensaje||'').trim();
  if(!titulo || !mensaje){ toast('Escribe un título y un mensaje.'); return; }
  if(state.notif.sending) return;
  state.notif.sending=true;
  const btn=document.getElementById('notifSendBtn'); if(btn) btn.disabled=true;
  const p=myPersona();
  try{
    await sb('notificaciones',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify([{
      titulo, mensaje, tipo: NOTIF_TYPES[d.tipo] ? d.tipo : 'novedad',
      autor_codigo: notifMe(), autor_nombre: (p && p.nombre) || notifMe(), autor_rol: isAdmin() ? 'admin' : 'coadmin'
    }])});
    state.notif.draft={tipo:d.tipo,titulo:'',mensaje:''};
    state.notif.sending=false;
    toast('Notificación enviada a todos los usuarios.');
    await refreshNotifications();
    render();
  }catch(err){
    state.notif.sending=false; if(btn) btn.disabled=false;
    const msg=String(err && err.message || err);
    toast(NOTIF_MISSING_RE.test(msg) ? "Falta la tabla 'notificaciones' en Supabase. Ejecuta el script SQL y vuelve a intentar." : 'No se pudo enviar la notificación.');
  }
}
async function deleteNotification(id){
  const n=state.notif.list.find(x=>String(x.id)===String(id)); if(!n) return;
  if(!(isAdmin() || normalize(n.autor_codigo||'')===notifMe())){ toast('Solo puedes eliminar tus propias notificaciones.'); return; }

async function completeLogin(codigo){
  state.session = codigo; localStorage.setItem('vp_session', codigo);
  const savedForUser = localStorage.getItem('vp_prefs_'+normalize(codigo));
  if(savedForUser){ try{ state.prefs = {...state.prefs, ...JSON.parse(savedForUser)}; }catch(e){} }
  state.loginError=''; state.loginStep='code'; state.loginCandidate=null; state.termsChecked=false; state.termsAccepted=false;
  state.booted=false; renderRoot();
  await loadCoreData();
  await loadRemotePrefs(codigo);
  state.termsAccepted=await checkTermsAccepted(codigo); state.termsChecked=true;
  // Al iniciar sesión (sin recargar) se carga también la lista de nombrados del día desde el servidor.
  resetUserScopedState();
  loadNaming();
  try{ await pushPendingNamingOfPastDays(); }catch(e){}
  try{ const rows=await fetchNamingRemote(); if(Array.isArray(rows)) await syncNamingRemoteRows(rows); }catch(e){ console.error('Error sincronizando nombrados:',e); }
  startNamingDayWatcher();
  state.booted=true; renderRoot();
}
// Datos que pertenecen a una cuenta: se limpian al cambiar de usuario para no mezclar listas entre cuentas.
function resetUserScopedState(){
  state.naming=null; state.namingFast=null; state.namingSelected=[]; state.namingEditMode=false;
  state.archived={loaded:false,loading:false,byDate:{},dates:[],selectedDate:null};
  state.cart=[]; state.cartLoaded=false; state.cartFilterPersonas=[]; state.cartReview=null;
  state.quality=null;
}
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function logout(){
  localStorage.removeItem('vp_session');
  sessionStorage.removeItem('vp_admin_unlocked');
  state.session = null; state.tab='home';
  resetUserScopedState();
  state.loginStep='code'; state.loginCandidate=null; state.loginError=''; state.termsAccepted=false; state.termsChecked=false;
  renderRoot();
}

/* ===================== Roles: administrador / coadministrador =====================
   El acceso al panel de Administrador ya no depende de una contraseña compartida que
   cualquiera pueda usar: depende de qué rol tiene asignado el código de persona con el
   que se inició sesión (columna "rol" en la tabla personas: 'admin' | 'coadmin' | vacío).
   La contraseña de administrador solo sirve para crear al primer administrador cuando
   todavía no existe ninguno (arranque inicial). Después de eso, el propio administrador
   asigna o quita el rol de coadministrador (o administrador) a cada persona desde el panel. */
function myPersona(){ return state.personas.find(p=>p.codigo===normalize(state.session||'')) || null; }
function myRole(){ const p = myPersona(); return p && p.rol ? p.rol : null; }
function isAdmin(){ return ['admin','administrador'].includes(String(myRole()||'').toLowerCase()); }
function isCoAdmin(){ return ['coadmin','coadministrador','co-admin'].includes(String(myRole()||'').toLowerCase()); }
function hasAdminAccess(){ return isAdmin() || isCoAdmin(); }
function anyAdminExists(){ return state.personas.some(p=>p.rol==='admin'); }

function renderScan(){
  const hasCartAccess = toolVisible('carrito');
  if(hasCartAccess && state.prefs.cartDefaultOn && !state.cartModeInitialized){
    state.scanMode = 'cart';
  }
  state.cartModeInitialized = true;
  const inCart = hasCartAccess && state.scanMode==='cart';
  return `
    <div class="card glass">
      <div class="section-title">${t('base')}</div>
      <div class="pill-toggle">
        <button data-base="2025" class="${state.scanBase==='2025'?'active':''}">2025</button>
        <button data-base="2026" class="${state.scanBase==='2026'?'active':''}">2026</button>
      </div>
    </div>
    <div class="card glass scan-card">
      <div class="row between" style="align-items:center;margin-bottom:12px;">
        <div class="section-title" style="margin:0;">${t('tabScan')}</div>
        ${hasCartAccess ? `<button type="button" class="cart-mini-badge ${inCart?'on':''}" id="cartModeQuickBtn">🛒 ${inCart ? state.cart.length : ''}</button>` : ''}
      </div>
      ${hasCartAccess ? `<div class="pill-toggle" style="margin-bottom:12px;">
        <button data-mode="cart" class="${inCart?'active':''}">${t('scanCart')}</button>
        <button data-mode="continuous" class="${!inCart?'active':''}">${t('scanContinuous')}</button>
      </div>` : ''}
      <div id="cameraWrap"></div>
      <div class="row" style="margin-top:10px;"><button class="btn secondary block" id="camBtn">${ICONS.camera} ${state.cameraStream ? t('stopCamera') : t('startCamera')}</button></div>
      <div class="field" style="margin-top:14px;"><label>${t('manualEntry')}</label><input type="text" id="scanInput" placeholder="${t('scanPlaceholder')}" autocomplete="off" /></div>
      <button class="btn block" id="verifyBtn">${t('verify')}</button>
      <p class="small-note" style="margin-top:10px;">${inCart ? t('cartHint') : t('scanHint')}</p>
    </div>
    <div id="cartListWrap">${inCart ? renderCartList() : ''}</div>
  `;
}
function scanStatusMeta(status){
  return {
    exact:{icon:ICONS.check, color:'var(--green)'},
    similar:{icon:ICONS.warn, color:'var(--amber)'},
    notfound:{icon:ICONS.x, color:'var(--red)'}
  }[status] || {icon:ICONS.x, color:'var(--red)'};
}
function scanResultSheetInner(r){
  const closeBtn = `<button type="button" class="modal-close" id="scanResultCloseBtn" aria-label="${t('cancel')}">${ICONS.x}</button>`;
  if(r.status==='multiple'){
    return `<div class="modal-header"><h3 class="veri-chat-title">${ICONS.warn} ${t('multipleTitle')}</h3>${closeBtn}</div>
      <p class="small-note">${t('multipleSub')} "${escapeHtml(r.suffix||'')}"</p>
      ${r.candidatos.map(p=>`<div class="list-item" data-pick-suffix="${encodeURIComponent(p.codigo)}" style="cursor:pointer;"><div><div class="name">${escapeHtml(p.nombre||'(sin nombre)')}</div></div><div class="code">${escapeHtml(p.codigo)}</div></div>`).join('')}`;
  }
  const hasCartAccess = toolVisible('carrito');
  const inCart = hasCartAccess && state.scanMode==='cart';
  const meta = scanStatusMeta(r.status);
  const name = r.producto ? (r.producto.nombre||'(sin nombre)') : '—';
  const code = r.producto ? r.producto.codigo : (r.codigoEscaneado || '');
  const statusLabel = r.status==='exact' ? (r.bySuffix?t('exactBySuffix'):t('exact')) : r.status==='similar' ? t('similar') : t('notfound');
  const showAdd = inCart && r.producto && (r.status==='exact' || r.status==='similar');
  const alreadyAdded = inCart && r.producto && findCartDuplicate(r.producto.codigo);
  const autoAddedNote = (inCart && r.status==='notfound') ? `<p class="small-note" style="margin-top:10px;">${t('cartAutoAddedNote')}</p>` : '';
  return `<div class="modal-header"><h3 class="veri-chat-title">${t('tabScan')}</h3>${closeBtn}</div>
    <div class="scan-sheet-product">
      <div class="scan-sheet-badge" style="background:${meta.color};">${meta.icon}</div>
      <div class="scan-sheet-info">
        <div class="scan-sheet-name">${escapeHtml(name)}</div>
        ${code ? `<div class="scan-sheet-code">${escapeHtml(code)}</div>` : ''}
        <div class="scan-sheet-status" style="color:${meta.color};">${statusLabel}</div>
      </div>
    </div>
    <div class="row" style="gap:10px;margin-top:16px;">
      ${r.producto ? `<button type="button" class="btn secondary block" data-copy="${encodeURIComponent(name)}">${ICONS.copy} ${t('copyName')}</button>` : ''}
      ${showAdd ? (alreadyAdded ? `<button type="button" class="btn block" disabled style="opacity:.6;">${t('cartInListLabel')}</button>` : `<button type="button" class="btn block" id="scanSheetAddBtn">${t('scanAddToList')}</button>`) : ''}
    </div>
    ${autoAddedNote}`;
}
function closeScanResultSheet(){ const el=document.getElementById('scanResultSheetOverlay'); if(el) el.remove(); }
function wireScanResultSheet(){
  const closeBtn=document.getElementById('scanResultCloseBtn');
  if(closeBtn) closeBtn.onclick=()=>{ state.scanResult=null; closeScanResultSheet(); };
  const addBtn=document.getElementById('scanSheetAddBtn');
  if(addBtn) addBtn.onclick=()=>{
    const r=state.scanResult;
    if(r && r.codigoEscaneado) addToCart(r.codigoEscaneado, null, {excepcion:r.status==='exact'});
    state.scanResult=null; closeScanResultSheet();
  };
}
let scanResultFloatTimer = null;

function closeScanResultFloat(clearState=true){
  if(scanResultFloatTimer){ clearTimeout(scanResultFloatTimer); scanResultFloatTimer=null; }
  const el=document.getElementById('scanResultFloat');
  if(el) el.remove();
  if(clearState) state.scanResult=null;
}

function flashScanFrame(status='exact'){
  const frame=document.querySelector('#cameraWrap .scan-frame');
  if(!frame) return;
  const color=status==='exact'?'var(--green)':status==='similar'?'var(--amber)':'var(--red)';
  frame.style.setProperty('--scan-feedback-color',color);
  frame.classList.remove('scan-feedback');
  void frame.offsetWidth;
  frame.classList.add('scan-feedback');
  setTimeout(()=>frame.classList.remove('scan-feedback'),700);
}

function scanResultFloatInner(r){
  const meta=scanStatusMeta(r.status);
  const name=r.producto?.nombre || (r.status==='notfound' ? t('notfound') : 'Resultado');
  const code=(toolVisible('carrito') && state.scanMode==='cart') ? (r.producto?.codigo || '') : (r.producto?.codigo || r.codigoEscaneado || '');
  const statusLabel=r.status==='exact'?(r.bySuffix?t('exactBySuffix'):t('exact')):r.status==='similar'?t('similar'):t('notfound');
  const inCart=toolVisible('carrito') && state.scanMode==='cart';
  const scanned=r.codigoEscaneado||'';
  const alreadyAdded=inCart && scanned && findCartDuplicate(scanned);
  let action='';
  if(inCart && (r.status==='exact'||r.status==='similar')){
    if(alreadyAdded){
      const who=alreadyAdded.nombre_persona||alreadyAdded.codigo_persona||'';
      action=`<button type="button" class="btn secondary block" disabled>${ICONS.check} ${t('cartInCartLabel')}${who?` · ${escapeHtml(who)}`:''}</button>`;
    } else if(r.status==='similar'){
      action=`<div class="scan-float-btnrow"><button type="button" class="btn secondary block" id="scanFloatReviewBtn">${ICONS.search||''} ${t('cartSearchBtn')}</button><button type="button" class="btn block" id="scanFloatQuickAddBtn">${ICONS.check||''} ${t('cartQuickAddBtn')}</button></div>`;
    } else {
      action=`<p class="small-note" style="margin:0 0 8px;">${t('cartInBaseNote')}</p><button type="button" class="btn block cart-exception-btn" id="scanFloatAddBtn">${t('cartAddException')}</button>`;
    }
  } else if(inCart && r.status==='notfound'){
    action=alreadyAdded ? '' : `<p class="small-note" style="margin:0;">${t('cartAddedAuto')}</p>`;
  }
  const inCartInfo = alreadyAdded ? `<div class="scan-cart-owner">🛒 ${t('cartInCartOf')} <b>${escapeHtml(alreadyAdded.nombre_persona||alreadyAdded.codigo_persona||'')}</b></div>` : '';
  return `<div class="scan-result-float-card">
    <button type="button" class="scan-result-float-close" id="scanFloatCloseBtn" aria-label="${t('cancel')}">${ICONS.x}</button>
    ${inCart && scanned ? `<div class="scan-result-float-scanned">${t('cartScannedLabel')} <b>${escapeHtml(scanned)}</b></div>` : ''}
    <div class="scan-result-float-product">
      <div class="scan-result-float-badge" style="background:${meta.color};">${meta.icon}</div>
      <div class="scan-result-float-info">
        ${inCart && r.producto ? `<div class="scan-result-float-match">${t('cartMatchLabel')}</div>` : ''}
        <div class="scan-result-float-name">${escapeHtml(name)}</div>
        ${code?`<div class="scan-result-float-code">${escapeHtml(code)}</div>`:''}
        <div class="scan-result-float-status" style="color:${meta.color};">${statusLabel}</div>
      </div>
    </div>
    ${inCartInfo}
    ${(()=>{ const rp=repFindPendingByCode(r.codigoEscaneado,r.producto?.codigo,r.producto?.codigoBarras); return rp?`<button type="button" class="scan-rep-chip" id="scanFloatRepBtn" data-rep-id="${escapeHtml(String(rp.id))}"><span>🔁 Este producto tiene una repetición</span><span aria-hidden="true">→</span></button>`:''; })()}
    ${action?`<div class="scan-result-float-actions">${action}</div>`:''}
  </div>`;
}

function updateScanResultDOM(){
  const r=state.scanResult;
  closeScanResultSheet();
  closeScanResultFloat(false);
  if(!r)return;

  flashScanFrame(r.status);

  if(r.status==='multiple'){
    const overlay=document.createElement('div');
    overlay.id='scanResultSheetOverlay';
    overlay.className='modal-overlay scan-result-overlay';
    overlay.innerHTML=`<div class="modal-sheet glass scan-result-sheet">${scanResultSheetInner(r)}</div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click',(e)=>{if(e.target===overlay){state.scanResult=null;closeScanResultSheet();}});
    wireScanResultSheet();
    return;
  }

  const el=document.createElement('div');
  el.id='scanResultFloat';
  el.className='scan-result-float';
  el.innerHTML=scanResultFloatInner(r);
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));

  const closeBtn=document.getElementById('scanFloatCloseBtn');
  if(closeBtn)closeBtn.onclick=()=>closeScanResultFloat(true);

  const repBtn=document.getElementById('scanFloatRepBtn');
  if(repBtn)repBtn.onclick=()=>{
    const rp=state.repeticiones.find(x=>String(x.id)===repBtn.dataset.repId);
    closeScanResultFloat(true); stopCamera();
    state.tab='rep'; state.repView='list'; state.repShowForm=false;
    state.repFilterStatus='all'; state.repFilterCode=''; state.repFilterDate=''; state.repFilterStore='';
    state.repSearch=rp?(rp.codigoProducto||rp.codigoBarras||''):'';
    render();
  };

  const addBtn=document.getElementById('scanFloatAddBtn');
  if(addBtn)addBtn.onclick=()=>{
    const sr=state.scanResult;
    if(sr && sr.codigoEscaneado)addToCart(sr.codigoEscaneado,null,{excepcion:true});
    closeScanResultFloat(true);
  };
  const quickAddBtn=document.getElementById('scanFloatQuickAddBtn');
  if(quickAddBtn)quickAddBtn.onclick=()=>{
    const sr=state.scanResult;
    if(sr && sr.codigoEscaneado)addToCart(sr.codigoEscaneado,null);
    closeScanResultFloat(true); // la cámara sigue activa, lista para el siguiente producto
  };
  const reviewBtn=document.getElementById('scanFloatReviewBtn');
  if(reviewBtn)reviewBtn.onclick=()=>{
    const sr=state.scanResult;
    if(!sr)return;
    state.cartReview={code:sr.codigoEscaneado, similar:sr.producto||null};
    closeScanResultFloat(true);
    stopCamera();
    state.tab='search'; render();
  };

  // Permanece visible hasta otro escaneo, hasta detener la cámara o máximo 1 minuto.
  scanResultFloatTimer=setTimeout(()=>closeScanResultFloat(true),60000);
}

function vibrateFor(status){
  if(!state.prefs.vibration) return;
  try{
    if(!('vibrate' in navigator)) return;
    const pattern = status==='exact' ? 60 : status==='similar' ? [40,50,40] : [100,60,100];
    navigator.vibrate(pattern);
  }catch(e){}
}
let beepCtx = null;

function ensureAudio(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!beepCtx) beepCtx = new Ctx();
    if(beepCtx.state === 'suspended') beepCtx.resume().catch(()=>{});
    return beepCtx;
  }catch(e){ return null; }
}

function synthTone({startFreq, endFreq=startFreq, duration=0.12, volume=0.16, type='sine', delay=0}){
  const ctx = ensureAudio();
  if(!ctx) return;
  const play = ()=>{
    try{
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, t);
      if(endFreq !== startFreq){
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + duration);
      }
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(volume, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume * 0.72), t + duration * 0.58);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.025);
    }catch(e){}
  };
  if(ctx.state === 'suspended') ctx.resume().then(play).catch(()=>{});
  else play();
}

// Shared helper for UI sounds. Scanner sound can be switched in Settings.
function beepTone(freq, duration){
  synthTone({startFreq:freq, duration, volume:0.11, type:'sine'});
}

function scannerClick(delay=0){
  // Crisp high-frequency tick used by the modern/neon scanner styles.
  synthTone({startFreq:2200, endFreq:1500, duration:0.035, volume:0.055, type:'triangle', delay});
}

function unlockAudio(){ ensureAudio(); }
document.addEventListener('pointerdown', unlockAudio, {once:true, passive:true});

function playClassicScan(status){
  // Original Veri sound: simple, unmistakable scanner feedback.
  if(status === 'exact') beepTone(1600, 0.11);
  else if(status === 'similar'){
    beepTone(1000, 0.09);
    setTimeout(()=>beepTone(1000, 0.09),130);
  } else {
    beepTone(400, 0.16);
  }
}

function playModernScan(status){
  // Clean "tic → confirmation" with a subtle upward sweep.
  if(status === 'exact'){
    scannerClick(0);
    synthTone({startFreq:1050, endFreq:1550, duration:0.095, volume:0.13, type:'sine', delay:0.025});
    synthTone({startFreq:1500, endFreq:2050, duration:0.11, volume:0.115, type:'triangle', delay:0.115});
  } else if(status === 'similar'){
    scannerClick(0);
    synthTone({startFreq:720, endFreq:900, duration:0.07, volume:0.10, type:'sine', delay:0.025});
    synthTone({startFreq:880, endFreq:1080, duration:0.075, volume:0.095, type:'sine', delay:0.125});
  } else {
    synthTone({startFreq:360, endFreq:220, duration:0.16, volume:0.13, type:'sine', delay:0});
    synthTone({startFreq:210, endFreq:150, duration:0.11, volume:0.055, type:'triangle', delay:0.055});
  }
}

function playNeonScan(status){
  // A slightly more futuristic, arcade-like style with a bright digital attack.
  if(status === 'exact'){
    synthTone({startFreq:1750, endFreq:2350, duration:0.055, volume:0.075, type:'square', delay:0});
    synthTone({startFreq:900, endFreq:1850, duration:0.13, volume:0.115, type:'sine', delay:0.035});
    synthTone({startFreq:1900, endFreq:2700, duration:0.09, volume:0.07, type:'triangle', delay:0.12});
  } else if(status === 'similar'){
    synthTone({startFreq:760, endFreq:1120, duration:0.065, volume:0.085, type:'triangle', delay:0});
    synthTone({startFreq:1120, endFreq:1450, duration:0.065, volume:0.085, type:'triangle', delay:0.105});
  } else {
    synthTone({startFreq:520, endFreq:300, duration:0.105, volume:0.10, type:'sawtooth', delay:0});
    synthTone({startFreq:300, endFreq:190, duration:0.13, volume:0.07, type:'sine', delay:0.085});
  }
}

function playScanSound(status, style=state.prefs.soundStyle || 'modern'){
  if(style === 'classic') playClassicScan(status);
  else if(style === 'neon') playNeonScan(status);
  else playModernScan(status);
}

function beepFor(status){
  if(!state.prefs.sound) return;
  playScanSound(status);
}

  if(!it) return;
  closeNamingEditModal();
  const overlay = document.createElement('div');
  overlay.id = 'namingEditOverlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-sheet glass">

  const saveBtn = document.getElementById('namingEditSaveBtn');

    const nc = normalize(document.getElementById('namingEditCodigo').value);
    const nn = normalize(document.getElementById('namingEditNombre').value);
    if(!nc || !nn) return;
    // Aviso de "repetidos del día": solo debe saltar si es el mismo código o el nombre
    // es EXACTAMENTE igual (no "parecido").
    const sessionDup = state.naming.items.find(o=> o.id!==it.id && (o.codigo===nc || o.nombre===nn));
    if(sessionDup){
      const msgKey = sessionDup.codigo===nc ? 'namingSessionDupCode' : 'namingSessionDupName';
      const msg = t(msgKey).replace('{nombre}', sessionDup.nombre).replace('{codigo}', sessionDup.codigo);
      if(!confirm(msg)) return;
      it.sessionDup = true; it.sessionDupWith = sessionDup.nombre; it.sessionDupCode = sessionDup.codigo;
    } else {
      it.sessionDup = false; it.sessionDupWith = null; it.sessionDupCode = null;

    const dup = findNameDuplicate2026(nn, nc);
    it.codigo=nc; it.nombre=nn; it.duplicado=!!dup; it.duplicadoCodigo=dup?dup.codigo:null; it.duplicadoNombre=dup?dup.nombre:null; it.duplicadoTipo=dup?.__dupReason||null;
    it.veriChecked=false; it.veriReason=null; it.veriChecking=false;
    saveNaming();
    persistNamingEditRemote(it);
    closeNamingEditModal();
    render();
    verifyNamingItemWithVeri(it).then(changed=>{
      if(changed){ saveNaming(); persistNamingEditRemote(it); render(); }
    });
  };
}
function getPendingPhotoReviewItems(){
  const multi=(state.repetitionPhotos||[]).filter(f=>f.path && f.estado!=='aprobada' && f.estado==='pendiente');
  const hasMultiRows=(state.repetitionPhotos||[]).length>0;
  const multiRepIds=new Set((state.repetitionPhotos||[]).map(f=>String(f.repeticionId)));
  const legacy=(state.repeticiones||[]).filter(r=>!multiRepIds.has(String(r.id))&&!r.archivado&&r.fotoPath&&(r.revisionEstado||'pendiente')!=='aprobada'&&(r.revisionEstado||'pendiente')!=='repetir'&&(r.estado==='sent'||(r.revisionEstado||'pendiente')==='repetir'||(r.revisionEstado||'pendiente')==='pendiente')).map(r=>({...r,legacy:true,repetition:r}));
  if(hasMultiRows){
    const pendingMulti=multi.map(f=>({ ...f, repetition:state.repeticiones.find(r=>String(r.id)===String(f.repeticionId)) })).filter(x=>x.repetition&&!x.repetition.archivado);
    return pendingMulti.concat(legacy).sort((a,b)=>String(a.subidaEn||a.fecha||'').localeCompare(String(b.subidaEn||b.fecha||'')));
  }
  return legacy.sort((a,b)=>(Number(a.fecha)||0)-(Number(b.fecha)||0));
}
function getPendingPhotoReviewCount(){ return getPendingPhotoReviewItems().length; }
function veriClampPan(img,stage,s,r,x,y,curX,curY){
  // Mantiene la foto dentro del marco: al arrastrar hace tope en el borde y, si cabe completa, queda centrada.
  try{
    if(!img||!stage) return [x,y];
    const sw=stage.clientWidth, sh=stage.clientHeight;
    let bw=img.offsetWidth, bh=img.offsetHeight;
    if(!sw||!sh||!bw||!bh) return [x,y];
    if(Math.round((Number(r)||0)/90)%2!==0){ const t0=bw; bw=bh; bh=t0; }
    const sr=stage.getBoundingClientRect(), ir=img.getBoundingClientRect();
    const ox=(sr.left+sr.width/2)-(ir.left+ir.width/2-(curX||0));
    const oy=(sr.top+sr.height/2)-(ir.top+ir.height/2-(curY||0));
    const mx=Math.max(0,(bw*s-sw)/2), my=Math.max(0,(bh*s-sh)/2);
    return [ox+Math.max(-mx,Math.min(mx,x-ox)), oy+Math.max(-my,Math.min(my,y-oy))];
  }catch(e){ return [x,y]; }
}
function applyInlineReviewTransform(img,scale,rotation,x,y){
  [x,y]=veriClampPan(img,img.closest('[data-review-stage]'),scale,rotation,x,y,Number(img.dataset.x||0),Number(img.dataset.y||0));
  img.dataset.zoom=String(scale);img.dataset.rotation=String(rotation);img.dataset.x=String(x);img.dataset.y=String(y);
  img.style.transform=`translate(${x}px, ${y}px) scale(${scale}) rotate(${rotation}deg)`;
  const label=document.querySelector(`[data-review-zoom-label="${CSS.escape(img.dataset.reviewInlineImage||'')}"]`);if(label)label.textContent=`${Math.round(scale*100)}%`;
  img.style.cursor=scale>1?'grab':'zoom-in';
}

function repParseId(code){
  const m=String(code||'').trim().match(/^(\d{8})[_\-]([^_\-\s]+)[_\-](\d+)/);
  return m?{date:m[1],store:m[2],seq:m[3]}:null;
}

const veriPhotoUrlCache = new Map();
function veriStorageClient(){
  if(!window.__veriStorageClient) window.__veriStorageClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  return window.__veriStorageClient;
}
function veriPhotoUrl(path){ return path ? (veriPhotoUrlCache.get(path)||'') : ''; }
async function refreshVeriPhotoUrl(path){
  if(!path) return '';
  const {data,error}=await veriStorageClient().storage.from('veri-repetition-photos').createSignedUrl(path,3600);
  if(error) throw error;
  const url=data?.signedUrl||'';
  if(url) veriPhotoUrlCache.set(path,url);
  return url;
}
async function refreshVeriPhotoUrls(){
  const paths=[...new Set((state.repeticiones||[]).map(r=>r.fotoPath).filter(Boolean))];
  await Promise.all(paths.map(async p=>{try{await refreshVeriPhotoUrl(p);}catch(e){console.warn('No se pudo generar URL firmada para una foto de Veri:',e.message||e);}}));
  if(state.tab==='rep') render();

let __saveQ=Promise.resolve();
function saveRepPhotoToDevice(file, repId){
  // Copia local automática de cada foto (por defecto activada). Una web no puede escribir directo en Fotos:
  // se descarga el archivo original y queda en Descargas / Archivos del teléfono.
  try{
    if(state.prefs.savePhotosToDevice===false || !file) return;
    const row=(state.repeticiones||[]).find(r=>String(r.id)===String(repId));
    const ext=((file.name||'').match(/\.([a-zA-Z0-9]{2,5})$/)||[])[1]||'jpg';
    const base=String((row&&row.codigoProducto)||repId||'foto').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40);
    const name='Veri_'+base+'_'+Date.now()+'.'+ext;
    __saveQ=__saveQ.then(()=>new Promise(res=>{
      try{ const url=URL.createObjectURL(file), a=document.createElement('a'); a.href=url; a.download=name; a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); },4000); }catch(e){ console.warn('No se pudo guardar la foto en el celular',e); }
      setTimeout(res,700);
    }));
  }catch(e){ console.warn(e); }
}
async function uploadVeriPhoto(file, repId, opts){
  if(!file) return null;
  if(!file.type || !file.type.startsWith('image/')) throw new Error('Selecciona un archivo de imagen.');
  if(!(opts&&opts.noSave)) saveRepPhotoToDevice(file, repId);
  if(file.size>30*1024*1024) throw new Error('La foto debe pesar menos de 30 MB.');
  const path=`${normalize(state.session||'anon')}/${repId}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  // Se pasa el File original directamente a Storage; no hay canvas ni compresión intermedia.
  const {error}=await veriStorageClient().storage.from('veri-repetition-photos').upload(path,file,{upsert:false,contentType:file.type,cacheControl:'3600'});
  if(error) throw error;
  try{await refreshVeriPhotoUrl(path);}catch(e){console.warn('La foto se subió, pero no se pudo crear su vista previa firmada.',e);}
  return path;
}
async function downloadApprovedPhoto(url, filename){
  if(!url) return false;
  // Primero intenta descargar el archivo original como Blob para evitar abrir otra pestaña.
  // Si el navegador o CORS lo impiden, abre el enlace firmado como alternativa segura.
  try{
    const response=await fetch(url,{mode:'cors'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const blob=await response.blob();
    const objectUrl=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=objectUrl; a.download=filename||'veri-foto'; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl),60000);
    return true;
  }catch(err){
    console.warn('Descarga automática bloqueada por el navegador; se abrirá el original.',err);
    const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener'; a.click();
    return false;
  }
}
function safePhotoFilename(row){
  const base=[row?.codigoProducto||'producto',row?.nombreProducto||'foto'].join('_').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,90);
  const path=String(row?.fotoPath||''); const ext=(path.match(/\.(jpe?g|png|webp|heic|heif)$/i)||[])[1]||'jpg';
  return `${base}.${ext}`;
}

/* ===================== Camera / BarcodeDetector (con respaldo ZXing) — reutilizable ===================== */
let zxingReader = null, zxingLoadPromise = null;
let lastScanCode = null, lastScanTime = 0;
let candidateCode = null, candidateCount = 0;
let activeWrapId = null, activeBtnId = null, activeOnDetect = null;
const CONFIRM_COUNT = 2;
// Formatos de código de barras que realmente se usan en empaques de productos. Antes se aceptaba
// cualquier formato que el navegador supiera leer (QR, Aztec, PDF417, etc.), lo que hacía más
// probable que la cámara "confirmara" una lectura basura si alcanzaba a leer algo parecido a un
// código en dos cuadros seguidos. Limitar los formatos reduce esas falsas lecturas.
const PRODUCT_BARCODE_FORMATS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];
/* Valida el dígito verificador estándar de GTIN (EAN-8, UPC-A/EAN-13, EAN-14). Si el código no es
   puramente numérico o no tiene una longitud estándar (ej. CODE_128/CODE_39 alfanuméricos), no hay
   checksum que aplicar y se deja pasar tal cual. Esto es lo que de verdad filtra la mayoría de las
   lecturas erróneas de EAN/UPC: un solo dígito mal leído por la cámara casi siempre rompe el checksum. */
function gtinChecksumValid(code){
  if(!/^\d+$/.test(code)) return true;
  if(![8,12,13,14].includes(code.length)) return true;
  const digits = code.split('').map(Number);
  const checkDigit = digits.pop();
  let sum = 0;
  digits.reverse().forEach((d,i)=>{ sum += d * (i%2===0?3:1); });
  const calc = (10 - (sum%10))%10;
  return calc===checkDigit;
}
function handleDetection(value){
  if(!value) return;
  // Se descarta de inmediato cualquier lectura que no pase el checksum, sin tocar el candidato que
  // ya se venía acumulando: así una racha de lecturas buenas no se pierde por un cuadro con ruido.
  if(!gtinChecksumValid(value)) return;
  if(value===candidateCode){ candidateCount++; } else { candidateCode=value; candidateCount=1; }
  if(candidateCount>=CONFIRM_COUNT){
    candidateCode=null; candidateCount=0;
    if(activeOnDetect) activeOnDetect(value);
  }
}
function loadZXing(){
  if(window.ZXing) return Promise.resolve();
  if(zxingLoadPromise) return zxingLoadPromise;
  zxingLoadPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('zxing load failed'));
    document.head.appendChild(s);
  });
  return zxingLoadPromise;
}
async function listCameras(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d=>d.kind==='videoinput');
  }catch(e){ return []; }
}
function cameraLabel(d, i){
  const raw=(d.label||'').trim();
  if(raw) return raw;
  return `${t('cameraLabel')} ${i+1}`;
}
function renderCameraSelect(wrapId){

async function startCamera(wrapId, btnId, onDetect){
  activeWrapId = wrapId; activeBtnId = btnId; activeOnDetect = onDetect;
  const wrap = document.getElementById(wrapId);
  if(location.protocol==='file:'){ wrap.innerHTML = `<p class="small-note">${t('cameraFileError')}</p>`; return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ wrap.innerHTML = `<p class="small-note">${t('cameraUnsupported')}</p>`; return; }
  wrap.innerHTML = `<div class="scan-frame"><video id="scanVideo_${wrapId}" autoplay playsinline muted></video><div class="overlay"></div><div class="scan-laser"></div></div>`;
  const video = document.getElementById('scanVideo_'+wrapId);
  lastScanCode = null; lastScanTime = 0; candidateCode = null; candidateCount = 0;
  let stream;
  const baseConstraints = {
    width:{ideal:640, max:1280},
    height:{ideal:480, max:720},
    frameRate:{ideal:24, max:30}
  };
  try{
    if(state.preferredCameraId){
      // El usuario eligió una cámara/lente específica (por ejemplo, el teleobjetivo del iPhone).
      try{
        stream = await navigator.mediaDevices.getUserMedia({
          audio:false,
          video:{ ...baseConstraints, deviceId:{exact:state.preferredCameraId} }
        });
      }catch(e){
        // La cámara guardada ya no existe o cambió: volvemos al modo automático.
        state.preferredCameraId = '';
        localStorage.removeItem('vp_camera_device');
      }
    }
    if(!stream){
      // No fijamos un deviceId concreto: así iOS/Safari puede seguir cambiando de lente
      // automáticamente (macro/ultra gran angular) al acercar la cámara para enfocar de cerca.
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{ ...baseConstraints, facingMode:{ideal:'environment'} }
      });
    }
  }catch(e){
    wrap.innerHTML = `<p class="small-note">${t('cameraPermError')}</p>`;
    return;
  }
  state.cameraStream = stream;
  video.srcObject = stream;
  const btn = document.getElementById(btnId);
  if(btn) btn.innerHTML = `${ICONS.camera} ${t('stopCamera')}`;

  // Una vez concedido el permiso, los labels de los dispositivos ya son visibles:
  // armamos el selector de cámara/lente (ej. gran angular, teleobjetivo, ultra gran angular).
  state.availableCameras = await listCameras();
  const frame = wrap.querySelector('.scan-frame');
  if(frame && state.availableCameras.length>1){
    frame.insertAdjacentHTML('beforeend', `<div class="camera-select-wrap">${renderCameraSelect(wrapId)}</div>`);
    const sel = document.getElementById('cameraSelect_'+wrapId);
    if(sel) sel.onchange = async ()=>{
      const chosen = sel.value;
      state.preferredCameraId = chosen;
      if(chosen) localStorage.setItem('vp_camera_device', chosen); else localStorage.removeItem('vp_camera_device');
      stopCamera();
      try{ await startCamera(wrapId, btnId, onDetect); }catch(e){ toast(t('cameraSwitchError')); }
    };
  }

  setupPinchZoom(frame, video, stream.getVideoTracks()[0]);

  if('BarcodeDetector' in window){
    let detector;
    try{ detector = new BarcodeDetector({formats:PRODUCT_BARCODE_FORMATS}); }
    catch(e){ detector = new BarcodeDetector(); }
    let detecting = false;
    let stopped = false;
    const loop = async ()=>{
      if(!state.cameraStream || stopped) return;
      if(!detecting){
        detecting = true;
        try{
          const codes = await detector.detect(video);
          if(codes && codes.length){
            handleDetection(codes[0].rawValue);
          }
        }catch(e){}
        detecting = false;
      }
      state.cameraLoopId = setTimeout(loop, 140);
    };
    state.cameraLoopId = setTimeout(loop, 120);
  } else {
    try{
      await loadZXing();
      let codeReader;
      try{
        const formatMap = {ean_13:'EAN_13',ean_8:'EAN_8',upc_a:'UPC_A',upc_e:'UPC_E',code_128:'CODE_128',code_39:'CODE_39',itf:'ITF'};
        const formats = PRODUCT_BARCODE_FORMATS.map(f=>ZXing.BarcodeFormat[formatMap[f]]).filter(f=>f!==undefined);
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        codeReader = new ZXing.BrowserMultiFormatReader(hints);
      }catch(e){
        codeReader = new ZXing.BrowserMultiFormatReader();
      }
      zxingReader = codeReader;
      codeReader.decodeFromStream(stream, video, (result)=>{
        if(result && state.cameraStream){ handleDetection(result.getText()); }
      });
    }catch(e){
      toast(t('cameraLibError'));
    }
  }
}
/* ===================== Zoom (pellizco / botones) sobre el recuadro de escaneo ===================== */
function setupPinchZoom(frame, video, track){
  if(!frame || !video) return;
  const caps = (track && track.getCapabilities) ? track.getCapabilities() : {};
  const nativeZoom = caps && typeof caps.zoom==='object';
  const zMin = nativeZoom ? (caps.zoom.min||1) : 1;
  const zMax = nativeZoom ? (caps.zoom.max||1) : 4;
  const zStep = nativeZoom ? (caps.zoom.step||0.1) : 0.1;
  state.scanZoomCaps = { native:nativeZoom, min:zMin, max:zMax, step:zStep };
  state.scanZoom = zMin>1 ? zMin : 1;
  video.style.transformOrigin = 'center center';

  function apply(zoom){
    zoom = Math.min(zMax, Math.max(zMin, zoom));
    state.scanZoom = zoom;
    if(nativeZoom && track){
      track.applyConstraints({ advanced:[{ zoom }] }).catch(()=>{});
    } else {
      // Sin soporte de zoom óptico: hacemos zoom digital agrandando el video con CSS.
      video.style.transform = `scale(${zoom})`;
    }
  }
  apply(state.scanZoom);

  // Controles +/- por si el pellizco no está disponible (ej. mouse en desktop).
  const controls = document.createElement('div');
  controls.className = 'zoom-controls';
  controls.innerHTML = `<button type="button" class="zoom-btn" data-zoom="out">−</button><button type="button" class="zoom-btn" data-zoom="in">+</button>`;
  frame.appendChild(controls);
  controls.addEventListener('click', (e)=>{
    const b = e.target.closest('[data-zoom]'); if(!b) return;
    const range = zMax - zMin || 3;
    const delta = range * 0.15 * (b.dataset.zoom==='in' ? 1 : -1);
    apply(state.scanZoom + delta);
  });

  // Pellizco con dos dedos.
  let pinchStartDist = null, pinchStartZoom = 1;
  function dist(t1,t2){ return Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY); }
  frame.addEventListener('touchstart', (e)=>{
    if(e.touches.length===2){
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartZoom = state.scanZoom;
    }
  }, { passive:true });
  frame.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2 && pinchStartDist){
      e.preventDefault();
      const newDist = dist(e.touches[0], e.touches[1]);
      const factor = newDist / pinchStartDist;
      const range = zMax - zMin || 3;
      apply(pinchStartZoom + (factor-1) * range);
    }
  }, { passive:false });
  frame.addEventListener('touchend', (e)=>{
    if(e.touches.length<2) pinchStartDist = null;
  }, { passive:true });
}
function stopCamera(){
  closeScanResultFloat(true);
  if(state.cameraLoopId) clearTimeout(state.cameraLoopId);
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader=null; }
  if(state.cameraStream){ state.cameraStream.getTracks().forEach(tr=>tr.stop()); }
  state.cameraStream = null; state.cameraLoopId = null;
  state.scanZoom = 1; state.scanZoomCaps = null;
  if(activeWrapId){ const wrap = document.getElementById(activeWrapId); if(wrap) wrap.innerHTML=''; }
  if(activeBtnId){ const btn = document.getElementById(activeBtnId); if(btn) btn.innerHTML = `${ICONS.camera} ${t('startCamera')}`; }
  activeWrapId = null; activeBtnId = null; activeOnDetect = null;
}
async function onCodeScanned(code){
  // Si el código detectado es el mismo que ya se está mostrando en la tarjeta flotante,
  // no reiniciamos nada: dejamos que la tarjeta y su temporizador de 1 minuto sigan como estaban.
  // Esto evita que la tarjeta parpadee/desaparezca en Android, donde BarcodeDetector puede
  // seguir confirmando el mismo código varias veces por segundo mientras el producto sigue en cámara.
  if(state.scanResult && state.scanResult.codigoEscaneado===code && document.getElementById('scanResultFloat')){
    return;
  }
  const now = Date.now();
  if(code===lastScanCode && (now-lastScanTime)<1500) return;
  lastScanCode = code; lastScanTime = now;
  closeScanResultFloat(true);
  const input = document.getElementById('scanInput'); if(input) input.value = code;
  if(state.scanMode==='cart' && toolVisible('carrito')){
    processCartScan(code);
  } else {
    processScan(code,false);
  }
}
/* ===================== Carrito compartido (en vivo, vía Supabase Realtime) =====================
   Cada producto escaneado en modo "Carrito" se guarda en la tabla `carrito` de Supabase.
   Todas las personas conectadas en modo Carrito ven la misma lista actualizarse en vivo.
   El carrito se considera "del día": solo se muestran/cuentan como duplicado los productos
   agregados desde la medianoche de hoy (hora local del dispositivo). */
function cartTodayStartISO(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString(); }
function findCartDuplicate(codigo){ const c=normalize(codigo); return c ? state.cart.find(it=>normalize(it.codigo_producto)===c) : null; }
// Nombre de referencia: solo se busca en la base 2025 por el código EXACTO escaneado; si no aparece, queda vacío.
async function cartNameFrom2025(code){
  try{
    await ensureBaseLoaded('2025');
    const idx = state.index && state.index['2025'];
    const p = idx && idx.map.get(normalize(code));
    return (p && p.nombre) ? p.nombre : '';
  }catch(e){ return ''; }
}
async function loadCartToday(){
  try{
    const rows = await sb(`carrito?select=*&fecha=gte.${encodeURIComponent(cartTodayStartISO())}&order=fecha.desc`);
    // Conservamos las filas optimistas (tmp_...) que aún no confirma el servidor,
    // para que un poll a mitad de un POST no las haga parpadear o desaparecer.
    const pending = (state.cart||[]).filter(it=>
      String(it.id).indexOf('tmp_')===0 &&
      !(rows||[]).some(r=>r.codigo_producto===it.codigo_producto && r.codigo_persona===it.codigo_persona)
    );
    state.cart = [...pending, ...(rows||[])];
  }catch(e){ /* si falla la red, dejamos el carrito tal cual estaba en vez de vaciarlo */ }
  state.cartLoaded = true;
  updateCartListDOM();
}
function cartPersonOptions(){
  // Lista única de personas que han agregado algo hoy, para el filtro del carrito.
  const map = new Map();
  const counts = new Map();
  state.cart.forEach(it=>{
    const key = it.codigo_persona||'';
    if(!key) return;
    counts.set(key, (counts.get(key)||0)+1);
    if(!map.has(key)) map.set(key, it.nombre_persona||key);
  });
  return [...map.entries()].map(([codigo,nombre])=>({codigo,nombre,count:counts.get(codigo)||0}));
}
const CART_KEY_WINDOW_MS = 5*60*1000;
function cyrb53(str, seed=0){
  let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
// Clave de 6 dígitos que cambia cada 5 minutos. La ve el administrador y se la da a quien deba borrar productos ajenos o vaciar el carrito.
function cartKeyForWindow(w){ return String(cyrb53('veri-cart|'+(state.adminPassword||'veri')+'|'+w)%1000000).padStart(6,'0'); }
function currentCartKey(){ return cartKeyForWindow(Math.floor(Date.now()/CART_KEY_WINDOW_MS)); }
function cartKeyValidUntil(){ return new Date((Math.floor(Date.now()/CART_KEY_WINDOW_MS)+1)*CART_KEY_WINDOW_MS); }
function verifyCartKey(input){
  const v=String(input||'').replace(/\D/g,''); if(v.length!==6) return false;
  const w=Math.floor(Date.now()/CART_KEY_WINDOW_MS);
  return v===cartKeyForWindow(w) || v===cartKeyForWindow(w-1); // tolera el cambio de ventana
}
function isOwnCartItem(it){ return it.codigo_persona === normalize(state.session||''); }
// Lo propio se borra sin problema; lo ajeno solo el administrador, o quien tenga la clave dinámica.
function canDeleteCartItem(it){ return true; }

  return `<div class="cart-key-chip"><span>🔑 ${t('cartKeyLabel')}</span><b>${currentCartKey()}</b><span class="small-note">${t('cartKeyUntil')} ${until}</span></div><p class="small-note" style="margin:0 0 10px;">${t('cartKeyHint')}</p>`;
}
function renderCartList(){
  const canClear = state.cart.length>0;
  const persons = cartPersonOptions();
  const filter = (state.cartFilterPersonas||[]).filter(c=>persons.some(p=>p.codigo===c));
  // El filtro solo afecta lo que se muestra: la verificación de duplicados (findCartDuplicate)
  // y el conteo del total siempre miran el carrito completo, no el filtrado.
  const byPerson = filter.length ? state.cart.filter(it=>filter.includes(it.codigo_persona)) : state.cart;
  const q = String(state.cartSearch||'').trim();
  const items = q ? byPerson.filter(it=>cartSearchMatch(it,q)) : byPerson;
  const rows = items.map(it=>{
    const hora = it.fecha ? new Date(it.fecha).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    const delBtn = canDeleteCartItem(it) ? `<button type="button" class="btn ghost sm" data-cart-delete="${escapeHtml(String(it.id))}" aria-label="${t('cartDeleteItem')}" title="${t('cartDeleteItem')}">${ICONS.trash}</button>` : '';
    const exTag = it.excepcion ? ` <span class="cart-exception-tag">${t('cartExceptionTag')}</span>` : '';
    return `<div class="list-item${it.excepcion?' cart-exception':''}"><div><div class="name">${escapeHtml(it.nombre_producto||'(sin nombre)')}${exTag}</div><span class="small-note">${escapeHtml(it.nombre_persona||it.codigo_persona||'')} · ${hora}</span></div><div class="row" style="align-items:center;gap:8px;"><div class="code">${escapeHtml(it.codigo_producto||'')}</div>${delBtn}</div></div>`;
  }).join('');
  const chips = persons.length ? `<div class="cart-person-chips" style="margin-bottom:10px;">
    ${persons.map(p=>`<button type="button" class="chip cart-person-chip${filter.includes(p.codigo)?' active':''}" data-cart-person="${escapeHtml(p.codigo)}" aria-pressed="${filter.includes(p.codigo)}">${escapeHtml(p.nombre)} <b>${p.count}</b></button>`).join('')}
    ${filter.length ? `<button type="button" class="chip cart-person-chip clear" id="cartFilterClearBtn">${t('cartFilterClear')}</button>` : ''}
  </div>
  ${filter.length ? `<p class="small-note" style="margin:0 0 10px;"><b>${filter.length}</b> ${t('cartFilterSelected')} · <b>${items.length}</b> ${t('cartFilterProducts')}</p>` : ''}` : '';
  return `<div class="card glass" id="cartCard">
    <div id="cartHead">
    <div class="row between" style="margin-bottom:8px;">
      <div class="section-title" style="margin:0;">${t('cartTitle')} · ${items.length}${(filter.length||q) ? ` / ${state.cart.length}` : ''}</div>
      ${canClear ? `<button class="btn ghost sm" id="cartClearBtn">${t('cartClear')}</button>` : ''}
    </div>
    ${cartKeyChipHTML()}
    </div>
    <div class="cart-search" id="cartSearchRow"><input type="search" id="cartSearchInput" placeholder="${escapeHtml(t('cartSearchPlaceholder'))}" value="${escapeHtml(state.cartSearch||'')}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" /></div>
    <div id="cartDynamic">
    ${chips}
    ${items.length ? rows : `<p class="small-note">${q ? t('cartSearchNone') : filter.length ? t('cartFilterEmpty') : t('cartEmpty')}</p>`}
    </div>
  </div>`;
}
function cartSearchMatch(it,q){
  const toks = normalize(q).split(/\s+/).filter(Boolean); if(!toks.length) return true;
  const hay = normalize((it.nombre_producto||'')+' '+(it.codigo_producto||'')+' '+(it.nombre_persona||'')+' '+(it.codigo_persona||''));
  return toks.every(tk=>hay.includes(tk));   // dígitos sueltos (ej. los últimos 6) coinciden con el final/parte del código
}
function updateCartListDOM(){
  const wrap = document.getElementById('cartListWrap');
  const badge = document.getElementById('cartModeQuickBtn');
  const inCartNow = state.scanMode==='cart' && toolVisible('carrito');
  if(badge) badge.innerHTML = `🛒 ${inCartNow ? state.cart.length : ''}`;
  if(!wrap) return;
  if(inCartNow){
    // El buscador no se vuelve a dibujar en cada actualización (cada 10 s o al escribir): así no pierde el foco ni cierra el teclado.
    if(document.getElementById('cartSearchRow') && document.getElementById('cartCard')){
      const tmp = document.createElement('div'); tmp.innerHTML = renderCartList();
      document.getElementById('cartHead').innerHTML = tmp.querySelector('#cartHead').innerHTML;
      document.getElementById('cartDynamic').innerHTML = tmp.querySelector('#cartDynamic').innerHTML;
    } else { wrap.innerHTML = renderCartList(); }
    const si = document.getElementById('cartSearchInput');
    if(si && !si.dataset.bound){ si.dataset.bound='1'; si.oninput = ()=>{ state.cartSearch = si.value; updateCartListDOM(); }; }
    const clearBtn = document.getElementById('cartClearBtn');
    if(clearBtn) clearBtn.onclick = clearCartToday;
    wrap.querySelectorAll('[data-cart-person]').forEach(btn=>{ btn.onclick = ()=>{
      const c = btn.dataset.cartPerson, cur = state.cartFilterPersonas||[];
      state.cartFilterPersonas = cur.includes(c) ? cur.filter(x=>x!==c) : [...cur, c];
      updateCartListDOM();
    }; });
    const clearF = document.getElementById('cartFilterClearBtn');
    if(clearF) clearF.onclick = ()=>{ state.cartFilterPersonas = []; updateCartListDOM(); };
    wrap.querySelectorAll('[data-cart-delete]').forEach(btn=>{ btn.onclick = ()=> deleteCartItem(btn.dataset.cartDelete); });
  } else {

}
async function clearCartToday(){
  if(isAdmin()){
    const typed = prompt(t('cartAdminClearPrompt'));
    if(!typed || typed.trim().toUpperCase()!=='VACIAR') return;
  } else {
    const k = prompt(t('cartNeedCodeClear'));
    if(k===null) return;
    if(!verifyCartKey(k)){ toast(t('cartBadCode')); return; }
    if(!confirm(t('cartClearConfirm'))) return;
  }
  try{
    await sb(`carrito?fecha=gte.${encodeURIComponent(cartTodayStartISO())}`, {method:'DELETE', headers:{'Prefer':'return=minimal'}});
    state.cart = [];
    updateCartListDOM();
  }catch(e){ toast(t('cartAddError')); }
}
async function deleteCartItem(id){
  if(!id || String(id).indexOf('tmp_')===0) return; // fila aún no confirmada por el servidor, espera un momento
  const it = state.cart.find(x=>String(x.id)===String(id));
  if(!it) return;
  if(isOwnCartItem(it) || isAdmin()){
    if(!confirm(t('cartDeleteConfirm'))) return;
  } else {
    const k = prompt(t('cartNeedCode'));
    if(k===null) return;
    if(!verifyCartKey(k)){ toast(t('cartBadCode')); return; }
  }
  const prevCart = state.cart;
  state.cart = state.cart.filter(x=>String(x.id)!==String(id));
  updateCartListDOM();
  try{
    await sb(`carrito?id=eq.${encodeURIComponent(id)}`, {method:'DELETE', headers:{'Prefer':'return=minimal'}});
  }catch(e){
    state.cart = prevCart;
    updateCartListDOM();
    toast(t('cartDeleteError'));
  }
}
async function addToCart(codigoRaw, producto, opts){
  // Siempre se guarda el MISMO código que se escaneó (nunca el de un producto parecido).
  // El nombre sale de la base 2025 solo si ese código aparece allí.
  const codigo = normalize(codigoRaw);
  if(!codigo) return;
  const excepcion = !!(opts && opts.excepcion);
  const dup = findCartDuplicate(codigo);
  if(dup){
    toast(`${t('cartAlreadyAdded')} ${dup.nombre_persona||dup.codigo_persona||''}`);
    vibrateFor('similar'); beepFor('similar');
    return;
  }
  const nombre = await cartNameFrom2025(codigo);
  if(findCartDuplicate(codigo)){ // otro escaneo igual pudo entrar mientras se buscaba el nombre
    const d2 = findCartDuplicate(codigo);
    toast(`${t('cartAlreadyAdded')} ${d2.nombre_persona||d2.codigo_persona||''}`);
    return;
  }
  const persona = myPersona();
  const nombrePersona = (persona && persona.nombre) ? persona.nombre : (state.session||'');
  const tempId = 'tmp_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const row = { id:tempId, codigo_producto:codigo, nombre_producto:nombre, base:state.scanBase, codigo_persona:normalize(state.session||''), nombre_persona:nombrePersona, fecha:new Date().toISOString(), excepcion };
  state.cart.unshift(row);
  updateCartListDOM();
  vibrateFor('exact'); beepFor('exact');
  const payload = {codigo_producto:row.codigo_producto, nombre_producto:row.nombre_producto, base:row.base, codigo_persona:row.codigo_persona, nombre_persona:row.nombre_persona, fecha:row.fecha};
  try{
    let res;
    try{
      res = await sb('carrito', {method:'POST', body:JSON.stringify([{...payload, excepcion}]), headers:{'Prefer':'return=representation'}, silent:true});
    }catch(e1){
      // Si la tabla aún no tiene la columna "excepcion", se guarda igual sin ella.
      res = await sb('carrito', {method:'POST', body:JSON.stringify([payload]), headers:{'Prefer':'return=representation'}});
    }
    if(res && res[0]){ row.id = res[0].id; }
  }catch(e){
    state.cart = state.cart.filter(it=>it.id!==tempId);
    updateCartListDOM();
    const detail = (e && e.message) ? String(e.message).slice(0,180) : '';
    toast(detail ? `${t('cartAddError')} (${detail})` : t('cartAddError'));
  }
}
/* Antes usábamos Supabase Realtime (WebSocket) para el carrito en vivo, pero dependía de
   que el canal conectara bien (Realtime habilitado en la tabla, RLS, red, etc.) y si fallaba
   la fila se quedaba "pegada" en optimista sin que nadie más la viera. Cambiamos a polling
   simple: cada 10s (y también al entrar al modo carrito) se vuelve a pedir el carrito del día
   por REST. Es más simple, más robusto y de sobra para un carrito que se actualiza a este ritmo. */
const CART_POLL_INTERVAL_MS = 10000;
function subscribeCartRealtime(){ startCartPolling(); }
function unsubscribeCartRealtime(){ stopCartPolling(); }
function startCartPolling(){
  if(state.cartPollTimer) return;
  state.cartPollTimer = setInterval(()=>{
    if(document.hidden) return;
    if(state.scanMode==='cart' && toolVisible('carrito')) loadCartToday();
    else stopCartPolling();
  }, CART_POLL_INTERVAL_MS);
}
function stopCartPolling(){
  if(state.cartPollTimer){ clearInterval(state.cartPollTimer); state.cartPollTimer = null; }
}
async function processCartScan(code){
  if(!code) return;
  let result = {status:'notfound'};
  try{
    await ensureBaseLoaded(state.scanBase);
    result = matchCode(code, state.scanBase) || {status:'notfound'};
  }catch(e){ /* si falla la carga de la base, igual contamos el producto físico */ }
  result.codigoEscaneado = code;
  state.scanResult = result; updateScanResultDOM();
  if(result.status==='multiple'){
    // Ambiguo por sufijo: esperamos a que la persona elija el producto correcto de la lista
    // (ver handler data-pick-suffix) en vez de agregarlo ya con un código incompleto.
    vibrateFor('similar'); beepFor('similar');
  } else if(result.status==='exact' || result.status==='similar'){
    // Ya existe (o se parece a algo que existe) en la base: el sheet unificado
    // ya ofrece el botón "Agregar a lista" (con chequeo de duplicado incluido).
    vibrateFor(result.status); beepFor(result.status);
  } else {
    // No está en la base: se agrega directo, guardando solo el código escaneado.
    if(!findCartDuplicate(code)) toast(t('cartAddedAuto'));
    addToCart(code, null);
  }
  logScan(code, result);
}
async function logScan(code,result){
  try{await sb('escaneos',{method:'POST',body:JSON.stringify([{codigo_persona:normalize(state.session||''),codigo_escaneado:normalize(code),codigo_producto:result.producto?result.producto.codigo:null,nombre_producto:result.producto?result.producto.nombre:null,base:state.scanBase,estado:result.status,fecha:new Date().toISOString()}]),headers:{'Prefer':'return=minimal'}});}catch(e){}
}
async function processScan(code,stopAfter=false){
  if(!code)return;
  try{ await ensureBaseLoaded(state.scanBase); }catch(e){ return; }
  state.scanResult=matchCode(code,state.scanBase)||{status:'notfound'};
  state.scanResult.codigoEscaneado=code;
  updateScanResultDOM(); vibrateFor(state.scanResult.status); beepFor(state.scanResult.status); logScan(code,state.scanResult); if(stopAfter)stopCamera();
}
function runVerify(code){
  const val=code!==undefined?code:document.getElementById('scanInput').value; if(!val)return;
  if(state.scanMode==='cart' && toolVisible('carrito')){ processCartScan(val); }
  else { processScan(val,false); }
}

      ['rep','Herramientas','Repeticiones y nombrador',ICONS.rep],

    const updateSpotlight=()=>{
      if(!panel)return;
      const raw=homeSearch.value.trim();

          const key=p.codigo||p.nombre; if(seen.has(key)) continue;
          const codeNorm=p.codigoSearch!==undefined?p.codigoSearch:normalizeForSearch(p.codigo||'');

async function doSearch(){
  try{await ensureBaseLoaded(state.scanBase||state.prefs.defaultBase||'2026');}catch(e){return;}
  const input = document.getElementById('searchInput');
  const wrap = document.getElementById('searchResultsWrap');
  if(!input || !wrap) return;
  const q = input.value;
  if(!q){ wrap.innerHTML=''; return; }
  const qKey = q+'|'+state.scanBase;
  if(state.searchLastKey!==qKey){ state.searchLastKey=qKey; state.searchLimit=60; }
  const {results, fuzzy, total} = searchProducts(q, state.scanBase, state.searchLimit||60);
  let dym='';
  if(!results.length || fuzzy){
    const sg=vsSuggest(q, state.scanBase);
    if(sg) dym=`<div class="dym">${t('didYouMean')} <button type="button" data-dym="${escapeHtml(sg.text)}">${escapeHtml(sg.text)}</button>? <span>(${sg.count.toLocaleString()})</span></div>`;
  }
  const bindDym=()=>{ wrap.querySelectorAll('[data-dym]').forEach(b=>b.onclick=()=>{ input.value=b.dataset.dym; doSearch(); }); const mb=document.getElementById('searchMoreBtn'); if(mb) mb.onclick=()=>{ state.searchLimit=(state.searchLimit||60)+100; doSearch(); }; };
  if(!results.length){ wrap.innerHTML = dym+`<div class="empty">${t('noResults')}</div>`; bindDym(); return; }
  wrap.innerHTML = dym + (fuzzy
    ? `<p class="small-note" style="margin:0 0 8px 2px;">${t('fuzzyNote')}</p>`
    : `<p class="small-note" style="margin:0 0 8px 2px;">${total.toLocaleString()} ${t('searchResults')}${total>results.length?` · ${t('searchShowing')} ${results.length}`:''}</p>`)
    + results.map(p=>`<div class="list-item"><div><div class="name">${p.nombre||'(sin nombre)'}</div></div><div class="code">${p.codigo}</div></div>`).join('')
    + (!fuzzy && total>results.length ? `<button type="button" class="btn secondary block" id="searchMoreBtn" style="margin-top:12px;">${t('searchShowMore')} (${Math.min(100,total-results.length)})</button>` : '');
  bindDym();
}
async function saveRepetition(){
  const codigoProducto = normalize(document.getElementById('repCodProd').value);
  const nombreProducto = normalize(document.getElementById('repNomProd').value);
  if(!codigoProducto && !nombreProducto){ toast('!'); return; }

  const motivo = document.getElementById('repMotivo').value.trim();
  const categoria = document.getElementById('repCategoria')?.value || inferCategory(nombreProducto);
  const payload = { codigo_producto:codigoProducto, nombre_producto:nombreProducto, categoria, fotografo, codigo_barras:codigoBarras, motivo, estado:'pending', archivado:false, fecha: Date.now() };
  try{

    let photoPath=null;
    for(let i=0;i<photoFiles.length;i++){const file=photoFiles[i];const path=await uploadVeriPhoto(file,row.id);if(!photoPath)photoPath=path;await insertRepPhoto(row.id,path,file.name);}
    if(photoPath){await sb(`repeticiones?id=eq.${encodeURIComponent(row.id)}`,{method:'PATCH',body:JSON.stringify({foto_path:photoPath,foto_subida_en:new Date().toISOString(),revision_estado:'pendiente',estado:'sent'}),headers:{'Prefer':'return=minimal'}});}
    state.repeticiones.unshift({ id:row.id, codigoProducto, nombreProducto, categoria, fotografo, codigoBarras, motivo, estado:'pending', archivado:false, fecha: payload.fecha, fotoPath:photoPath, fotoSubidaEn:photoPath?new Date().toISOString():null, revisionEstado:'pendiente', revisionMotivo:'' });
    document.getElementById('repCodProd').value=''; document.getElementById('repNomProd').value='';
    document.getElementById('repBarras').value=''; document.getElementById('repMotivo').value=''; if(document.getElementById('repPhotoInput')) document.getElementById('repPhotoInput').value='';
    if(photoPath){const local=state.repeticiones.find(x=>String(x.id)===String(row.id));if(local)local.estado='sent';}
    await refreshRepPhotos();
    state.tab='rep'; state.repView='list'; state.repShowForm=false;
    toast(photoPath?`${photoFiles.length} foto(s) enviadas a revisión`:t('imported'));
    render();
  }catch(err){ console.error(err); toast(t('errorImport')); }

/* ===================== Repeticiones: Iniciar → fotos → Enviar ===================== */
/* Estados (ya existentes): pending = Pendiente · done = En progreso (alguien lo está fotografiando) · sent = Enviada, esperando revisión.
   Quién lo tiene en proceso se guarda en repeticiones.en_proceso_por (ver veri_repeticiones_en_proceso.sql). */
const REP_LOCK_STALE_MS = 3*60*60*1000;
function repWorkerName(code){ const p=(state.personas||[]).find(x=>x.codigo===code); return p&&p.nombre ? `${code} — ${p.nombre}` : (code||''); }
function repIsWorking(r){ return r.estado==='done'; }
function repLockStale(r){ return !!r.enProcesoDesde && (Date.now()-new Date(r.enProcesoDesde).getTime())>REP_LOCK_STALE_MS; }
function repStartButtonHTML(r){
  const me=normalize(state.session||''); if(!me) return '';
  if(r.estado==='pending') return `<button type="button" class="btn sm" data-rep-start="${r.id}">📷 Iniciar</button>`;
  if(r.estado==='done'){
    if(!r.enProcesoPor || r.enProcesoPor===me) return `<button type="button" class="btn sm" data-rep-start="${r.id}">📷 Continuar</button><button type="button" class="btn ghost sm" data-rep-release="${r.id}">Cancelar</button>`;
    if(repLockStale(r)) return `<button type="button" class="btn sm" data-rep-start="${r.id}">📷 Tomar (lo tenía ${escapeHtml(repWorkerName(r.enProcesoPor))})</button>`;
    return hasAdminAccess() ? `<button type="button" class="btn secondary sm" data-rep-release="${r.id}">Liberar</button>` : '';
  }
  return '';
}
// Si las columnas en_proceso_* aún no existen en Supabase, la app sigue funcionando (sin mostrar quién).
async function repPatchSafe(id, full, basic){
  const path=`repeticiones?id=eq.${encodeURIComponent(id)}`;
  try{ await sb(path,{method:'PATCH',body:JSON.stringify(full),headers:{'Prefer':'return=minimal'},silent:true}); }
  catch(e){ if(!/en_proceso/i.test(String(e&&e.message))) throw e; state.repNoLockCols=true; await sb(path,{method:'PATCH',body:JSON.stringify(basic),headers:{'Prefer':'return=minimal'}}); }
}
async function repClaim(r, me){
  const now=new Date().toISOString();
  const base=`repeticiones?id=eq.${encodeURIComponent(r.id)}&estado=eq.${r.estado}`;
  const owner = r.estado==='done' ? (r.enProcesoPor ? `&en_proceso_por=eq.${encodeURIComponent(r.enProcesoPor)}` : '&en_proceso_por=is.null') : '';
  const hdr={'Prefer':'return=representation'};
  try{ return await sb(base+owner,{method:'PATCH',body:JSON.stringify({estado:'done',en_proceso_por:me,en_proceso_desde:now}),headers:hdr,silent:true}); }
  catch(e){ if(!/en_proceso/i.test(String(e&&e.message))) throw e; state.repNoLockCols=true; return await sb(base,{method:'PATCH',body:JSON.stringify({estado:'done'}),headers:hdr}); }
}
async function repStart(id){
  const r=state.repeticiones.find(x=>String(x.id)===String(id)); const me=normalize(state.session||''); if(!r||!me) return;
  if(r.estado==='done' && r.enProcesoPor===me){ openRepCapture(r); return; }
  if(r.estado==='done' && r.enProcesoPor && !repLockStale(r)){ toast('Ya lo está fotografiando '+repWorkerName(r.enProcesoPor)); return; }
  try{
    const rows=await repClaim(r, me);
    if(!rows||!rows.length){ toast('Otra persona acaba de tomar este producto.'); await pollRepeticiones(true); return; }
    r.estado='done'; r.enProcesoPor=me; r.enProcesoDesde=new Date().toISOString();
    render(); openRepCapture(r);
  }catch(e){ console.error(e); toast('No se pudo iniciar. Revisa tu conexión e inténtalo de nuevo.'); }
}
async function repRelease(id, silent){
  const r=state.repeticiones.find(x=>String(x.id)===String(id)); if(!r) return;
  if(!silent && !confirm('¿Liberar este producto y dejarlo otra vez en pendientes?')) return;
  try{
    await repPatchSafe(id,{estado:'pending',en_proceso_por:null,en_proceso_desde:null},{estado:'pending'});
    r.estado='pending'; r.enProcesoPor=''; r.enProcesoDesde=null; render();
  }catch(e){ console.error(e); toast('No se pudo liberar el producto.'); }
}
