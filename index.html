async function clearCartToday(){
  if(!confirm(t('cartClearConfirm'))) return;
  try{
    await sb(`carrito?fecha=gte.${encodeURIComponent(cartTodayStartISO())}`, {method:'DELETE', headers:{'Prefer':'return=minimal'}});
    state.cart = [];
    updateCartListDOM();
  }catch(e){ toast(t('cartAddError')); }
}
async function deleteCartItem(id){
  if(!id || String(id).indexOf('tmp_')===0) return; // fila aún no confirmada por el servidor, espera un momento
  const it = state.cart.find(x=>String(x.id)===String(id));
  if(!it || !canDeleteCartItem(it)) return;
  if(!confirm(t('cartDeleteConfirm'))) return;
  const prevCart = state.cart;
  state.cart = state.cart.filter(x=>String(x.id)!==String(id));
  updateCartListDOM();
  try{
    await sb(`carrito?id=eq.${encodeURIComponent(id)}`, {method:'DELETE', headers:{'Prefer':'return=minimal'}});
  }catch(e){
    state.cart = prevCart;
    updateCartListDOM();
    toast(t('cartDeleteError'));
  }
}
async function addToCart(codigoRaw, producto){
  const codigo = producto ? (producto.codigo || normalize(codigoRaw)) : normalize(codigoRaw);
  if(!codigo) return;
  const dup = findCartDuplicate(codigo);
  if(dup){
    toast(`${t('cartAlreadyAdded')} ${dup.nombre_persona||dup.codigo_persona||''}`);
    vibrateFor('similar'); beepFor('similar');
    return;
  }
  const persona = myPersona();
  const nombrePersona = (persona && persona.nombre) ? persona.nombre : (state.session||'');
  const tempId = 'tmp_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const row = { id:tempId, codigo_producto:codigo, nombre_producto:producto&&producto.nombre?producto.nombre:'', base:state.scanBase, codigo_persona:normalize(state.session||''), nombre_persona:nombrePersona, fecha:new Date().toISOString() };
  state.cart.unshift(row);
  updateCartListDOM();
  vibrateFor('exact'); beepFor('exact');
  try{
    const res = await sb('carrito', {method:'POST', body:JSON.stringify([{codigo_producto:row.codigo_producto, nombre_producto:row.nombre_producto, base:row.base, codigo_persona:row.codigo_persona, nombre_persona:row.nombre_persona, fecha:row.fecha}]), headers:{'Prefer':'return=representation'}});
    if(res && res[0]){ row.id = res[0].id; }
  }catch(e){
    state.cart = state.cart.filter(it=>it.id!==tempId);
    updateCartListDOM();
    const detail = (e && e.message) ? String(e.message).slice(0,180) : '';
    toast(detail ? `${t('cartAddError')} (${detail})` : t('cartAddError'));
  }
}
/* Antes usábamos Supabase Realtime (WebSocket) para el carrito en vivo, pero dependía de
   que el canal conectara bien (Realtime habilitado en la tabla, RLS, red, etc.) y si fallaba
   la fila se quedaba "pegada" en optimista sin que nadie más la viera. Cambiamos a polling
   simple: cada 10s (y también al entrar al modo carrito) se vuelve a pedir el carrito del día
   por REST. Es más simple, más robusto y de sobra para un carrito que se actualiza a este ritmo. */
const CART_POLL_INTERVAL_MS = 10000;
function closeCartAddConfirm(){ const el=document.getElementById('cartAddConfirmOverlay'); if(el) el.remove(); }

function subscribeCartRealtime(){ startCartPolling(); }
function unsubscribeCartRealtime(){ stopCartPolling(); }
function startCartPolling(){
  if(state.cartPollTimer) return;
  state.cartPollTimer = setInterval(()=>{
    if(state.scanMode==='cart' && toolVisible('carrito')) loadCartToday();
    else stopCartPolling();
  }, CART_POLL_INTERVAL_MS);
}
function stopCartPolling(){
  if(state.cartPollTimer){ clearInterval(state.cartPollTimer); state.cartPollTimer = null; }
}
async function processCartScan(code){
  if(!code) return;
  let result = {status:'notfound'};
  try{
    await ensureBaseLoaded(state.scanBase);
    result = matchCode(code, state.scanBase) || {status:'notfound'};
  }catch(e){ /* si falla la carga de la base, igual contamos el producto físico */ }
  result.codigoEscaneado = code;
  state.scanResult = result; updateScanResultDOM();
  if(result.status==='multiple'){
    // Ambiguo por sufijo: esperamos a que la persona elija el producto correcto de la lista
    // (ver handler data-pick-suffix) en vez de agregarlo ya con un código incompleto.
    vibrateFor('similar'); beepFor('similar');
  } else if(result.status==='exact' || result.status==='similar'){
    // Ya existe (o se parece a algo que existe) en la base: el sheet unificado
    // ya ofrece el botón "Agregar a lista" (con chequeo de duplicado incluido).
    vibrateFor(result.status); beepFor(result.status);
  } else {
    // No está en la base: se agrega directo, guardando solo el código escaneado.
    addToCart(code, null);
  }
  logScan(code, result);
}
async function logScan(code,result){
  try{await sb('escaneos',{method:'POST',body:JSON.stringify([{codigo_persona:normalize(state.session||''),codigo_escaneado:normalize(code),codigo_producto:result.producto?result.producto.codigo:null,nombre_producto:result.producto?result.producto.nombre:null,base:state.scanBase,estado:result.status,fecha:new Date().toISOString()}]),headers:{'Prefer':'return=minimal'}});}catch(e){}
}
async function processScan(code,stopAfter=false){
  if(!code)return;
  try{ await ensureBaseLoaded(state.scanBase); }catch(e){ return; }
  state.scanResult=matchCode(code,state.scanBase)||{status:'notfound'};
  state.scanResult.codigoEscaneado=code;
  updateScanResultDOM(); vibrateFor(state.scanResult.status); beepFor(state.scanResult.status); logScan(code,state.scanResult); if(stopAfter)stopCamera();
}
function runVerify(code){
  const val=code!==undefined?code:document.getElementById('scanInput').value; if(!val)return;
  if(state.scanMode==='cart' && toolVisible('carrito')){ processCartScan(val); }
  else { processScan(val,false); }
}

      ['search','Buscar productos','Buscar por nombre, código o referencia',ICONS.search],
      ['rep','Herramientas','Repeticiones, contador y nombrador',ICONS.rep],
      ['settings','Ajustes','Tema, color, idioma y cuenta',ICONS.settings]
    ];
    const updateSpotlight=()=>{
      if(!panel)return;
      const raw=homeSearch.value.trim();
      const cleaned=stripAssistantFiller(raw);
      const q=cleaned.toLowerCase();
      const qNorm=normalizeForSearch(cleaned);
      const tokens=qNorm.split(' ').filter(Boolean);
      const items=[];
      commands.filter(c=>!q || c[1].toLowerCase().includes(q) || c[2].toLowerCase().includes(q)).slice(0,4).forEach(c=>items.push(`<div class="spotlight-item" data-spotlight-tab="${c[0]}"><div class="spotlight-item-icon">${c[3]}</div><div><strong>${c[1]}</strong><span>${c[2]}</span></div></div>`));
      if(tokens.length){
        const products=[...(state.bases['2025']||[]),...(state.bases['2026']||[])];
        const seen=new Set(); const scored=[];
        for(const p of products){
          const key=p.codigo||p.nombre; if(seen.has(key)) continue;
          const codeNorm=p.codigoSearch!==undefined?p.codigoSearch:normalizeForSearch(p.codigo||'');
          const nameNorm=p.nombreSearch!==undefined?p.nombreSearch:normalizeForSearch(p.nombre||'');
          const brandNorm=p.brandSearch!==undefined?p.brandSearch:extractBrand(p.nombre||'');
          const hay=`${nameNorm} ${codeNorm} ${brandNorm}`;
          let sc=spotlightScore(hay,tokens);
          if(sc<0) continue;
          if(codeNorm===qNorm) sc+=100; else if(codeNorm && codeNorm.startsWith(qNorm)) sc+=40;
          seen.add(key); scored.push({p,sc});

        scored.sort((a,b)=>b.sc-a.sc);

        }
        const dup = findNameDuplicate2026(nombre, codigo);
        const item={id:'n'+Date.now()+Math.random().toString(36).slice(2,6),codigo,nombre,duplicado:!!dup,duplicadoCodigo:dup?dup.codigo:null,duplicadoTipo:dup?.__dupReason||null,veriChecking:false,veriChecked:false,veriReason:null,sessionDup:!!sessionDupInfo,sessionDupWith:sessionDupInfo?sessionDupInfo.nombre:null,sessionDupCode:sessionDupInfo?sessionDupInfo.codigo:null,createdAt:Date.now(),syncStatus:'pending'};
        const esPrimero = !state.naming.items.length;
        state.naming.items.push(item);
        saveNaming();
        try{
          const row=await persistNamingRemote(item);
          item.id='remote_'+row.id;
          saveNaming();
        }catch(err){
          item.syncStatus='pending'; saveNaming();
          console.error('Error guardando nombrado en Supabase:',err);
        }
        document.getElementById('namingBarcode').value=''; document.getElementById('namingNombre').value=''; document.getElementById('namingSuggestion').innerHTML=''; if(spellWrap) spellWrap.innerHTML=''; if(formatWrap) formatWrap.innerHTML='';
        toast(dup ? t('namingDupWarning') : (sessionDupInfo ? t('namingSessionDupWarning') : t('imported')));
        render();
        // Verificación con Veri IA en segundo plano (igual que en Calidad): no bloquea el flujo
        // de escaneo/nombrado, pero corrige el aviso local (lo confirma o lo descarta) apenas responde.
        verifyNamingItemWithVeri(item).then(changed=>{
          if(changed){ saveNaming(); persistNamingEditRemote(item); render(); }
        });
      };
      document.querySelectorAll('[data-delnaming]').forEach(b=> b.onclick = async ()=>{
        if(!confirm(t('namingConfirmDelete'))) return;
        const itemId = b.dataset.delnaming;
        const item = state.naming.items.find(x=>x.id===itemId);
        try{
          if(itemId.startsWith('remote_')){
            const remoteId = itemId.slice(7);
            await sb(`nombrados_diarios?id=eq.${encodeURIComponent(remoteId)}`, {method:'DELETE'});
          }
          state.naming.items = state.naming.items.filter(x=>x.id!==itemId);
          saveNaming();
          render();
          toast(t('imported'));
        }catch(err){
          toast(t('errorImport'));
        }
      });
      document.querySelectorAll('[data-editnaming]').forEach(b=> b.onclick = ()=> openNamingEditModal(b.dataset.editnaming));
      bindNamingDrag();
      const dlBtn = document.getElementById('namingDownloadBtn');
      if(dlBtn) dlBtn.onclick = downloadNamingExcel;
      const editOrderBtn = document.getElementById('namingEditOrderBtn');
      if(editOrderBtn) editOrderBtn.onclick = ()=>{
        state.namingEditMode = !state.namingEditMode;
        if(!state.namingEditMode) state.namingSelected = [];
        render();
      };
      document.querySelectorAll('[data-previewnaming]').forEach(b=> b.onclick = ()=> openNamingPreview(b.dataset.previewnaming));
      document.querySelectorAll('[data-selectnaming]').forEach(el=> el.onclick = ()=>{
        const id = el.dataset.selectnaming;
        const idx = state.namingSelected.indexOf(id);
        if(idx>=0) state.namingSelected.splice(idx,1); else state.namingSelected.push(id);
        render();
      });
      const selectAllBtn = document.getElementById('namingSelectAllBtn');
      if(selectAllBtn) selectAllBtn.onclick = ()=>{
        const items = state.naming.items;
        if(state.namingSelected.length === items.length) state.namingSelected = [];
        else state.namingSelected = items.map(it=>it.id);
        render();
      };
      const deleteSelectedBtn = document.getElementById('namingDeleteSelectedBtn');
      if(deleteSelectedBtn) deleteSelectedBtn.onclick = async ()=>{
        const ids = state.namingSelected.slice();
        if(!ids.length){ toast(t('namingNoneSelected')); return; }
        if(!confirm(t('namingConfirmDeleteMultiple').replace('{count}', ids.length))) return;
        try{
          for(const itemId of ids){
            if(itemId.startsWith('remote_')){
              const remoteId = itemId.slice(7);
              await sb(`nombrados_diarios?id=eq.${encodeURIComponent(remoteId)}`, {method:'DELETE'});
            }
          }
          state.naming.items = state.naming.items.filter(x=> !ids.includes(x.id));
          state.namingSelected = [];
          saveNaming();
          render();
          toast(t('imported'));
        }catch(err){
          toast(t('errorImport'));
        }
      };
    } else if(state.repView==='quality'){
      ensureBaseLoaded('2026').catch(()=>{});
      const fileInput = document.getElementById('qualityFileInput');
      if(fileInput) fileInput.onchange = (e)=>{ const f=e.target.files[0]; if(f) importQualityExcel(f); e.target.value=''; };
      const manualInput = document.getElementById('qualityManualInput');
      const manualBtn = document.getElementById('qualityManualBtn');
      if(manualBtn) manualBtn.onclick = ()=>{ addQualityManual(manualInput.value); manualInput.value=''; };
      if(manualInput) manualInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ addQualityManual(manualInput.value); manualInput.value=''; } });
      const veriBtn = document.getElementById('qualityVeriBtn');
      if(veriBtn) veriBtn.onclick = runVeriQualityCheck;
      const dlBtn2 = document.getElementById('qualityDownloadBtn');
      if(dlBtn2) dlBtn2.onclick = downloadQualityReport;
      const clearBtn = document.getElementById('qualityClearBtn');
      if(clearBtn) clearBtn.onclick = clearQualityAll;
      document.querySelectorAll('[data-qyes]').forEach(b=> b.onclick = ()=> setQualityManualVerdict(b.dataset.qyes,'si'));
      document.querySelectorAll('[data-qno]').forEach(b=> b.onclick = ()=> setQualityManualVerdict(b.dataset.qno,'no'));
      document.querySelectorAll('[data-qdel]').forEach(b=> b.onclick = ()=> deleteQualityItem(b.dataset.qdel));
    }
  }
  if(state.tab==='settings'){
    if(isAdmin() && !state.adminStats.loading && !state.adminStats.loaded){ loadAdminStats().then(render); }
    if(hasAdminAccess() && state.adminSectionsOpen.feedback && !state.feedbackLoading && !state.feedbackLoaded){ loadFeedback().then(render); }
    if(hasAdminAccess() && state.adminSectionsOpen.errors && !state.errorsLoading && !state.errorsLoaded){ loadAppErrors().then(render); }
    const saveUsernameBtn=document.getElementById('saveUsernameBtn');
    if(saveUsernameBtn) saveUsernameBtn.onclick=async()=>{const name=document.getElementById('usernameEdit')?.value.trim();if(!name)return;try{await sb(`personas?codigo=eq.${encodeURIComponent(normalize(state.session||''))}`,{method:'PATCH',body:JSON.stringify({nombre:name}),headers:{'Prefer':'return=minimal'}});const me=state.personas.find(p=>p.codigo===normalize(state.session||''));if(me)me.nombre=name;toast(t('nameSaved'));render();}catch(e){toast(t('errorImport'));}};
    const avatarEditBtn=document.getElementById('avatarEditBtn');
    if(avatarEditBtn) avatarEditBtn.onclick=()=>{
      if(!state.avatarPickerOpen){
        const me=state.personas.find(p=>p.codigo===normalize(state.session||''));
        const cfg=parseAvatarConfig(me);
        state.avatarPickerMode = cfg ? 'builder' : 'emoji';
        state.avatarDraft = cfg || randomMemojiConfig();
        state.avatarBuilderCat = 'bg';
      }
      state.avatarPickerOpen=!state.avatarPickerOpen; render();
    };
    wireAvatarPicker();
    document.querySelectorAll('[data-admin-edit-name]').forEach(b=>b.onclick=async()=>{const code=b.dataset.adminEditName;const person=state.personas.find(p=>p.codigo===code);const name=prompt(t('usernameLabel'),person?.nombre||'');if(name===null)return;try{await sb(`personas?codigo=eq.${encodeURIComponent(code)}`,{method:'PATCH',body:JSON.stringify({nombre:name.trim()}),headers:{'Prefer':'return=minimal'}});if(person)person.nombre=name.trim();toast(t('nameSaved'));render();}catch(e){toast(t('errorImport'));}});
    document.querySelectorAll('[data-lang]').forEach(b=> b.onclick=()=>{ state.prefs.lang=b.dataset.lang; savePrefs(); render(); });
    document.querySelectorAll('[data-theme-btn]').forEach(b=> b.onclick=()=>{ state.prefs.theme=b.dataset.themeBtn; savePrefs(); render(); });
    document.querySelectorAll('[data-defbase]').forEach(b=> b.onclick=()=>{ state.prefs.defaultBase=b.dataset.defbase; state.scanBase=b.dataset.defbase; savePrefs(); render(); });
    document.querySelectorAll('[data-accent]').forEach(b=> b.onclick=()=>{ state.prefs.accent=b.dataset.accent; savePrefs(); render(); });
    document.querySelectorAll('[data-feedbacktype]').forEach(b=> b.onclick=()=>{ state.feedbackForm.tipo=b.dataset.feedbacktype; render(); });
    const feedbackMsg = document.getElementById('feedbackMsg');
    if(feedbackMsg) feedbackMsg.oninput = (e)=>{ state.feedbackForm.mensaje = e.target.value; };
    const feedbackSendBtn = document.getElementById('feedbackSendBtn');
    if(feedbackSendBtn) feedbackSendBtn.onclick = sendFeedback;
    const vibSwitch = document.getElementById('vibrationSwitch');
    if(vibSwitch) vibSwitch.onchange = (e)=>{ state.prefs.vibration = e.target.checked; savePrefs(); };
    const soundSwitch = document.getElementById('soundSwitch');
    if(soundSwitch) soundSwitch.onchange = (e)=>{ state.prefs.sound = e.target.checked; savePrefs(); if(e.target.checked){ unlockAudio(); playScanSound('exact'); } };
    document.querySelectorAll('[data-sound-style]').forEach(btn=>{
      btn.onclick = ()=>{
        const style = btn.dataset.soundStyle;
        state.prefs.soundStyle = style;
        savePrefs();
        document.querySelectorAll('[data-sound-style]').forEach(b=>b.classList.toggle('active', b.dataset.soundStyle===style));
        unlockAudio();
        playScanSound('exact', style);
      };
    });
    const namingFormatCheckSwitch = document.getElementById('namingFormatCheckSwitch');
    if(namingFormatCheckSwitch) namingFormatCheckSwitch.onchange = (e)=>{ state.prefs.namingFormatCheck = e.target.checked; savePrefs(); };
    const namingAgreementsCheckSwitch = document.getElementById('namingAgreementsCheckSwitch');
    if(namingAgreementsCheckSwitch) namingAgreementsCheckSwitch.onchange = (e)=>{ state.prefs.namingAgreementsCheck = e.target.checked; savePrefs(); };
    const cartDefaultOnSwitch = document.getElementById('cartDefaultOnSwitch');
    if(cartDefaultOnSwitch) cartDefaultOnSwitch.onchange = (e)=>{
      state.prefs.cartDefaultOn = e.target.checked;
      savePrefs();
      if(!e.target.checked && state.scanMode==='cart'){ state.scanMode='continuous'; unsubscribeCartRealtime(); }
      state.cartModeInitialized = false;
    };
    const veriAIEnableSwitch = document.getElementById('veriAIEnableSwitch');
    if(veriAIEnableSwitch) veriAIEnableSwitch.onchange = (e)=>{ state.prefs.aiEnabled = e.target.checked; savePrefs(); };
    const veriAIKeySaveBtn = document.getElementById('veriAIKeySaveBtn');
    if(veriAIKeySaveBtn) veriAIKeySaveBtn.onclick = async ()=>{
      const val = (document.getElementById('veriAIKeyInput').value||'').trim();
      veriAIKeySaveBtn.disabled = true;
      try{
        await sb('config?id=eq.1', {method:'PATCH', body:JSON.stringify({groq_api_key: val || null}), headers:{'Prefer':'return=minimal'}});
        state.veriApiKey = val || null;
        toast(val ? t('veriAIKeySaved') : t('veriAIKeyRemoved'));
        render();
      }catch(err){
        console.error('Veri IA: fallo al guardar la clave', err);
        const msg = String(err && err.message || '');
        if(/groq_api_key/i.test(msg) || /column .* does not exist/i.test(msg) || /PGRST204/i.test(msg)){
          toast(t('veriAIKeySaveErrorColumn'));
        } else {
          toast(t('veriAIKeySaveErrorGeneric') + (msg ? ': '+msg.slice(0,120) : ''));
        }
        veriAIKeySaveBtn.disabled = false;
      }
    };
    const soundTestBtn = document.getElementById('soundTestBtn');
    if(soundTestBtn) soundTestBtn.onclick = ()=>{ unlockAudio(); beepFor('exact'); };
    document.getElementById('logoutBtn').onclick = logout;
    if(hasAdminAccess()){
      document.querySelectorAll('[data-togglesection]').forEach(b=> b.onclick = ()=>{
        const id = b.dataset.togglesection;
        state.adminSectionsOpen = {...state.adminSectionsOpen, [id]: !(state.adminSectionsOpen[id]!==undefined ? state.adminSectionsOpen[id] : (id==='stats'))};
        render();
      });
      ['2025','2026'].forEach(y=>{ const el = document.getElementById('import'+y); if(el) el.onchange = (e)=>{ if(e.target.files[0]) importExcelProducts(e.target.files[0], y); }; });
      const repSet = document.getElementById('importRepSettings');
      if(repSet) repSet.onchange = (e)=>{ if(e.target.files[0]) importExcelRepeticiones(e.target.files[0], document.getElementById('repFilterCodeSettings').value); };
      const repSaveBtn = document.getElementById('repSaveBtn');
      if(repSaveBtn) repSaveBtn.onclick = saveRepetition;
    }
    if(isAdmin()){
      document.querySelectorAll('[data-feedbackstatus]').forEach(sel=> sel.onchange = async ()=>{
        const id = sel.dataset.feedbackstatus;
        const nuevo = sel.value;
        const item = state.feedbackList.find(f=>String(f.id)===String(id));
        try{
          await sb(`feedback?id=eq.${encodeURIComponent(id)}`, {method:'PATCH', body:JSON.stringify({estado:nuevo}), headers:{'Prefer':'return=minimal'}});
          if(item) item.estado = nuevo;
        }catch(err){ toast(t('errorImport')); render(); }
      });
      document.querySelectorAll('[data-delerror]').forEach(b=> b.onclick = async ()=>{
        const id = b.dataset.delerror;
        try{
          await sb(`app_errors?id=eq.${encodeURIComponent(id)}`, {method:'DELETE'});
          state.errorsList = state.errorsList.filter(e=>String(e.id)!==String(id));
          render();
        }catch(err){ toast(t('errorImport')); }
      });
      document.querySelectorAll('[data-togglematrix]').forEach(b=> b.onclick = ()=>{
        const code = b.dataset.togglematrix;
        state.toolMatrixOpen = {...state.toolMatrixOpen, [code]: !state.toolMatrixOpen[code]};
        render();
      });
      document.querySelectorAll('[data-toolflag-person]').forEach(sw=> sw.onchange = async ()=>{
        const code = sw.dataset.toolflagPerson;
        const id = sw.dataset.toolflag;
        const person = state.personas.find(p=>p.codigo===code);
        if(!person) return;
        const prevAccess = personaToolAccess(person);
        const nextAccess = {...prevAccess, [id]: sw.checked};
        try{
          await sb(`personas?codigo=eq.${encodeURIComponent(code)}`, {method:'PATCH', body:JSON.stringify({tool_access: nextAccess}), headers:{'Prefer':'return=minimal'}});
          person.tool_access = nextAccess;
          toast(t('adminToolAccessSaved'));
          render();
        }catch(err){
          console.error('Herramientas por persona: fallo al guardar', err);
          const msg = String(err && err.message || '');
          if(/tool_access/i.test(msg) || /column .* does not exist/i.test(msg) || /PGRST204/i.test(msg)){
            toast(t('adminToolAccessErrorColumn'));
          } else {
            toast(t('errorImport'));
          }
          sw.checked = !sw.checked;
        }
      });
      document.querySelectorAll('[data-setrole]').forEach(sel=> sel.onchange = async ()=>{
        const code = sel.dataset.setrole;
        const newRole = sel.value || null;
        const person = state.personas.find(p=>p.codigo===code);
        if(person && person.codigo===normalize(state.session||'') && person.rol==='admin' && newRole!=='admin'){
          if(!confirm(t('confirmSelfDemote'))){ render(); return; }
        }
        try{
          await sb(`personas?codigo=eq.${encodeURIComponent(code)}`, {method:'PATCH', body:JSON.stringify({rol:newRole}), headers:{'Prefer':'return=minimal'}});
          if(person) person.rol = newRole;
          toast(t('roleSaved'));
          render();
        }catch(err){ toast(t('adminRoleColumnMissing')); render(); }
      });
      document.getElementById('addPersonBtn').onclick = async ()=>{
        const code = normalize(document.getElementById('newPersonCode').value);
        const name = document.getElementById('newPersonName').value.trim();
        if(!code) return;
        try{
          await sb('personas', {method:'POST', body:JSON.stringify([{codigo:code, nombre:name}]), headers:{'Prefer':'resolution=merge-duplicates,return=minimal'}});
          state.personas = state.personas.filter(p=>p.codigo!==code);
          state.personas.push({codigo:code, nombre:name});
          state.personas.sort((a,b)=>a.codigo.localeCompare(b.codigo));
          render();
        }catch(err){ toast(t('errorImport')); }
      };
      document.querySelectorAll('[data-delperson]').forEach(b=> b.onclick = async ()=>{
        try{ await sb(`personas?codigo=eq.${encodeURIComponent(b.dataset.delperson)}`, {method:'DELETE'}); state.personas = state.personas.filter(p=>p.codigo!==b.dataset.delperson); render(); }
        catch(err){ toast(t('errorImport')); }
      });
      document.querySelectorAll('[data-resetpin]').forEach(b=> b.onclick = async ()=>{
        if(!confirm(t('confirmResetPin'))) return;
        try{
          await sb(`personas?codigo=eq.${encodeURIComponent(b.dataset.resetpin)}`, {method:'PATCH', body:JSON.stringify({pin_hash:null}), headers:{'Prefer':'return=minimal'}});
          const p = state.personas.find(x=>x.codigo===b.dataset.resetpin); if(p) p.pin_hash=null;
          render();
        }catch(err){ toast(t('errorImport')); }
      });
      const changePwBtn = document.getElementById('adminChangePwBtn');
      if(changePwBtn) changePwBtn.onclick = async ()=>{
        const val = document.getElementById('adminNewPw').value;
        if(!val) return;
        try{ await sb('config?id=eq.1', {method:'PATCH', body:JSON.stringify({admin_password:val}), headers:{'Prefer':'return=minimal'}}); state.adminPassword = val; toast(t('imported')); render(); }
        catch(err){ toast(t('errorImport')); }
      };
    }
  }
  bindAdminGateIfPresent();
}
async function doSearch(){
  try{await ensureBaseLoaded(state.scanBase||state.prefs.defaultBase||'2026');}catch(e){return;}
  const input = document.getElementById('searchInput');
  const wrap = document.getElementById('searchResultsWrap');
  if(!input || !wrap) return;
  const q = input.value;
  if(!q){ wrap.innerHTML=''; return; }
  const {results, fuzzy} = searchProducts(q, state.scanBase);
  if(!results.length){ wrap.innerHTML = `<div class="empty">${t('noResults')}</div>`; return; }
  wrap.innerHTML = (fuzzy
    ? `<p class="small-note" style="margin:0 0 8px 2px;">${t('fuzzyNote')}</p>`
    : `<p class="small-note" style="margin:0 0 8px 2px;">${results.length} ${t('searchResults')}</p>`)
    + results.map(p=>`<div class="list-item"><div><div class="name">${p.nombre||'(sin nombre)'}</div></div><div class="code">${p.codigo}</div></div>`).join('');
}
async function saveRepetition(){
  const codigoProducto = normalize(document.getElementById('repCodProd').value);
  const nombreProducto = normalize(document.getElementById('repNomProd').value);
  if(!codigoProducto && !nombreProducto){ toast('!'); return; }
  const fotografoEl = document.getElementById('repFotografo');
  const fotografo = fotografoEl ? fotografoEl.value : '';
  const codigoBarras = normalize(document.getElementById('repBarras').value);
  const motivo = document.getElementById('repMotivo').value.trim();
  const categoria = document.getElementById('repCategoria')?.value || inferCategory(nombreProducto);
  const payload = { codigo_producto:codigoProducto, nombre_producto:nombreProducto, categoria, fotografo, codigo_barras:codigoBarras, motivo, estado:'pending', archivado:false, fecha: Date.now() };
  try{
    const res = await sb('repeticiones', {method:'POST', body:JSON.stringify([payload]), headers:{'Prefer':'return=representation'}});
    const row = res[0];
    state.repeticiones.unshift({ id:row.id, codigoProducto, nombreProducto, categoria, fotografo, codigoBarras, motivo, estado:'pending', archivado:false, fecha: payload.fecha });
    document.getElementById('repCodProd').value=''; document.getElementById('repNomProd').value='';
    document.getElementById('repBarras').value=''; document.getElementById('repMotivo').value='';
    toast(t('imported'));
    render();
  }catch(err){ toast(t('errorImport')); }
}

/* ===================== Init ===================== */
boot();
</script>
