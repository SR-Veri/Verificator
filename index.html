/* ===================== Ciclo diario del Nombrador =====================
   No existe una ventana de 24 horas: los nombrados se conservan por fecha y pasan a Archivados. */
let namingDayWatcher=null;
function startNamingDayWatcher(){
  if(namingDayWatcher) return;
  namingDayWatcher=setInterval(async()=>{
    if(!state.session) return;
    const today=todayKey();
    if(state.naming&&state.naming.date!==today){
      loadNaming(); state.archived={loaded:false,loading:false,byDate:{},dates:[],selectedDate:null};
      try{ const rows=await fetchNamingRemote(); if(Array.isArray(rows)) await syncNamingRemoteRows(rows); }catch(e){}
      render();
    }
  },30000);
}
/* Extrae la cantidad neta del nombre (peso en gramos O volumen en mililitros), junto con su
   "tipo" (weight/volume), para poder comparar productos correctamente. Antes esta función solo
   reconocía KG/G y no ML/L, así que dos productos con volúmenes distintos (ej. 237ML vs 1.5L)
   pasaban como "mismo peso" para efectos de duplicados, porque ambos daban null. Ahora se
   reconocen también los mililitros/litros (y oz/lb como aproximación), normalizados a gramos
   o mililitros según corresponda, y solo se consideran "iguales" si son del mismo tipo. */
function extractQuantity(name){
  const s=normalize(name);
  const m=s.match(/(?:^|[\s,;\/-])(\d+(?:[.,]\d+)?)\s*(KG|KGS|KILO|KILOS|G|GR|GRAMO|GRAMOS|ML|MLS|L|LT|LTS|LITRO|LITROS|OZ|LB|LBS)\b/i);
  if(!m) return null;
  const n=parseFloat(m[1].replace(',','.')); if(!Number.isFinite(n)) return null;
  const unit=m[2].toUpperCase();
  if(['KG','KGS','KILO','KILOS'].includes(unit)) return {value:n*1000, kind:'weight'};
  if(['G','GR','GRAMO','GRAMOS'].includes(unit)) return {value:n, kind:'weight'};
  if(['L','LT','LTS','LITRO','LITROS'].includes(unit)) return {value:n*1000, kind:'volume'};
  if(['ML','MLS'].includes(unit)) return {value:n, kind:'volume'};
  if(unit==='LB'||unit==='LBS') return {value:n*453.592, kind:'weight'};
  if(unit==='OZ') return {value:n*28.3495, kind:'weight'};
  return null;
}
/* Compara dos cantidades: si alguna es desconocida, no se puede afirmar nada (no bloquea ni
   confirma). Si ambas se conocen, solo son "la misma" si además son del mismo tipo
   (peso vs. volumen) -- así 500G nunca se confunde con 500ML. */
function sameQuantity(qA, qB){
  if(!qA || !qB) return null;
  return qA.kind===qB.kind && Math.abs(qA.value-qB.value)<0.001;
}
/* Se mantiene por compatibilidad con el resto del código: devuelve solo el número (para los
   pocos usos que solo necesitan comparar dentro del mismo tipo ya filtrado). */
function extractMassGrams(name){
  const q = extractQuantity(name);
  return q ? q.value : null;
}
function flavorSignature(name){
  const parts=normalize(name).split(/[,;|]+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length<2) return null;
  // Antes se elegía un solo segmento "del medio" (parts.slice(1,-1)) como firma de sabor/variante,
  // así que si el nombre traía una coma extra antes del sabor (ej. "...EN TROZOS, DE MORA, 500G, B")
  // ese último segmento con el sabor quedaba descartado y dos sabores distintos (MORA/GUANABANA)
  // terminaban con la MISMA firma -> falso duplicado. Ahora se usan TODOS los segmentos que no sean
  // la marca (primer segmento) ni la cantidad neta, sin importar cuántas comas tenga el nombre.
  const c=parts.slice(1).filter(p=>!extractQuantity(p)).map(p=>p.replace(/\b[A-Z]?\d+\b/g,'').replace(/\s+/g,' ').trim()).filter(p=>p.length>=4);
  if(!c.length) return null;
  return normalizeForSearch(c.join(' ')).split(' ').filter(Boolean).sort().join(' ');
}
function tokenSet(name){
  return new Set(normalizeForSearch(name).split(' ').filter(Boolean));
}
function jaccardSim(setA,setB){
  if(!setA.size||!setB.size) return 0;
  let inter=0; for(const x of setA) if(setB.has(x)) inter++;
  return inter/(setA.size+setB.size-inter);
}
/* La palabra de sabor/referencia es la que sigue a "SABOR" o "SABOR A" (ej. NARANJA, SALPICON).
   Si dos nombres declaran sabores distintos, son variantes distintas del mismo producto, nunca duplicados. */
function extractFlavorWord(name){
  const s = normalize(name);
  const m = s.match(/\bSABOR(?:\s+A)?\s+([A-Z]+)/);
  return m ? m[1] : null;
}
/* Nombres "parecidos" aunque no sean idénticos: misma marca, misma cantidad neta (si ambos la
   traen, sea peso o volumen), mismo sabor (si ambos lo declaran) y la mayoría de las palabras
   coinciden (ej. agregar/quitar una palabra como "ESPECIAL"). */
function namesLookSimilar(nameA, nameB){
  const brandA=extractBrand(nameA), brandB=extractBrand(nameB);
  if(brandA && brandB && brandA!==brandB) return false;
  const qtyA=extractQuantity(nameA), qtyB=extractQuantity(nameB);
  if(qtyA && qtyB && !sameQuantity(qtyA,qtyB)) return false;
  const flavorA=extractFlavorWord(nameA), flavorB=extractFlavorWord(nameB);
  if(flavorA && flavorB && flavorA!==flavorB) return false;
  // Además del patrón "SABOR X", cubrimos frases como "EN TROZOS DE MORA" o "PULPA DE GUANABANA":
  // si el segmento distintivo del nombre (mismo que usa el chequeo de mismo sabor/peso) difiere,
  // son sabores/variantes distintas y NUNCA deben marcarse como posible duplicado, aunque el resto
  // de las palabras coincida casi todo.
  const sigA=flavorSignature(nameA), sigB=flavorSignature(nameB);
  if(sigA && sigB && sigA!==sigB) return false;
  return jaccardSim(tokenSet(nameA), tokenSet(nameB))>=0.65;
}
/* Nivel de severidad de un duplicado, para mostrarlo distinto en la interfaz:
   - "alta" (rojo): son el mismo producto con certeza (nombre idéntico o el código de barras
     ya fue nombrado antes en la base 2026).
   - "media" (ámbar, como antes): es un posible duplicado que conviene revisar, pero no es 100% seguro
     (mismo sabor+peso+marca, o nombre muy parecido). */
function dupSeverity(tipo){
  return (tipo==='exact' || tipo==='code' || tipo==='veri') ? 'alta' : 'media';
}
function findNameDuplicate2026(nombreNorm, excludeCodigo){
  const idx=state.index['2026']; if(!idx) return null;
  // Mismo código ya usado/nombrado en la base 2026 -> ese producto ya existe, sin importar si el nombre coincide.
  if(excludeCodigo && idx.map.has(excludeCodigo)){
    return Object.assign({},idx.map.get(excludeCodigo),{__dupReason:'code'});
  }
  for(const p of idx.list){if(p.codigo!==excludeCodigo&&p.nombre===nombreNorm)return Object.assign({},p,{__dupReason:'exact'});}
  // Mismo nombre pero con las palabras en otro orden -> sigue siendo el mismo producto.
  const tokenKey = normalizeForSearch(nombreNorm).split(' ').filter(Boolean).sort().join(' ');
  if(tokenKey){
    for(const p of idx.list){
      if(p.codigo===excludeCodigo) continue;
      const pKey = normalizeForSearch(p.nombre).split(' ').filter(Boolean).sort().join(' ');
      if(pKey && pKey===tokenKey) return Object.assign({},p,{__dupReason:'exact'});
    }
  }
  const qty=extractQuantity(nombreNorm), flavor=flavorSignature(nombreNorm), brand=extractBrand(nombreNorm);
  if(qty && flavor && brand){
    for(const p of idx.list){if(p.codigo===excludeCodigo)continue; const pq=extractQuantity(p.nombre), pf=flavorSignature(p.nombre), pb=extractBrand(p.nombre); if(pq&&sameQuantity(pq,qty)&&pf&&pf===flavor&&pb&&pb===brand)return Object.assign({},p,{__dupReason:'sameFlavorMass'});}
  }
  // Última red: nombre muy parecido (misma marca, misma cantidad neta, casi las mismas palabras) -> posible duplicado, se deja pasar si el usuario confirma que es distinto.
  for(const p of idx.list){
    if(p.codigo===excludeCodigo) continue;
    if(namesLookSimilar(nombreNorm, p.nombre)) return Object.assign({},p,{__dupReason:'similar'});
  }
  return null;
}
/* Quita tildes y convierte ñ/Ñ en n/N en vivo, mientras se escribe (evita que se guarden nombres con tildes o eñes). */
function stripAccentsLive(s){
  return (s===undefined||s===null?'':String(s)).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
/* Vocabulario de palabras ya usadas en la base 2026, con su frecuencia. Sirve como "diccionario" de
   referencia para detectar posibles errores de tipeo o palabras pegadas al nombrar un producto nuevo. */
let __wordFreqCache = null;
function getNaming2026WordFreq(){
  const idx = state.index['2026'];
  const size = idx ? idx.list.length : 0;
  if(__wordFreqCache && __wordFreqCache.__size===size) return __wordFreqCache;
  const freq = new Map();
  if(idx){
    for(const p of idx.list){
      const tokens = normalizeForSearch(p.nombre||'').split(' ').filter(Boolean);
      for(const tok of tokens){
        if(tok.length<4 || /^\d+$/.test(tok)) continue;
        freq.set(tok, (freq.get(tok)||0)+1);
      }
    }
  }
  freq.__size = size;
  __wordFreqCache = freq;
  return freq;
}
/* Revisa el nombre palabra por palabra contra el vocabulario conocido (base 2026) y señala:
   - posibles errores de tipeo (ej. SAVOR en vez de SABOR, a 1 letra de diferencia de una palabra frecuente)
   - posibles palabras pegadas (ej. SABORA en vez de SABOR A, que se puede partir en dos palabras conocidas) */
const NAMING_SHORT_CONNECTORS = new Set(['A','Y','O','E','U','DE','EN','CON','SIN','POR','PARA','EL','LA','LOS','LAS','AL','DEL','UN','UNA']);
/* Vocabulario fijo de palabras comunes en nombres de producto (empaques, sabores, categorías,
   formatos). Se usa además del vocabulario aprendido de la base 2026, para no marcar como
   "error" una palabra correcta que todavía es poco frecuente en la base, y para poder sugerir
   la corrección aunque esa palabra correcta casi no aparezca todavía. */
const NAMING_KNOWN_WORDS = new Set([
  'BOTELLA','LATA','BOLSA','CAJA','FRASCO','TARRO','SOBRE','PAQUETE','BLISTER','TETRAPAK','GARRAFA','BIDON','POTE','VASO','CUBETA','ENVASE','EMPAQUE','CANASTA','ESTUCHE','DISPLAY','BANDEJA','FUNDA','PIMPINA','GALON',
  'NARANJA','LIMON','FRESA','MANZANA','UVA','MANGO','MORA','PINA','COCO','VAINILLA','MENTA','CANELA','CHOCOLATE','CAFE','FRUTOS','ROJOS','TROPICAL','CITRICO','DURAZNO','MARACUYA','GUANABANA','MELOCOTON','ARANDANO','FRAMBUESA','CEREZA','SANDIA','MELON','KIWI','GRANADILLA','LULO','TAMARINDO','BANANO','PLATANO','FRUTA','FRUTAL',
  'REFRESCO','BEBIDA','JUGO','NECTAR','GASEOSA','CERVEZA','VINO','AGUA','LECHE','YOGUR','YOGURT','KUMIS','QUESO','MANTEQUILLA','MARGARINA','ACEITE','ARROZ','AZUCAR','HARINA','PASTA','SALSA','MAYONESA','MOSTAZA','KETCHUP','ADEREZO','VINAGRE','SAL','PIMIENTA','CONDIMENTO','ESPECIA','CEREAL','GRANOLA','AVENA','MERMELADA','GALLETA','GALLETAS','DULCE','CARAMELO','CHICLE','PALETA','GOMA','WAFER','BARRA','SNACK','PAPAS','FRITAS','PAN','TORTILLA','HELADO','POSTRE','HUEVO','HUEVOS','ATUN','SARDINA','POLLO','CERDO','RES','PESCADO','JAMON','SALCHICHA','TOCINO','EMBUTIDO','DETERGENTE','JABON','SHAMPOO','ACONDICIONADOR','CREMA','DESODORANTE','PANAL','PANALES','SERVILLETA','PAPEL','HIGIENICO','TOALLA','ENERGIZANTE','PROTEINA','SUERO','INFUSION','CHOCOLATINA','CONFITE','BOMBON',
  'FAMILIAR','PERSONAL','ORIGINAL','LIGHT','EXTRA','GRANDE','PEQUENO','MEDIANO','CLASICO','TRADICIONAL','ESPECIAL','PREMIUM','NATURAL','INTEGRAL','ENTERA','DESLACTOSADA','SEMIDESCREMADA','DESCREMADA','CONTIENE','SABOR'
]);
/* Regex de cantidad neta válida (peso o volumen), la misma que exige checkNameFormat. Se reutiliza
   aquí para que el corrector de errores avise si falta, sin depender de que el aviso de formato
   (que se puede desactivar en Ajustes) esté encendido. */
const NAMING_WEIGHT_REGEX = /\d+(?:[.,]\d+)?\s*(KG|KGS|KILO|KILOS|G|GR|GRAMO|GRAMOS|ML|MLS|L|LT|LTS|LITRO|LITROS|OZ|LB|LBS)\b/i;
function checkNameSpelling(nombreNorm){
  const issues = [];
  const raw = (nombreNorm||'');
  // Espacios dobles (o más): no deberían existir en el nombre, sin importar qué tan grande
  // sea el diccionario aprendido de la base 2026, así que este chequeo va primero y siempre corre.
  if(/ {2,}/.test(raw)){
    issues.push({type:'space', word:t('namingSpellDoubleSpaceWord'), suggestion: raw.replace(/ {2,}/g,' ').trim()});
  }
  // El peso/volumen neto (kg, g, ml, l, etc.) siempre debe estar presente en el nombre.
  if(raw.trim() && !NAMING_WEIGHT_REGEX.test(normalize(raw))){
    issues.push({type:'weight', word:t('namingSpellMissingWeightWord'), suggestion:t('namingSpellMissingWeightHint')});
  }
  const freq = getNaming2026WordFreq();
  const MIN_FREQ = 3;
  if(freq.size < 20) return issues; // muy poca base para confiar en el diccionario todavía (los 2 chequeos de arriba sí aplican)
  const isKnownWord = (w)=> NAMING_KNOWN_WORDS.has(w) || (freq.get(w)||0)>=MIN_FREQ;
  const isKnownPiece = (w)=> NAMING_SHORT_CONNECTORS.has(w) || isKnownWord(w);
  const tokens = normalizeForSearch(nombreNorm).split(' ').filter(Boolean);
  for(const tok of tokens){
    // Los tokens con números (pesos, porcentajes, medidas: "500ML", "35G", "8") no se revisan
    // ortográficamente: el peso/valor varía legítimamente de un producto a otro, no es un error.
    if(tok.length<4 || /\d/.test(tok)) continue;
    if(isKnownWord(tok)) continue; // palabra ya conocida (base 2026 o diccionario fijo), está bien
    let found=false;
    // ¿palabras pegadas? (se puede partir en dos palabras conocidas, incluyendo conectores cortos como "A"/"DE")
    for(let i=2;i<tok.length;i++){
      const left=tok.slice(0,i), right=tok.slice(i);
      if(isKnownPiece(left) && isKnownPiece(right)){
        issues.push({type:'split', word:tok, suggestion:left+' '+right}); found=true; break;
      }
    }
    if(found) continue;
    // ¿posible error de tipeo? Para palabras cortas exige 1 sola letra de diferencia; para palabras
    // más largas (>=7) permite hasta 2, para detectar más errores reales sin ser tan estricto.
    const maxDist = tok.length>=7 ? 2 : 1;
    let bestTypo=null, bestDist=maxDist+1;
    for(const [word,count] of freq){
      if(count<MIN_FREQ || Math.abs(word.length-tok.length)>maxDist || word===tok) continue;
      const d = levenshtein(tok,word);
      if(d<=maxDist && d<bestDist){ bestDist=d; bestTypo=word; if(d===1) break; }
    }
    if(!bestTypo){
      // También se compara contra el diccionario fijo, por si la palabra correcta casi no
      // aparece todavía en la base 2026 (ej. es la primera vez que se nombra ese sabor/empaque).
      for(const word of NAMING_KNOWN_WORDS){
        if(Math.abs(word.length-tok.length)>maxDist || word===tok) continue;
        const d = levenshtein(tok,word);
        if(d<=maxDist && d<bestDist){ bestDist=d; bestTypo=word; if(d===1) break; }
      }
    }
    if(bestTypo) issues.push({type:'typo', word:tok, suggestion:bestTypo});
  }
  return issues;
}
/* Interpreta la barra de "Pregúntale a Veri" de forma más flexible: quita saludos
   y frases de relleno ("oye veri", "buscar", "muéstrame el producto", "código", etc.)
   para quedarse solo con lo que realmente se quiere encontrar. */
function stripAssistantFiller(q){
  let s = (q||'').trim();
  s = s.replace(/^(hola[,\s]+|oye[,\s]+|hey[,\s]+)?veri[,:\s]+/i, '');
  s = s.replace(/^(por favor[,\s]+)?(buscar|busca|encuentra|encontrar|muestrame|mu[eé]strame|mostrame|m[oó]strame|verificar|verifica|ver|abrir|abre|dame|necesito|quiero(?:\s+ver|\s+buscar)?)\s+/i, '');
  s = s.replace(/^(el|la|los|las|un|una)\s+producto(s)?\s+/i, '');
  s = s.replace(/^producto\s+/i, '');
  s = s.replace(/^c[oó]digo\s+/i, '');
  return s.trim();
}
/* Puntúa qué tan bien coincide un texto (nombre/código/marca de un producto) con los
   términos escritos, exigiendo que TODOS los términos aparezcan (en cualquier orden) y
   dando más peso a coincidencias exactas o al inicio de palabra, para resultados más
   relevantes que una simple búsqueda de subcadena. */
function spotlightScore(hayNorm, tokens){
  if(!tokens.length) return 0;
  let score = 0;
  const words = hayNorm.split(' ');
  for(const tok of tokens){
    if(!hayNorm.includes(tok)) return -1;
    if(words.includes(tok)) score += 4;
    else if(words.some(w=>w.startsWith(tok))) score += 2;
    else score += 1;
  }
  return score;
}

/* ===================== Veri IA (Groq, gratis) =====================
   La clave de API de Groq la configura UNA sola vez el administrador desde
   Ajustes → Administrador (se guarda en la tabla config, columna groq_api_key)
   y se comparte automáticamente para que Veri IA funcione igual para todas
   las personas que usan la app, sin que cada quien tenga que conseguir ni
   pegar su propia clave. Veri conoce el funcionamiento de la app para poder
   explicar, por ejemplo, cómo cambiar el color de acento o el nombre del
   perfil, además de responder preguntas generales. Usa el endpoint de Groq
   compatible con OpenAI (chat completions) con un modelo abierto rápido y
   gratuito. */
const VERI_AI_MODEL = 'openai/gpt-oss-120b';
const VERI_AI_SYSTEM_CONTEXT = `Eres "Veri", el asistente conversacional integrado en la app Veri (una app para verificar y nombrar productos frente a bases de datos de años 2025 y 2026). Respondes siempre en español, de forma breve, clara, cercana y sin relleno innecesario.
Conoces bien la app y puedes explicar cómo usarla:
- Escanear producto: usa la cámara del celular o computador para leer un código de barras o QR y verificar si el producto existe en la base 2025 o 2026. Se puede elegir la base y activar el modo de escaneo continuo. En celulares con varios lentes (ej. iPhone con teleobjetivo) se puede elegir qué cámara/lente usar desde un selector que aparece sobre la cámara.
- Buscar: busca productos por nombre, código de barras o marca, en cualquiera de las dos bases, con resultados ordenados por relevancia.
- Herramientas: agrupa Repeticiones (productos pendientes, hechos o enviados), Contador y Nombrador. El Nombrador ayuda a asignarle nombre a productos nuevos siguiendo el formato: [SMP/VMP ]MARCA, DESCRIPCIÓN, PESO[ PACKX(cantidad)], TIPO DE EMPAQUE — y avisa si falta alguna sección o si el producto parece duplicado (mismo peso, descripción y marca).
- Ajustes: desde ahí se puede cambiar el tema claro/oscuro, el color de acento (tocando un color de la paleta), el idioma de la app, la base de datos por defecto, el nombre del perfil (con el ícono de lápiz junto al nombre), la vibración y el sonido al escanear, el aviso de formato al nombrar, y activar o no las respuestas de Veri IA.
- Roles: hay administrador y coadministrador. El administrador ve y gestiona todo (personas, roles, bases, la clave de IA de Veri). El coadministrador solo ve Repeticiones y Actualizar bases.
Cuando la pregunta de la persona pueda referirse a un producto específico, recibirás debajo un bloque "PRODUCTOS ENCONTRADOS" con resultados reales tomados de la base de datos (código y nombre, con la base 2025 o 2026 a la que pertenecen) que coinciden con la pregunta. Básate SOLO en esos datos reales para responder sobre productos concretos (existencia, nombre exacto, en qué base está, etc.); nunca inventes códigos ni nombres de productos. Si el bloque viene vacío o no aparece el producto que preguntan, dilo con honestidad (por ejemplo: "no encontré ese producto en las bases cargadas") en vez de suponer que existe.
Si te preguntan algo que no tiene que ver con la app, respóndelo igual con tu conocimiento general, manteniendo la brevedad. Si no sabes algo con certeza, dilo honestamente en vez de inventar. No inventes funciones que la app no tiene.`;

function buildProductContextForQuestion(question){
  const q = (question||'').trim();
  if(!q) return '';
  const lines = [];
  for(const year of ['2025','2026']){
    const idx = state.index[year];
    const total = state.bases[year] ? state.bases[year].length : 0;
    if(!idx || !total) continue;
    const {results} = searchProducts(q, year);
    results.slice(0,6).forEach(p=>{
      const nombre = (p.nombre||'(sin nombre)').slice(0,70);
      lines.push(`[Base ${year}] ${p.codigo} - ${nombre}`);
    });
  }
  const totals = ['2025','2026'].map(y=> `Base ${y}: ${(state.bases[y]?state.bases[y].length:0).toLocaleString()} productos cargados`).join(' · ');
  let block = `PRODUCTOS ENCONTRADOS para la pregunta "${q}":\n`;
  block += lines.length ? lines.slice(0,10).join('\n') : '(sin coincidencias en las bases cargadas)';
  block += `\n\nTotales: ${totals}`;
  return block;
}

let veriChatHistory = [];
async function askVeriAI(question, historyForContext){
  if(!state.prefs.aiEnabled) throw new Error(t('veriAIDisabled'));
  const key = (state.veriApiKey||'').trim();
  if(!key) throw new Error(t('veriAINoKey'));
  try{ await ensureBothBasesLoaded(); }catch(e){ /* seguimos sin contexto de productos si falla */ }
  const turns = (historyForContext||[]).filter(m=>m.text && m.text!==t('veriAIThinking')).slice(-12);
  const productContext = buildProductContextForQuestion(question);
  const systemMsgs = [{role:'system', content:VERI_AI_SYSTEM_CONTEXT}];
  if(productContext) systemMsgs.push({role:'system', content:productContext});
  const messages = [...systemMsgs];
  turns.forEach(m=> messages.push({role: m.role==='user'?'user':'assistant', content:m.text}));
  if(!messages.length || messages[messages.length-1].role!=='user' || messages[messages.length-1].content!==question){
    messages.push({role:'user', content:question});
  }
  let res;
  try{
    res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${key}`},
      body: JSON.stringify({ model:VERI_AI_MODEL, messages, max_tokens:600, temperature:0.4 })
    });
  }catch(e){ console.error('Veri IA (Groq): fallo de red', e); throw new Error(t('veriAIError')); }
  if(!res.ok){
    if(res.status===401 || res.status===403) throw new Error(t('veriAIBadKey'));
    if(res.status===429) throw new Error(t('veriAIQuota'));
    let errBody = '';
    try{ errBody = await res.text(); }catch(e){}
    console.error('Veri IA (Groq): respuesta no OK', res.status, errBody);
    // Si Groq descontinuó el modelo configurado, lo dice explícitamente en el mensaje.
    if(errBody && /decommission|deprecat/i.test(errBody)) throw new Error(t('veriAIModelGone'));
    throw new Error(t('veriAIError'));
  }
  let data;
  try{ data = await res.json(); }catch(e){ console.error('Veri IA (Groq): respuesta no es JSON válido', e); throw new Error(t('veriAIError')); }
  const text = data?.choices?.[0]?.message?.content?.trim();
  if(!text) throw new Error(t('veriAIError'));
  return text;
}
function closeVeriChat(){ const el=document.getElementById('veriChatOverlay'); if(el) el.remove(); veriChatHistory=[]; }
function renderVeriChatMessages(){
  const wrap = document.getElementById('veriChatMessages');
  if(!wrap) return;
  wrap.innerHTML = veriChatHistory.map(m=>`<div class="veri-chat-msg veri-chat-${m.role}">${m.role==='model'?`<div class="veri-chat-avatar">${ICONS.sparkle}</div>`:''}<div class="veri-chat-bubble">${escapeHtml(m.text).replace(/\n/g,'<br>')}</div></div>`).join('');
  wrap.scrollTop = wrap.scrollHeight;
}
function openVeriChat(initialQuestion){
  if(!isAdmin()) return;
  closeVeriChat();
  const overlay = document.createElement('div');
  overlay.id = 'veriChatOverlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-sheet glass veri-chat-sheet">
    <div class="modal-header"><h3 class="veri-chat-title">${ICONS.sparkle} Veri <span class="beta-tag">${t('veriAIBetaTag')}</span></h3><button type="button" class="modal-close" id="veriChatCloseBtn" aria-label="${t('namingEditDone')}">${ICONS.x}</button></div>
    <div id="veriChatMessages" class="veri-chat-messages"></div>
    <div class="veri-chat-inputrow">
      <input id="veriChatInput" type="text" placeholder="${t('veriAIChatPlaceholder')}" autocomplete="off">
      <button type="button" class="btn primary sm" id="veriChatSendBtn">${t('veriAISend')}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',(e)=>{ if(e.target===overlay) closeVeriChat(); });
  const closeBtn = document.getElementById('veriChatCloseBtn'); if(closeBtn) closeBtn.onclick = closeVeriChat;
  const input = document.getElementById('veriChatInput');
  const sendBtn = document.getElementById('veriChatSendBtn');
  const send = ()=>{
    const val = input.value.trim();
    if(!val) return;
    input.value='';
    veriChatHistory.push({role:'user', text: val});
    renderVeriChatMessages();
    veriChatHistory.push({role:'model', text: t('veriAIThinking')});
    renderVeriChatMessages();
    askVeriAI(val, veriChatHistory).then(answer=>{
      veriChatHistory[veriChatHistory.length-1] = {role:'model', text: answer};
      renderVeriChatMessages();
    }).catch(err=>{
      veriChatHistory[veriChatHistory.length-1] = {role:'model', text: err.message || t('veriAIError')};
      renderVeriChatMessages();
    });
  };
  if(sendBtn) sendBtn.onclick = send;
  if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  if(initialQuestion){ input.value = initialQuestion; send(); } else if(input) { input.focus(); }
}

/* Verifica que el nombre siga el formato esperado:
   [SMP|VMP ]MARCA(S), DESCRIPCIÓN, PESO[ PACKX(cantidad)], TIPO DE EMPAQUE
   y devuelve qué secciones faltan o no se ven completas, para avisar al nombrar. */
function checkNameFormat(rawNombre){
  const missing = [];
  const nombre = normalize(rawNombre);
  if(!nombre) return missing;
  const parts = nombre.split(',').map(p=>p.trim());

  // 1) Marca (con o sin prefijo SMP/VMP de paquete)
  const marcaSeg = parts[0] || '';
  if(!marcaSeg) missing.push(t('namingMissingBrand'));
  else if(!extractBrand(marcaSeg)) missing.push(t('namingMissingBrand'));

  // 2) Descripción del producto
  if(!parts[1]) missing.push(t('namingMissingDesc'));

  // 3) Peso neto (y PACKX(cantidad) si el nombre trae prefijo SMP/VMP de paquete)
  const pesoSeg = parts[2] || '';
  const esPaquete = /^(?:SMP|VMP)\b/.test(marcaSeg);
  if(!pesoSeg) missing.push(t('namingMissingWeight'));
  else if(!/\d+(?:[.,]\d+)?\s*(KG|KGS|KILO|KILOS|G|GR|GRAMO|GRAMOS|ML|MLS|L|LT|LTS|LITRO|LITROS|OZ|LB|LBS)\b/i.test(pesoSeg)){
    missing.push(t('namingMissingWeight'));
  } else if(esPaquete && !/PACKX\s*\d+/i.test(pesoSeg)){
    missing.push(t('namingMissingPackx'));
  }

  // 4) Tipo de empaque (bolsa, botella, jarra, lata, etc.)
  if(!parts[3]) missing.push(t('namingMissingPackaging'));

  return missing;
}
/* Revisa el nombre contra los "ACUERDOS 2026 CAPACITACIÓN" (sección 1. ASPECTOS NOMBRES),
   NO contra los de digitación (sección 2), que quedan fuera a propósito. Son avisos, no
   bloqueos: varias reglas del documento dependen de ver el empaque/foto (multipack real,
   marcas dobles, tipo de bolsa/frasco) y no se pueden confirmar solo con el texto del
   nombre, así que aquí solo se detectan patrones de texto que casi siempre valen la pena
   revisar, para que la persona lo confirme con el producto en mano. Cada regla referencia
   el punto del documento del que sale. */
function checkNamingAgreements(rawNombre){
  const issues = [];
  const nombre = normalize(rawNombre);
  if(!nombre) return issues;
  const parts = nombre.split(',').map(p=>p.trim());
  const marcaSeg = parts[0] || '', descSeg = parts[1] || '', pesoSeg = parts[2] || '';
  const push = (key)=> issues.push({key, text:t(key)});

  // 1.5.1 Peso en decimales: con punto, sin espacio antes de la unidad.
  if(/\d,\d\s*(KG|KGS|G|GR|ML|MLS|L|LT|LTS|OZ|LB|LBS)\b/i.test(pesoSeg)) push('agreeDecimalComma');
  if(/\d\s+(KG|KGS|KILO|KILOS|G|GR|GRAMO|GRAMOS|ML|MLS|L|LT|LTS|LITRO|LITROS|OZ|LB|LBS)\b/i.test(pesoSeg)) push('agreeSpaceBeforeUnit');

  // 1.5.2 cm3 equivale a ML y así se debe escribir.
  if(/\bCM3\b/i.test(nombre)) push('agreeCm3ShouldBeMl');

  // 1.2.1 Multipack: formato PACKX(cantidad) pegado, sin espacio ni variantes.
  if(/PACK\s*X\s*\d+/i.test(nombre) && !/PACKX\d+/.test(nombre)) push('agreePackxFormat');

  // 1.2.1 Pistas de multipack según el empaque descrito en el nombre.
  const tienePackx = /PACKX\d+/.test(nombre);
  if(/\b(SOBRES?|SACHETS?)\b/.test(descSeg) && !tienePackx) push('agreeSobresNoPackx');
  if(/\b(BOLSITAS?|PIRAMIDES?|ALMOHADILLAS?)\b/.test(descSeg) && tienePackx) push('agreeIndividualWithPackx');

  // 1.4.4 El % en el nombre solo aplica a bebidas y productos con cacao.
  if(/%/.test(nombre) && !/\b(BEBIDA|JUGO|NECTAR|GASEOSA|REFRESCO|TE|INFUSION|CACAO|CHOCOLATE|CHOCOLATINA)\b/.test(nombre)){
    push('agreePercentNotBebidaCacao');
  }

  // 1.4.3.1 Sabor natural/artificial: la palabra SABOR debe estar presente (salvo producto natural).
  if(/\bARTIFICIAL\b/.test(nombre) && !/\bSABOR\b[^,]{0,20}\bARTIFICIAL\b|\bARTIFICIAL\b[^,]{0,20}\bSABOR\b/.test(nombre)){
    push('agreeArtificialNeedsSabor');
  }
  if(/\bNATURAL\b/.test(nombre) && !/100%\s*NATURAL/.test(nombre) && !/\bSABOR\b[^,]{0,20}\bNATURAL\b|\bNATURAL\b[^,]{0,20}\bSABOR\b/.test(nombre)){
    push('agreeNaturalNeedsSabor');
  }

  // 1.4.3.1 Más de 3 sabores va como "SABORES VARIADOS" (no "VARIOS SABORES").
  if(/\bVARIOS\s+SABORES\b/.test(nombre)) push('agreeVariosSabores');

  // 1.5.3 Productos en tabletas: el peso se expresa en unidades "T", no en gramaje.
  if(/\bTABLETAS?\b/.test(descSeg) && pesoSeg && !/\d\s*T\b/.test(pesoSeg)) push('agreeTabletasSinT');

  // 1.7.4.1 Huevos: si aparece la talla (AA, AAA, AAAA, A) debe ir la palabra HUEVOS antes.
  if(/\b(AAAA|AAA|AA|A)\b/.test(descSeg) && !/\bHUEVOS?\b/.test(nombre)) push('agreeHuevoTallaSinPalabra');

  // 1.7.4.4 Quesos: distinguir tajado/bloque/rallado y fresco/madurado/semimadurado.
  if(/\bQUESO\b/.test(descSeg) && !/\b(TAJADO|BLOQUE|RALLADO)\b/.test(nombre) && !/\b(FRESCO|MADURADO|SEMIMADURADO)\b/.test(nombre)){
    push('agreeQuesoSinPresentacion');
  }

  // 1.7.4.3 Panes: distinguir tajado o bloque.
  if(/\bPAN\b/.test(descSeg) && !/\b(TAJADO|BLOQUE)\b/.test(nombre)) push('agreePanSinPresentacion');

  // 1.7.1.1 Leches líquidas/en polvo: van primero con la sigla LWM/PWM (si no tienen ingredientes adicionales).
  if(/^LECHE\b/.test(descSeg) && !/\b(LWM|PWM)\b/.test(nombre)) push('agreeLecheSinSigla');

  return issues;
}
/* Sugerencia de nombre (no es un duplicado exacto): busca en la base 2026 un producto
   de la MISMA marca y de la MISMA línea/descripción (ej. "REFRESCO DE FRUTA CONTIENE X%")
   aunque el sabor Y el peso sean distintos -- eso es justamente lo esperado, porque si
   ya existiera el mismo sabor y peso sería un duplicado, no una sugerencia. Se rankea
   por qué tan parecida es la descripción (ignorando el sabor y el peso puntual), y se
   suma puntaje extra si además coincide el peso, el sabor o el tipo de empaque. */
function findLineSuggestions2026(nombreNorm, excludeCodigo, limit=3){
  const idx=state.index['2026']; if(!idx) return [];
  const brand=extractBrand(nombreNorm); if(!brand) return [];
  const parts = normalize(nombreNorm).split(',').map(p=>p.trim());
  const descTokens = tokenSet(parts[1]||'');
  const packaging = (parts[3]||'').trim();
  const mass=extractQuantity(nombreNorm), flavor=flavorSignature(nombreNorm);
  const MIN_DESC_SIM = 0.4; // deben describir básicamente el mismo producto/línea
  const scored=[];
  for(const p of idx.list){
    if(p.codigo===excludeCodigo) continue;
    if(extractBrand(p.nombre)!==brand) continue;
    if(p.nombre===nombreNorm) continue;
    const pParts = normalize(p.nombre).split(',').map(s=>s.trim());
    const descSim = jaccardSim(descTokens, tokenSet(pParts[1]||''));
    if(descSim < MIN_DESC_SIM) continue; // misma marca no basta: la descripción debe ser básicamente la misma línea
    let score = descSim;
    const pm=extractQuantity(p.nombre), pf=flavorSignature(p.nombre);
    if(sameQuantity(mass,pm)) score += 0.3; // misma cantidad neta: referencia aún más cercana
    if(flavor && pf && pf===flavor) score += 0.5; // mismo sabor: muy raro que pase (casi sería duplicado)
    if(packaging && pParts[3] && packaging===pParts[3].trim()) score += 0.2; // mismo tipo de empaque
    scored.push({p, score});
  }
  // Más parecidos primero; a igual puntaje, se conserva el orden de la base.
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0, limit).map(x=>x.p);
}
function bindNamingDrag(){
  const list = document.getElementById('namingDragList');
  if(!list) return;
  let dragEl=null, startY=0, lastClientY=0, autoScrollRAF=null;
  const EDGE=90, MAX_SPEED=16; // px de zona sensible cerca del borde, velocidad máxima de auto-scroll

  const updateDragVisual = (clientY)=>{
    const dy = clientY - startY;
    dragEl.style.transform = `translateY(${dy}px)`;
    const items = Array.from(list.querySelectorAll('[data-dragid]'));
    const dragRect = dragEl.getBoundingClientRect();
    const dragMid = dragRect.top + dragRect.height/2;
    for(const sib of items){
      if(sib===dragEl) continue;
      const r = sib.getBoundingClientRect();
      if(dragMid > r.top && dragMid < r.bottom){
        const dragIdx = items.indexOf(dragEl);
        const sibIdx = items.indexOf(sib);
        if(sibIdx < dragIdx) list.insertBefore(dragEl, sib);
        else list.insertBefore(dragEl, sib.nextSibling);
        startY = clientY;
        dragEl.style.transform='';
        break;
      }
    }
  };

  // Mientras se arrastra cerca del borde superior o inferior de la pantalla, hace scroll
  // automático de la página (útil cuando hay muchos productos y hay que mover uno lejos),
  // y mantiene el nombre pegado al dedo/cursor aunque este no se mueva.
  const autoScrollStep = ()=>{
    if(!dragEl){ autoScrollRAF=null; return; }
    const vh = window.innerHeight;
    let speed = 0;
    if(lastClientY < EDGE) speed = -MAX_SPEED * (1 - Math.max(0,lastClientY)/EDGE);
    else if(lastClientY > vh - EDGE) speed = MAX_SPEED * (1 - Math.max(0, vh-lastClientY)/EDGE);
    if(speed !== 0){
      const before = window.scrollY;
      window.scrollBy(0, speed);
      const scrolled = window.scrollY - before;
      if(scrolled !== 0){
        startY += scrolled;
        updateDragVisual(lastClientY);
      }
    }
    autoScrollRAF = requestAnimationFrame(autoScrollStep);
  };

  list.querySelectorAll('[data-drag-handle]').forEach(handle=>{
    handle.style.touchAction = 'none';
    handle.addEventListener('pointerdown', (e)=>{
      const item = handle.closest('[data-dragid]');
      if(!item) return;
      e.preventDefault();
      dragEl = item;
      startY = e.clientY;
      lastClientY = e.clientY;
      dragEl.classList.add('dragging');
      dragEl.style.position='relative'; dragEl.style.zIndex='20';
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      const onMove = (ev)=>{
        lastClientY = ev.clientY;
        updateDragVisual(ev.clientY);
      };
      const onUp = ()=>{
        dragEl.style.transform=''; dragEl.style.position=''; dragEl.style.zIndex='';
        dragEl.classList.remove('dragging');
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if(autoScrollRAF){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF=null; }
        // El listado se muestra con los más recientes arriba (orden invertido respecto
        // al arreglo interno), así que para que el nuevo orden se conserve correctamente
        // al volver a renderizar, hay que guardar el arreglo en el orden inverso al visual.
        const ids = Array.from(list.querySelectorAll('[data-dragid]')).map(x=>x.dataset.dragid).reverse();
        state.naming.items.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
        saveNaming();
        render();
        dragEl=null;
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      autoScrollRAF = requestAnimationFrame(autoScrollStep);
    });
  });
}

    const relacionados2026 = findLineSuggestions2026(p25.nombre, code, 3);

    }
  }

}

/* Aplica una fuente y tamaño a todas las celdas con contenido de la hoja (requiere
   xlsx-js-style, que sí soporta escribir estilos; la librería SheetJS estándar no). */
function applyExcelFont(ws, fontName, fontSize){
  if(!ws['!ref']) return;
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let R=range.s.r; R<=range.e.r; R++){
    for(let C=range.s.c; C<=range.e.c; C++){
      const addr = XLSX.utils.encode_cell({r:R,c:C});
      const cell = ws[addr];
      if(!cell) continue;
      cell.s = Object.assign({}, cell.s, { font: Object.assign({}, cell.s && cell.s.font, { name:fontName, sz:fontSize }) });
    }
  }
}
function findDuplicateByCode2026(code){
  if(!code || !state.index['2026']) return null;

/* ===================== Normalization & matching ===================== */
function normalize(s){
  return (s===undefined||s===null?'':String(s)).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
}
function normalizeForSearch(s){
  return normalize(s).replace(/[^A-Z0-9]+/g,' ').trim();
}
/* La marca es lo que aparece antes de la primera coma del nombre; si ese primer
   segmento empieza con el prefijo SMP o VMP (paquete del mismo producto o variados),
   la marca es lo que sigue después de ese prefijo. */
function extractBrand(name){
  const firstSeg = normalize(name).split(',')[0].trim();
  const m = firstSeg.match(/^(?:SMP|VMP)\b\s*(.*)$/);
  const brand = m ? m[1].trim() : firstSeg;
  return normalizeForSearch(brand);
}
function buildIndex(year){
  const map = new Map();
  const list = state.bases[year] || [];
  for(const p of list){
    if(p.codigo) map.set(p.codigo, p);
    p.nombreSearch = normalizeForSearch(p.nombre||'');
    p.codigoSearch = normalizeForSearch(p.codigo||'');
    p.brandSearch = extractBrand(p.nombre||'');
  }
  state.index[year] = { map, list };
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(Math.abs(m-n)>3) return 99;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++){for(let j=1;j<=n;j++){dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));}}
  return dp[m][n];
}
function matchCode(rawCode, year){
  const idx = state.index[year];
  const code = normalize(rawCode);
  if(!code) return null;
  if(idx.map.has(code)) return { status:'exact', producto: idx.map.get(code) };
  // Entrada corta (ej. últimos 6 dígitos del código): buscamos coincidencias por el final del código
  if(code.length>=4 && code.length<=8){
    const matches = idx.list.filter(p=> p.codigo && p.codigo.endsWith(code));
    if(matches.length===1) return { status:'exact', producto: matches[0], bySuffix:true };
    if(matches.length>1) return { status:'multiple', candidatos: matches.slice(0,25), suffix: code };
  }
  let best=null, bestDist=99;
  for(const p of idx.list){
    if(Math.abs((p.codigo||'').length - code.length) > 2) continue;
    const d = levenshtein(p.codigo, code);
    if(d < bestDist){ bestDist=d; best=p; if(d<=1) break; }
  }
  if(best && bestDist<=2) return { status:'similar', producto:best, dist:bestDist };
  return { status:'notfound' };
}
function searchProducts(query, year){
  const idx = state.index[year];
  const qRaw = normalize(query);
  const qTokens = normalizeForSearch(query).split(' ').filter(Boolean);
  if(!qRaw && !qTokens.length) return { results:[], fuzzy:false };
  let out = [];
  for(const p of idx.list){
    const codeMatch = p.codigo && p.codigo.includes(qRaw);
    const nameMatch = qTokens.length>0 && qTokens.every(tok=> p.nombreSearch.includes(tok));
    if(codeMatch || nameMatch){ out.push(p); if(out.length>=60) break; }
  }
  let fuzzy = false;
  if(out.length===0 && qTokens.length){
    for(const p of idx.list){
      if(qTokens.some(tok=> tok.length>=3 && p.nombreSearch.includes(tok))){ out.push(p); if(out.length>=20) break; }
    }
    fuzzy = out.length>0;
  }
  return { results:out, fuzzy };
}

/* ===================== Data loading (Supabase) ===================== */
async function fetchProductos(base){
  const pageSize = 1000;
  const first = await sbRaw(`productos?base=eq.${base}&select=*&order=codigo.asc`, {
    headers: { 'Range-Unit':'items', 'Range': `0-${pageSize-1}`, 'Prefer':'count=exact' }
  });
  let all = first.data || [];
  let total = null;
  if(first.contentRange){
    const parts = first.contentRange.split('/');
    if(parts[1] && parts[1]!=='*') total = parseInt(parts[1],10);
  }
  if(total !== null && total > all.length){
    const pageRequests = [];
    for(let from = pageSize; from < total; from += pageSize){
      pageRequests.push(sb(`productos?base=eq.${base}&select=*&order=codigo.asc`, {
        headers: { 'Range-Unit':'items', 'Range': `${from}-${from+pageSize-1}` }
      }));
    }
    const results = await Promise.all(pageRequests);
    results.forEach(r=>{ if(r) all = all.concat(r); });
  } else if(total === null && all.length === pageSize){
    // Respaldo si el servidor no informa el total: seguimos pidiendo secuencialmente
    let from = pageSize;
    while(true){
      const res = await sb(`productos?base=eq.${base}&select=*&order=codigo.asc`, {
        headers: { 'Range-Unit':'items', 'Range': `${from}-${from+pageSize-1}` }
      });
      all = all.concat(res||[]);
      if(!res || res.length < pageSize) break;
      from += pageSize;
    }
  }
  return all;
}

/* ===================== Gráficos y series diarias/semanales para estadísticas =====================
   Trabajan sobre cualquier arreglo de objetos con un campo `fecha` (ISO string o epoch ms), como
   escaneos, feedback o app_errors, sin necesidad de una tabla o consulta extra por gráfico. */
function computeDailySeries(items, days){
  const map = new Map();
  const now = new Date();
  for(let i=days-1;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i);
    map.set(d.toISOString().slice(0,10), 0);
  }
  (items||[]).forEach(it=>{
    const d = new Date(it.fecha);
    if(isNaN(d)) return;
    const key = d.toISOString().slice(0,10);
    if(map.has(key)) map.set(key, map.get(key)+1);
  });
  return [...map.entries()].map(([key,value])=>({label:key.slice(5).replace('-','/'), value}));
}
function computeWeeklySeries(items, weeks){
  const map = new Map();
  const now = new Date();
  function weekKey(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); return dt.toISOString().slice(0,10); }
  for(let i=weeks-1;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i*7);
    map.set(weekKey(d), 0);
  }
  (items||[]).forEach(it=>{
    const d = new Date(it.fecha);
    if(isNaN(d)) return;
    const key = weekKey(d);
    if(map.has(key)) map.set(key, map.get(key)+1);
  });
  return [...map.entries()].map(([key,value])=>({label:key.slice(5).replace('-','/'), value}));
}
function svgBarChart(series, opts={}){
  const w = 320, h = opts.height||110, padTop=10, padBottom=20;
  const max = Math.max(1, ...series.map(s=>s.value));
  const bw = w / series.length;
  const color = opts.color || 'var(--accent)';
  const everyN = Math.max(1, Math.ceil(series.length/7));
  const bars = series.map((s,i)=>{
    const bh = Math.round((s.value/max) * (h-padTop-padBottom));
    const x = i*bw, y = h-padBottom-bh;
    return `<rect x="${(x+1).toFixed(1)}" y="${y}" width="${Math.max(2,bw-2).toFixed(1)}" height="${bh}" rx="3" fill="${color}"><title>${s.label}: ${s.value}</title></rect>`;
  }).join('');
  const labels = series.map((s,i)=> i%everyN===0 ? `<text x="${(i*bw+bw/2).toFixed(1)}" y="${h-6}" font-size="9" text-anchor="middle" fill="var(--text-2)">${s.label}</text>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible;">${bars}${labels}</svg>`;
}

function remoteRowToNamingItem(x){
  return {id:'remote_'+x.id,codigo:x.codigo,nombre:x.nombre,duplicado:!!x.duplicado,duplicadoCodigo:x.duplicado_codigo||null,duplicadoTipo:x.duplicado_tipo||null,sessionDup:!!x.duplicado_sesion,sessionDupCode:x.duplicado_sesion_con||null,createdAt:Number(x.creado_en)||Date.now(),syncStatus:'synced'};
}
async function syncNamingRemoteRows(remoteRows){
  if(!Array.isArray(remoteRows)||!state.naming) return false;
  const localItems=Array.isArray(state.naming.items)?state.naming.items:[]; const used=new Set();
  remoteRows.forEach(row=>{
    const rc=Number(row.creado_en)||0;
    let idx=localItems.findIndex((it,i)=>!used.has(i)&&it.id===('remote_'+row.id));
    if(idx<0&&rc) idx=localItems.findIndex((it,i)=>!used.has(i)&&Number(it.createdAt)===rc&&it.codigo===row.codigo);
    if(idx<0) idx=localItems.findIndex((it,i)=>!used.has(i)&&!it.createdAt&&it.codigo===row.codigo&&it.nombre===row.nombre);
    if(idx>=0){ Object.assign(localItems[idx],remoteRowToNamingItem(row)); used.add(idx); }
    else localItems.push(remoteRowToNamingItem(row));
  });
  state.naming.items=localItems; saveNaming();
  let allOk=true;
  for(const item of state.naming.items){
    if(item.id&&String(item.id).startsWith('remote_')) continue;
    try{ const row=await persistNamingRemote(item); item.id='remote_'+row.id; item.syncStatus='synced'; }
    catch(e){ item.syncStatus='pending'; allOk=false; console.error('No se pudo sincronizar nombrado:',e); }
  }
  saveNaming(); return allOk;
}
async function loadArchivedNaming(force){
  if(state.archived.loading) return; if(state.archived.loaded&&!force) return;
  state.archived.loading=true; render();

    const rows=await fetchArchivedNaming();

    const byDate={}; rows.forEach(r=>{(byDate[r.fecha]=byDate[r.fecha]||[]).push(r);});

  }catch(e){ console.error(e); }

}

  if(!state.session) throw new Error('No hay sesión activa para guardar el nombrado.');

}

/* ===================== Product import ===================== */
function detectCols(headers){
  const norm = headers.map(h=>normalize(h));
  let codeIdx = norm.findIndex(h=>h.includes('COD'));
  let nameIdx = norm.findIndex(h=>h.includes('NOMBRE')||h.includes('PRODUCTO')||h.includes('DESC')||h.includes('NAME'));
  if(codeIdx===-1) codeIdx=0;
  if(nameIdx===-1) nameIdx = (codeIdx===0?1:0);
  return {codeIdx, nameIdx};
}
async function uploadInChunks(path, items, chunkSize, concurrency){
  const chunks = [];
  for(let i=0;i<items.length;i+=chunkSize){ chunks.push(items.slice(i,i+chunkSize)); }
  let idx = 0;
  async function worker(){
    while(idx < chunks.length){
      const my = idx++;
      await sb(path, {method:'POST', body:JSON.stringify(chunks[my]), headers:{'Prefer':'return=minimal'}});
    }
  }
  const workers = Array.from({length:Math.min(concurrency, chunks.length)}, worker);
  await Promise.all(workers);
}
async function replaceProductosRemote(base, list){
  await sb(`productos?base=eq.${base}`, {method:'DELETE'});
  const rows = list.map(p=>({base,codigo:p.codigo,nombre:p.nombre,categoria:p.categoria||null}));
  await uploadInChunks('productos', rows, 500, 4);

  reader.readAsArrayBuffer(file);

/* ===================== Repeticiones import (color amarillo) ===================== */
function cellIsYellow(cell){
  if(!cell || !cell.s) return false;
  const fill = cell.s.fgColor || cell.s.bgColor;
  if(!fill || !fill.rgb) return false;
  const hex = fill.rgb.slice(-6);
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  return r>190 && g>170 && b<140 && (r-b)>60;
}
function cellIsBlue(cell){
  if(!cell || !cell.s) return false;
  const fill = cell.s.fgColor || cell.s.bgColor;
  if(!fill || !fill.rgb) return false;
  const hex = fill.rgb.slice(-6);
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  return b>160 && (b-r)>35 && b>=g-15;
}
function cellFillRGB(cell){
  if(!cell || !cell.s) return null;
  const fill = cell.s.fgColor || cell.s.bgColor;
  if(!fill || !fill.rgb) return null;
  const hex = fill.rgb.slice(-6);
  if(!/^[0-9A-F]{6}$/i.test(hex)) return null;
  return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}
function cellIsGreen(cell){
  const c = cellFillRGB(cell); if(!c) return false;
  const [r,g,b]=c; return g>125 && g>r*1.18 && g>b*1.08;
}
const REP_CATEGORIES = [
  'Bebidas','Productos de panadería y repostería','Productos cereales','Dulces y postres',
  'Platos mixtos y comidas rápidas','Carnes, pollo, huevos y sustituto de carnes',
  'Pescado y productos del mar','Productos lácteos','Frutas','Verduras y vegetales',
  'Legumbres y semillas','Salsas untables y aderezos','Snacks','Sal, sazonadores e ingredientes',
  'Grasas y aceites','Endulzantes y edulcorantes'
];
function inferCategory(name){
  const n=normalize(name);
  const rules=[
    [/CAFE|TE|JUGO|BEBIDA|AGUA|REFRESCO|GASEOSA|BATIDO|ENERGIZ/,0],
    [/PAN|AREPA|PASTEL|TORTA|GALLET|BIZCO|CROISS|BOLLO|DONUT|REPOST/,1],
    [/ARROZ|AVENA|CEREAL|HARINA|MAIZ|TRIGO|PASTA|QUINOA/,2],
    [/CHOCOLATE|DULCE|CARAMELO|HELADO|POSTRE|FLAN|GOMITA|CONFITE/,3],
    [/PIZZA|HAMBURG|SANDWICH|HOT.?DOG|LASAG|TACO|BURRITO|MIXTO|COMIDA RAPIDA/,4],
    [/CARNE|RES|CERDO|POLLO|HUEVO|JAMON|TOCINO|EMBUT|SALCHIC|VEGETAL.*CARNE/,5],
    [/PESCADO|SALMON|ATUN|CAMARON|MARISCO|CANGREJO|CALAMAR|BACALAO/,6],
    [/LECHE|QUESO|YOGUR|YOGURT|MANTEQUILLA|CREMA/,7],
    [/MANZANA|BANANO|PLATANO|NARANJA|MANGO|PAPAYA|PIÑA|UVA|FRESA|FRUTA/,8],
    [/TOMATE|CEBOLLA|ZANAHORIA|LECHUGA|PAPA|YUCA|APIO|PEPINO|VEGETAL|VERDURA/,9],
    [/LENTEJA|FRIJOL|GARBANZO|ARVEJA|SEMILLA|NUEZ|ALMENDRA|MANI/,10],
    [/SALSA|MAYONESA|MOSTAZA|KETCHUP|ADEREZO|UNTABLE|DIP/,11],
    [/SNACK|PAPITAS|CHIPS|PALOMITA|PASABOCA|BOTANA/,12],
    [/SAL|CONDIMENTO|SAZON|ESPECIA|PIMIENTA|CALDO|CUBITO|INGREDIENT/,13],
    [/ACEITE|MARGARINA|GRASA/,14],
    [/AZUCAR|MIEL|ENDULZ|EDULCOR|STEVIA|SUCRALOSA/,15]
  ];
  for(const [rx,i] of rules) if(rx.test(n)) return REP_CATEGORIES[i];
  return '';
}
function categoryFromRow(r, categoryIdx, nombre){
  const raw = categoryIdx>=0 ? String(r[categoryIdx]||'').trim() : '';
  if(raw){
    const hit = REP_CATEGORIES.find(c=>normalize(c)===normalize(raw));
    return hit || raw;
  }
  return inferCategory(nombre);
}

function importExcelRepeticiones(file, filterCode){
  if(!confirm(t('confirmImportRep'))) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellStyles:true});
      let sheetName = wb.SheetNames.find(n=>normalize(n).includes('REPETIC')) || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const range = XLSX.utils.decode_range(sheet['!ref']);
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      if(!rows.length) throw new Error('empty');
      const headers = rows[0].map(h=>normalize(h));
      const find = (...keys)=> headers.findIndex(h=>keys.some(k=>h.includes(k)));
      const iCod = find('COD PRODUCTO','CODIGO PRODUCTO','CODIGO');
      const iNom = find('NOMBRE');
      const iFoto = find('FOTOGRAF');
      const iBar = find('BARRA');
      const iMot = find('MOTIVO','DETALLE','DESCRIPCION','REPETIC');
      const iCat = find('CATEGORIA','CATEGOR','CATEGORY','GRUPO','SECCION');
      const filterNorm = filterCode ? normalize(filterCode) : '';
      const toInsert = [];
      let skippedYellow = 0, skippedBlue = 0, skippedGreen = 0;
      for(let R=1; R<=range.e.r; R++){
        const r = rows[R];
        if(!r) continue;
        let rowIsYellow = false, rowIsBlue = false;
        for(let C=range.s.c; C<=range.e.c; C++){
          const addr = XLSX.utils.encode_cell({r:R,c:C});
          const cell = sheet[addr];
          if(cellIsYellow(cell)) rowIsYellow = true;
          else if(cellIsBlue(cell)) rowIsBlue = true;
        }
        const codigoProducto = iCod>=0 ? normalize(r[iCod]) : '';
        const nombreProducto = iNom>=0 ? normalize(r[iNom]) : '';
        const fotografo = iFoto>=0 ? normalize(r[iFoto]) : '';
        if(!codigoProducto && !nombreProducto) continue;
        if(filterNorm && fotografo !== filterNorm) continue;
        let rowIsGreen = false;
        for(let C=range.s.c; C<=range.e.c; C++){
          const cell = sheet[XLSX.utils.encode_cell({r:R,c:C})];
          if(cellIsGreen(cell)) rowIsGreen = true;
        }
        if(rowIsYellow){ skippedYellow++; continue; }
        if(rowIsBlue){ skippedBlue++; continue; }
        if(rowIsGreen){ skippedGreen++; continue; }
        toInsert.push({
          codigo_producto: codigoProducto, nombre_producto: nombreProducto,
          categoria: categoryFromRow(r, iCat, nombreProducto),
          fotografo,
          codigo_barras: iBar>=0 ? normalize(r[iBar]) : '',
          motivo: iMot>=0 ? String(r[iMot]||'').trim() : '',
          estado:'pending', archivado:false, fecha: Date.now()
        });
      }
      toast(t('loginLoading'));
      await insertRepeticionesRemote(toInsert);
      await refreshRepeticiones();
      const pendCount = toInsert.filter(x=>x.estado==='pending').length;
      const takenCount = toInsert.filter(x=>x.estado==='done').length;
      toast(`${t('imported')}: ${pendCount} ${t('statusPending')} · ${skippedYellow+skippedBlue+skippedGreen} omitidos`);
      renderRoot();
    }catch(err){ console.error(err); toast(t('errorImport')); }
  };
  reader.readAsArrayBuffer(file);
}

/* ===================== Toast ===================== */
let toastQueue = [], toastBusy=false;
function toast(msg){ toastQueue.push(msg); if(!toastBusy) drainToast(); }
function drainToast(){
  if(!toastQueue.length){ toastBusy=false; return; }
  toastBusy = true;
  const msg = toastQueue.shift();
  let el = document.getElementById('toastEl');
  if(!el){ el = document.createElement('div'); el.id='toastEl'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display='block';
  setTimeout(()=>{ el.style.display='none'; setTimeout(drainToast, 150); }, 2200);
}

/* ===================== Theme ===================== */
function applyTheme(){
  document.body.setAttribute('data-theme', state.prefs.theme);
  document.documentElement.style.setProperty('--accent', state.prefs.accent);
  document.documentElement.style.setProperty('--accent-rgb', hexToRgb(state.prefs.accent));

  // Generate a harmonious five-color family from the selected accent.
  const hsl = hexToHsl(state.prefs.accent);
  const offsets = [-28, -10, 10, 28, 48];
  offsets.forEach((offset, i)=>{
    const hue = (hsl.h + offset + 360) % 360;
    const sat = Math.max(55, Math.min(78, hsl.s));
    const light = Math.max(54, Math.min(68, hsl.l + 4));
    const color = hslToHex(hue, sat, light);
    document.documentElement.style.setProperty(`--card-${i+1}`, color);
    document.documentElement.style.setProperty(`--card-${i+1}-rgb`, hexToRgb(color));
  });

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', state.prefs.accent);
}
function hexToRgb(hex){
  const h = hex.replace('#','');
  const bigint = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `${(bigint>>16)&255},${(bigint>>8)&255},${bigint&255}`;
}
function hexToHsl(hex){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  let r=((n>>16)&255)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let hue=0, sat=0, light=(max+min)/2;
  if(d){
    sat=d/(1-Math.abs(2*light-1));
    switch(max){
      case r: hue=60*((g-b)/d%6); break;
      case g: hue=60*((b-r)/d+2); break;
      default: hue=60*((r-g)/d+4);
    }
    if(hue<0) hue+=360;
  }
  return {h:hue, s:sat*100, l:light*100};
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}

function wireLoginBuddy(pinInputId, pinConfirmId){
  const buddy = document.getElementById('loginBuddy');
  if(!buddy) return;
  [pinInputId, pinConfirmId].filter(Boolean).forEach(id=>{
    const input = document.getElementById(id);
    if(!input) return;
    input.addEventListener('focus', ()=> buddy.classList.add('peeking'));
    input.addEventListener('input', ()=> buddy.classList.toggle('peeking', document.activeElement===input));
    input.addEventListener('blur', ()=> buddy.classList.remove('peeking'));
  });
  return buddy;
}
function buddyReactWrong(buddy){
  if(!buddy) return;
  buddy.classList.remove('peeking','happy');
  buddy.classList.add('wrong');
  setTimeout(()=> buddy.classList.remove('wrong'), 550);
}
function buddyReactHappy(buddy){
  if(!buddy) return;
  buddy.classList.remove('peeking','wrong');
  buddy.classList.add('happy');
}

function parseAvatarConfig(person){

  try{ return JSON.parse(person.avatar_config); }catch(e){ return null; }
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast(t('copied'))).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); toast(t('copied')); }catch(e){}
  document.body.removeChild(ta);
}
document.addEventListener('click', (e)=>{
  const copyBtn = e.target.closest('[data-copy]');
  if(copyBtn){ copyText(decodeURIComponent(copyBtn.dataset.copy)); return; }
  const useBtn = e.target.closest('[data-usename]');
  if(useBtn){ const nm = document.getElementById('namingNombre'); if(nm){ nm.value = decodeURIComponent(useBtn.dataset.usename); nm.dispatchEvent(new Event('input', {bubbles:true})); } return; }
  const pickBtn = e.target.closest('[data-pick-suffix]');
  if(pickBtn){
    const codigo = decodeURIComponent(pickBtn.dataset.pickSuffix);
    const idx = state.index[state.scanBase];
    const producto = idx && idx.map.get(codigo);
    if(producto){
      state.scanResult = { status:'exact', producto, bySuffix:true };
      updateScanResultDOM();
      const input = document.getElementById('scanInput'); if(input) input.value = codigo;
      vibrateFor('exact'); beepFor('exact');
      // También está en la base 2026 (por eso apareció en la lista de coincidencias):
      // el sheet unificado ya ofrece el botón "Agregar a lista" si corresponde.
    }
    return;
  }
});

async function completeLogin(codigo){
  state.session = codigo; localStorage.setItem('vp_session', codigo);
  const savedForUser = localStorage.getItem('vp_prefs_'+normalize(codigo));
  if(savedForUser){ try{ state.prefs = {...state.prefs, ...JSON.parse(savedForUser)}; }catch(e){} }
  state.loginError=''; state.loginStep='code'; state.loginCandidate=null; state.termsChecked=false; state.termsAccepted=false;
  state.booted=false; renderRoot();
  await loadCoreData();
  await loadRemotePrefs(codigo);
  state.termsAccepted=await checkTermsAccepted(codigo); state.termsChecked=true;
  state.booted=true; renderRoot();
}
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function logout(){
  localStorage.removeItem('vp_session');
  sessionStorage.removeItem('vp_admin_unlocked');
  state.session = null; state.tab='home';
  state.loginStep='code'; state.loginCandidate=null; state.loginError=''; state.termsAccepted=false; state.termsChecked=false;
  renderRoot();
}

/* ===================== Roles: administrador / coadministrador =====================
   El acceso al panel de Administrador ya no depende de una contraseña compartida que
   cualquiera pueda usar: depende de qué rol tiene asignado el código de persona con el
   que se inició sesión (columna "rol" en la tabla personas: 'admin' | 'coadmin' | vacío).
   La contraseña de administrador solo sirve para crear al primer administrador cuando
   todavía no existe ninguno (arranque inicial). Después de eso, el propio administrador
   asigna o quita el rol de coadministrador (o administrador) a cada persona desde el panel. */
function myPersona(){ return state.personas.find(p=>p.codigo===normalize(state.session||'')) || null; }
function myRole(){ const p = myPersona(); return p && p.rol ? p.rol : null; }
function isAdmin(){ return myRole()==='admin'; }
function isCoAdmin(){ return myRole()==='coadmin'; }
function hasAdminAccess(){ return isAdmin() || isCoAdmin(); }

let beepCtx = null;

function ensureAudio(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    if(!beepCtx) beepCtx = new Ctx();
    if(beepCtx.state === 'suspended') beepCtx.resume().catch(()=>{});
    return beepCtx;
  }catch(e){ return null; }
}

function synthTone({startFreq, endFreq=startFreq, duration=0.12, volume=0.16, type='sine', delay=0}){
  const ctx = ensureAudio();
  if(!ctx) return;
  const play = ()=>{
    try{
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, t);
      if(endFreq !== startFreq){
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + duration);
      }
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(volume, t + 0.008);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume * 0.72), t + duration * 0.58);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.025);
    }catch(e){}
  };
  if(ctx.state === 'suspended') ctx.resume().then(play).catch(()=>{});
  else play();
}

// Shared helper for UI sounds. Scanner sound can be switched in Settings.
function beepTone(freq, duration){
  synthTone({startFreq:freq, duration, volume:0.11, type:'sine'});
}

function scannerClick(delay=0){
  // Crisp high-frequency tick used by the modern/neon scanner styles.
  synthTone({startFreq:2200, endFreq:1500, duration:0.035, volume:0.055, type:'triangle', delay});
}

function unlockAudio(){ ensureAudio(); }
document.addEventListener('pointerdown', unlockAudio, {once:true, passive:true});

function playClassicScan(status){
  // Original Veri sound: simple, unmistakable scanner feedback.
  if(status === 'exact') beepTone(1600, 0.11);
  else if(status === 'similar'){
    beepTone(1000, 0.09);
    setTimeout(()=>beepTone(1000, 0.09),130);
  } else {
    beepTone(400, 0.16);
  }
}

function playModernScan(status){
  // Clean "tic → confirmation" with a subtle upward sweep.
  if(status === 'exact'){
    scannerClick(0);
    synthTone({startFreq:1050, endFreq:1550, duration:0.095, volume:0.13, type:'sine', delay:0.025});
    synthTone({startFreq:1500, endFreq:2050, duration:0.11, volume:0.115, type:'triangle', delay:0.115});
  } else if(status === 'similar'){
    scannerClick(0);
    synthTone({startFreq:720, endFreq:900, duration:0.07, volume:0.10, type:'sine', delay:0.025});
    synthTone({startFreq:880, endFreq:1080, duration:0.075, volume:0.095, type:'sine', delay:0.125});
  } else {
    synthTone({startFreq:360, endFreq:220, duration:0.16, volume:0.13, type:'sine', delay:0});
    synthTone({startFreq:210, endFreq:150, duration:0.11, volume:0.055, type:'triangle', delay:0.055});
  }
}

function playNeonScan(status){
  // A slightly more futuristic, arcade-like style with a bright digital attack.
  if(status === 'exact'){
    synthTone({startFreq:1750, endFreq:2350, duration:0.055, volume:0.075, type:'square', delay:0});
    synthTone({startFreq:900, endFreq:1850, duration:0.13, volume:0.115, type:'sine', delay:0.035});
    synthTone({startFreq:1900, endFreq:2700, duration:0.09, volume:0.07, type:'triangle', delay:0.12});
  } else if(status === 'similar'){
    synthTone({startFreq:760, endFreq:1120, duration:0.065, volume:0.085, type:'triangle', delay:0});
    synthTone({startFreq:1120, endFreq:1450, duration:0.065, volume:0.085, type:'triangle', delay:0.105});
  } else {
    synthTone({startFreq:520, endFreq:300, duration:0.105, volume:0.10, type:'sawtooth', delay:0});
    synthTone({startFreq:300, endFreq:190, duration:0.13, volume:0.07, type:'sine', delay:0.085});
  }
}

function playScanSound(status, style=state.prefs.soundStyle || 'modern'){
  if(style === 'classic') playClassicScan(status);
  else if(style === 'neon') playNeonScan(status);
  else playModernScan(status);
}

function beepFor(status){
  if(!state.prefs.sound) return;
  playScanSound(status);
}

function openNamingEditModal(itemId){
  const it = findNamingItemById(itemId);

  closeNamingEditModal();

  overlay.id = 'namingEditOverlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-sheet glass">

  </div>`;

  const closeBtn = document.getElementById('namingEditCloseBtn'); if(closeBtn) closeBtn.onclick = closeNamingEditModal;
  const saveBtn = document.getElementById('namingEditSaveBtn');
  if(saveBtn) saveBtn.onclick = ()=>{
    // Mismas reglas que al nombrar un producto: sin tildes, sin ñ, todo en mayúscula.
    const nc = normalize(document.getElementById('namingEditCodigo').value);
    const nn = normalize(document.getElementById('namingEditNombre').value);
    if(!nc || !nn) return;
    // Aviso de "repetidos del día": solo debe saltar si es el mismo código o el nombre
    // es EXACTAMENTE igual (no "parecido").
    const sessionDup = state.naming.items.find(o=> o.id!==it.id && (o.codigo===nc || o.nombre===nn));
    if(sessionDup){
      const msgKey = sessionDup.codigo===nc ? 'namingSessionDupCode' : 'namingSessionDupName';
      const msg = t(msgKey).replace('{nombre}', sessionDup.nombre).replace('{codigo}', sessionDup.codigo);
      if(!confirm(msg)) return;
      it.sessionDup = true; it.sessionDupWith = sessionDup.nombre; it.sessionDupCode = sessionDup.codigo;
    } else {
      it.sessionDup = false; it.sessionDupWith = null; it.sessionDupCode = null;
    }
    const dup = findNameDuplicate2026(nn, nc);
    it.codigo=nc; it.nombre=nn; it.duplicado=!!dup; it.duplicadoCodigo=dup?dup.codigo:null; it.duplicadoTipo=dup?.__dupReason||null;
    it.veriChecked=false; it.veriReason=null; it.veriChecking=false;
    saveNaming();
    persistNamingEditRemote(it);
    closeNamingEditModal();
    render();
    verifyNamingItemWithVeri(it).then(changed=>{
      if(changed){ saveNaming(); persistNamingEditRemote(it); render(); }
    });
  };
}

/* ===================== Camera / BarcodeDetector (con respaldo ZXing) — reutilizable ===================== */
let zxingReader = null, zxingLoadPromise = null;
let lastScanCode = null, lastScanTime = 0;
let candidateCode = null, candidateCount = 0;
let activeWrapId = null, activeBtnId = null, activeOnDetect = null;
const CONFIRM_COUNT = 2;
function handleDetection(value){
  if(!value) return;
  if(value===candidateCode){ candidateCount++; } else { candidateCode=value; candidateCount=1; }
  if(candidateCount>=CONFIRM_COUNT){
    candidateCode=null; candidateCount=0;
    if(activeOnDetect) activeOnDetect(value);
  }
}
function loadZXing(){
  if(window.ZXing) return Promise.resolve();
  if(zxingLoadPromise) return zxingLoadPromise;
  zxingLoadPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('zxing load failed'));
    document.head.appendChild(s);
  });
  return zxingLoadPromise;
}
async function listCameras(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(d=>d.kind==='videoinput');
  }catch(e){ return []; }
}
function cameraLabel(d, i){
  const raw=(d.label||'').trim();
  if(raw) return raw;
  return `${t('cameraLabel')} ${i+1}`;
}
function renderCameraSelect(wrapId){
  const cams = state.availableCameras;
  if(!cams || cams.length<2) return '';
  const opts = [`<option value="">${t('cameraAuto')}</option>`]
    .concat(cams.map((d,i)=>`<option value="${escapeHtml(d.deviceId)}" ${state.preferredCameraId===d.deviceId?'selected':''}>${escapeHtml(cameraLabel(d,i))}</option>`));
  return `<select id="cameraSelect_${wrapId}" class="camera-select">${opts.join('')}</select>`;
}
async function startCamera(wrapId, btnId, onDetect){
  activeWrapId = wrapId; activeBtnId = btnId; activeOnDetect = onDetect;
  const wrap = document.getElementById(wrapId);
  if(location.protocol==='file:'){ wrap.innerHTML = `<p class="small-note">${t('cameraFileError')}</p>`; return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ wrap.innerHTML = `<p class="small-note">${t('cameraUnsupported')}</p>`; return; }
  wrap.innerHTML = `<div class="scan-frame"><video id="scanVideo_${wrapId}" autoplay playsinline muted></video><div class="overlay"></div><div class="scan-laser"></div></div>`;
  const video = document.getElementById('scanVideo_'+wrapId);
  lastScanCode = null; lastScanTime = 0; candidateCode = null; candidateCount = 0;
  let stream;
  const baseConstraints = {
    width:{ideal:640, max:1280},
    height:{ideal:480, max:720},
    frameRate:{ideal:24, max:30}
  };
  try{
    if(state.preferredCameraId){
      // El usuario eligió una cámara/lente específica (por ejemplo, el teleobjetivo del iPhone).
      try{
        stream = await navigator.mediaDevices.getUserMedia({
          audio:false,
          video:{ ...baseConstraints, deviceId:{exact:state.preferredCameraId} }
        });
      }catch(e){
        // La cámara guardada ya no existe o cambió: volvemos al modo automático.
        state.preferredCameraId = '';
        localStorage.removeItem('vp_camera_device');
      }
    }
    if(!stream){
      // No fijamos un deviceId concreto: así iOS/Safari puede seguir cambiando de lente
      // automáticamente (macro/ultra gran angular) al acercar la cámara para enfocar de cerca.
      stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{ ...baseConstraints, facingMode:{ideal:'environment'} }
      });
    }
  }catch(e){
    wrap.innerHTML = `<p class="small-note">${t('cameraPermError')}</p>`;
    return;
  }
  state.cameraStream = stream;
  video.srcObject = stream;
  const btn = document.getElementById(btnId);
  if(btn) btn.innerHTML = `${ICONS.camera} ${t('stopCamera')}`;

  // Una vez concedido el permiso, los labels de los dispositivos ya son visibles:
  // armamos el selector de cámara/lente (ej. gran angular, teleobjetivo, ultra gran angular).
  state.availableCameras = await listCameras();
  const frame = wrap.querySelector('.scan-frame');
  if(frame && state.availableCameras.length>1){
    frame.insertAdjacentHTML('beforeend', `<div class="camera-select-wrap">${renderCameraSelect(wrapId)}</div>`);
    const sel = document.getElementById('cameraSelect_'+wrapId);
    if(sel) sel.onchange = async ()=>{
      const chosen = sel.value;
      state.preferredCameraId = chosen;
      if(chosen) localStorage.setItem('vp_camera_device', chosen); else localStorage.removeItem('vp_camera_device');
      stopCamera();
      try{ await startCamera(wrapId, btnId, onDetect); }catch(e){ toast(t('cameraSwitchError')); }
    };
  }

  setupPinchZoom(frame, video, stream.getVideoTracks()[0]);

  if('BarcodeDetector' in window){
    const detector = new BarcodeDetector();
    let detecting = false;
    let stopped = false;
    const loop = async ()=>{
      if(!state.cameraStream || stopped) return;
      if(!detecting){
        detecting = true;
        try{
          const codes = await detector.detect(video);
          if(codes && codes.length){
            handleDetection(codes[0].rawValue);
          }
        }catch(e){}
        detecting = false;
      }
      state.cameraLoopId = setTimeout(loop, 140);
    };
    state.cameraLoopId = setTimeout(loop, 120);
  } else {
    try{
      await loadZXing();
      const codeReader = new ZXing.BrowserMultiFormatReader();
      zxingReader = codeReader;
      codeReader.decodeFromStream(stream, video, (result)=>{
        if(result && state.cameraStream){ handleDetection(result.getText()); }
      });
    }catch(e){
      toast(t('cameraLibError'));
    }
  }
}
/* ===================== Zoom (pellizco / botones) sobre el recuadro de escaneo ===================== */
function setupPinchZoom(frame, video, track){
  if(!frame || !video) return;
  const caps = (track && track.getCapabilities) ? track.getCapabilities() : {};
  const nativeZoom = caps && typeof caps.zoom==='object';
  const zMin = nativeZoom ? (caps.zoom.min||1) : 1;
  const zMax = nativeZoom ? (caps.zoom.max||1) : 4;
  const zStep = nativeZoom ? (caps.zoom.step||0.1) : 0.1;
  state.scanZoomCaps = { native:nativeZoom, min:zMin, max:zMax, step:zStep };
  state.scanZoom = zMin>1 ? zMin : 1;
  video.style.transformOrigin = 'center center';

  function apply(zoom){
    zoom = Math.min(zMax, Math.max(zMin, zoom));
    state.scanZoom = zoom;
    if(nativeZoom && track){
      track.applyConstraints({ advanced:[{ zoom }] }).catch(()=>{});
    } else {
      // Sin soporte de zoom óptico: hacemos zoom digital agrandando el video con CSS.
      video.style.transform = `scale(${zoom})`;
    }
  }
  apply(state.scanZoom);

  // Controles +/- por si el pellizco no está disponible (ej. mouse en desktop).
  const controls = document.createElement('div');
  controls.className = 'zoom-controls';
  controls.innerHTML = `<button type="button" class="zoom-btn" data-zoom="out">−</button><button type="button" class="zoom-btn" data-zoom="in">+</button>`;
  frame.appendChild(controls);
  controls.addEventListener('click', (e)=>{
    const b = e.target.closest('[data-zoom]'); if(!b) return;
    const range = zMax - zMin || 3;
    const delta = range * 0.15 * (b.dataset.zoom==='in' ? 1 : -1);
    apply(state.scanZoom + delta);
  });

  // Pellizco con dos dedos.
  let pinchStartDist = null, pinchStartZoom = 1;
  function dist(t1,t2){ return Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY); }
  frame.addEventListener('touchstart', (e)=>{
    if(e.touches.length===2){
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartZoom = state.scanZoom;
    }
  }, { passive:true });
  frame.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2 && pinchStartDist){
      e.preventDefault();
      const newDist = dist(e.touches[0], e.touches[1]);
      const factor = newDist / pinchStartDist;
      const range = zMax - zMin || 3;
      apply(pinchStartZoom + (factor-1) * range);
    }
  }, { passive:false });
  frame.addEventListener('touchend', (e)=>{
    if(e.touches.length<2) pinchStartDist = null;
  }, { passive:true });
}
function stopCamera(){
  closeScanResultFloat(true);
  if(state.cameraLoopId) clearTimeout(state.cameraLoopId);
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader=null; }
  if(state.cameraStream){ state.cameraStream.getTracks().forEach(tr=>tr.stop()); }
  state.cameraStream = null; state.cameraLoopId = null;
  state.scanZoom = 1; state.scanZoomCaps = null;
  if(activeWrapId){ const wrap = document.getElementById(activeWrapId); if(wrap) wrap.innerHTML=''; }
  if(activeBtnId){ const btn = document.getElementById(activeBtnId); if(btn) btn.innerHTML = `${ICONS.camera} ${t('startCamera')}`; }
  activeWrapId = null; activeBtnId = null; activeOnDetect = null;
}
async function onCodeScanned(code){
  // Si el código detectado es el mismo que ya se está mostrando en la tarjeta flotante,
  // no reiniciamos nada: dejamos que la tarjeta y su temporizador de 1 minuto sigan como estaban.
  // Esto evita que la tarjeta parpadee/desaparezca en Android, donde BarcodeDetector puede
  // seguir confirmando el mismo código varias veces por segundo mientras el producto sigue en cámara.
  if(state.scanResult && state.scanResult.codigoEscaneado===code && document.getElementById('scanResultFloat')){
    return;
  }
  const now = Date.now();
  if(code===lastScanCode && (now-lastScanTime)<1500) return;
  lastScanCode = code; lastScanTime = now;
  closeScanResultFloat(true);
  const input = document.getElementById('scanInput'); if(input) input.value = code;
  if(state.scanMode==='cart' && toolVisible('carrito')){
    processCartScan(code);
  } else {
    processScan(code,false);
  }
}
/* ===================== Carrito compartido (en vivo, vía Supabase Realtime) =====================
   Cada producto escaneado en modo "Carrito" se guarda en la tabla `carrito` de Supabase.
   Todas las personas conectadas en modo Carrito ven la misma lista actualizarse en vivo.
   El carrito se considera "del día": solo se muestran/cuentan como duplicado los productos
   agregados desde la medianoche de hoy (hora local del dispositivo). */
function cartTodayStartISO(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString(); }
function findCartDuplicate(codigo){ return state.cart.find(it=>it.codigo_producto===codigo); }
async function loadCartToday(){
  try{
    const rows = await sb(`carrito?select=*&fecha=gte.${encodeURIComponent(cartTodayStartISO())}&order=fecha.desc`);
    // Conservamos las filas optimistas (tmp_...) que aún no confirma el servidor,
    // para que un poll a mitad de un POST no las haga parpadear o desaparecer.
    const pending = (state.cart||[]).filter(it=>
      String(it.id).indexOf('tmp_')===0 &&
      !(rows||[]).some(r=>r.codigo_producto===it.codigo_producto && r.codigo_persona===it.codigo_persona)
    );
    state.cart = [...pending, ...(rows||[])];
  }catch(e){ /* si falla la red, dejamos el carrito tal cual estaba en vez de vaciarlo */ }
  state.cartLoaded = true;
  updateCartListDOM();
}
function cartPersonOptions(){
  // Lista única de personas que han agregado algo hoy, para el filtro del carrito.
  const map = new Map();
  state.cart.forEach(it=>{
    const key = it.codigo_persona||'';
    if(!key || map.has(key)) return;
    map.set(key, it.nombre_persona||key);
  });
  return [...map.entries()].map(([codigo,nombre])=>({codigo,nombre}));
}
function canDeleteCartItem(it){
  // El admin y co-admin pueden borrar cualquier producto; cualquier otra persona
  // solo puede borrar lo que ella misma agregó (por si se equivocó al escanear).
  if(isAdmin() || isCoAdmin()) return true;
  return it.codigo_persona === normalize(state.session||'');
}
function renderCartList(){
  const canClear = isAdmin() || isCoAdmin();
  const persons = cartPersonOptions();
  const filter = state.cartFilterPersona||'';
  // El filtro solo afecta lo que se muestra: la verificación de duplicados (findCartDuplicate)
  // y el conteo del total siempre miran el carrito completo, no el filtrado.
  const items = filter ? state.cart.filter(it=>it.codigo_persona===filter) : state.cart;

function updateCartListDOM(){

  if(badge) badge.innerHTML = `🛒 ${inCartNow ? state.cart.length : ''}`;

    if(clearBtn) clearBtn.onclick = clearCartToday;

    if(filterSelect) filterSelect.onchange = ()=>{ state.cartFilterPersona = filterSelect.value; updateCartListDOM(); };
